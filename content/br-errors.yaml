# Catálogo de erros típicos de brasileiros. Regex aplicada ao texto do aluno (flags padrão: gi).
# Regras: padrões conservadores (poucos falsos positivos). Quando em dúvida, não detectar.
patterns:
  - id: doubt-question
    pattern: "\\b(i have|i've got|i got|i still have|i just have|i had) (a|one|another|a quick|a small|a little) doubt\\b|\\bany doubts?\\s*\\?"
    wrong: "I have a doubt"
    right: "I have a question / I'm not sure about…"
    why: "doubt = desconfiança. Dúvida no sentido de pergunta é question."
    tag: br.doubt
  - id: since-present-continuous
    pattern: "\\b(i'm|i am|we're|we are|he's|she's|it's|they're|they are)\\s+(?!going\\b)\\w+ing\\b[^.!?]{0,40}\\b(since (yesterday|today|last|this|monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|may|june|july|august|september|october|november|december|\\d|then|noon|lunch|morning)|for the last|for the past|for \\d+ (minutes|hours|days|weeks|months|years))\\b"
    wrong: "I'm working on this since yesterday"
    right: "I've been working on this since yesterday"
    why: "since/for exigem present perfect (continuous)."
    tag: br.since-present
  - id: until-as-deadline
    pattern: "\\b(will|'ll|can|could|should|going to|gonna|need to|have to|must|plan to|want to|try to|hope to)\\s+(finish|finishing|deliver|send|complete|merge|deploy|fix|be done|be ready|have it done|have it ready|get it done|do it|do this|do that)(\\s+(it|this|that|them|everything|the \\w+))?\\s+until\\b"
    wrong: "I will finish it until Friday"
    right: "I'll have it done by Friday"
    why: "until = duração; by = prazo."
    tag: br.until-by
  # br.until-late fica nos exercícios de reformulação: until late é válido,
  # e uma regex não distingue preferência por concisão de erro gramatical.
  - id: giving-error
    pattern: "\\b(giving|gives|gave|is giving|it's giving)\\s+errors?\\b"
    wrong: "It's giving error"
    right: "It's throwing an error / It's failing with… / It's timing out"
    why: 'Calque de "está dando erro".'
    tag: br.giving-error
  - id: waiting-no-preposition
    pattern: "\\bwaiting (the|a|an|my|your|his|her|their|our|him|them|you|me)\\b(?!\\s*(\\w+\\s+)?(minute|minutes|second|seconds|moment|sec|bit|while|few|couple|little|day|days|week|weeks|month|months|year|years|hour|hours|whole|entire|rest|all|long|time)\\b)"
    wrong: "I'm waiting the review"
    right: "I'm waiting on/for the review"
    why: "wait exige preposição (on/for)."
    tag: br.waiting-no-prep
  - id: explain-me
    pattern: "\\bexplain(s|ed)? (me|us|him|her|them) (the|a|an|this|that|how|what|why|my|your|our|it)\\b"
    wrong: "explain me"
    right: "explain to me / walk me through"
    why: "explain não aceita objeto indireto direto."
    tag: br.explain-me
  - id: pretend
    pattern: "\\b(i|we) pretend to (?!(be|have|know|like|care|understand|listen|agree)\\b)\\w+"
    wrong: "I pretend to finish today"
    right: "I intend to / I plan to finish today"
    why: "pretend = fingir."
    tag: br.pretend
  - id: assist-meeting
    pattern: "\\bassist(ed|ing)? (the|a|our|this|that) (meeting|call|daily|standup|stand-up|presentation|class|session)\\b"
    wrong: "assist the meeting"
    right: "attend the meeting"
    why: "assist = ajudar; attend = participar."
    tag: br.assist
  - id: make-a-question
    pattern: "\\bmake (a|one|some|two|three) questions?\\b"
    wrong: "make a question"
    right: "ask a question"
    why: "Perguntas são feitas com ask."
    tag: br.make-a-question
  - id: have-years-old
    pattern: "\\b(i|he|she|we|they) (have|has) \\d+ years\\b(?!\\s+(of|experience|working|in|at|with|on|as|left|remaining|until|to|before|ahead)\\b)"
    wrong: "I have 30 years"
    right: "I'm 30 (years old)"
    why: "Idade em inglês usa be."
    tag: br.have-years
  - id: people-is
    pattern: "(?<!\\bof\\s)\\bpeople (is|was|has|doesn't|isn't|wasn't)\\b"
    wrong: "people is"
    right: "people are"
    why: "people é plural."
    tag: br.people-is
  - id: discuss-about
    pattern: "\\bdiscuss(ed|ing)? about\\b"
    wrong: "discuss about the plan"
    right: "discuss the plan"
    why: "discuss é transitivo direto."
    tag: br.discuss-about
  - id: depend-of
    pattern: "\\bdepend(s|ed|ing)? of\\b"
    wrong: "depends of"
    right: "depends on"
    why: "depend on."
    tag: br.depend-of
  - id: according-with
    pattern: "\\baccording with\\b"
    wrong: "according with the docs"
    right: "according to the docs"
    why: "according to."
    tag: br.according-with
  - id: win-money
    pattern: "\\bwin(s|ning)? (a|my|his|her|their|our) ((good|better|higher|decent|fair|great|nice) )?(salary|wage|wages|income)\\b|\\bwin(s|ning)? (more|less|enough|good) money (per|a|each|every) (month|year|hour|week|day)\\b"
    wrong: "win money"
    right: "earn money / make money"
    why: "win = ganhar em competição; salário se earn/make."
    tag: br.win-money
  - id: lose-deadline
    pattern: "\\b(lose|lost|losing) (the|a|my|our|this) (deadline|bus|flight|train|appointment)\\b"
    wrong: "lose the deadline"
    right: "miss the deadline"
    why: "Perder hora/prazo/transporte é miss."
    tag: br.lose-the-deadline
  - id: do-modal
    pattern: "\\b(do|does|did|don't|doesn't|didn't) (you|i|we|they|he|she|it) (can|could|should|would|must|may|might)\\b"
    wrong: "Do you can check the logs?"
    right: "Can you check the logs?"
    why: "Auxiliar duplo: ou a pergunta com do/does ou o modal, nunca os dois."
    tag: br.do-modal
  - id: sorry-for-interrupt
    pattern: "\\bsorry for (interrupt|bother|jump)\\b"
    wrong: "Sorry for interrupt"
    right: "Sorry to interrupt / Sorry for interrupting"
    why: "\"sorry to\" + verbo ou \"sorry for\" + -ing."
    tag: br.sorry-for-interrupt
  - id: need-that-you
    pattern: "\\bneed(s|ed)? that you\\b"
    wrong: "I need that you check the config"
    right: "I need you to check the config"
    why: 'Calque de "preciso que você": need + pessoa + to.'
    tag: br.need-that-you
  # A lista de formas de passado é explícita porque \\w+ed pegaria "don't need" e "did you read".
  - id: did-past
    pattern: "\\b(did not|didn't|do not|don't|does not|doesn't|did|do|does) (you |i |we |they |he |she |it )?(worked|tried|fixed|deployed|merged|checked|looked|asked|talked|finished|started|stopped|dropped|watched|waited|wanted|opened|closed|used|played|turned|failed|passed|helped|tested|created|updated|reviewed|approved|pushed|pulled|restarted|rolled|logged|saved|changed|added|removed|deleted|configured|installed|understood|went|got|took|made|spoke|told|heard|left|lost|ran|said|sold|ate|drank|drove|threw|wrote|wore|broke|chose|forgot|began|brought|thought|bought|caught|taught|meant|sent|spent|built|held|kept|knew|grew|flew|swam|stole|stood|sat|paid|met|felt|won|saw|done|gone|been|seen|had|given|taken|written|broken|driven|eaten|fallen|forgotten|gotten|hidden|known|risen|shaken|shown|thrown|led)\\b"
    wrong: "I didn't understood the error"
    right: "I didn't understand the error"
    why: "Depois de do/does/did, o verbo fica na forma base (didn't understand)."
    tag: br.did-past
  - id: actually-currently
    pattern: "\\bactually,? (i|we|he|she|they)\\s*('m|am|'re|are|'s|is)\\s+\\w+ing\\b[^.!?,;]{0,40}\\b(now|nowadays|these days|at the moment|currently|right now)\\b|\\b(i|we|they) actually (work|works|use|uses|run|runs|live|lives|study|studies)\\b[^.!?,;]{0,40}\\b(now|nowadays|these days|at the moment|currently|right now)\\b"
    wrong: "Actually I'm working at a bank now"
    right: "Currently I'm working at a bank / I'm working at a bank now"
    why: "actually = na verdade (correção ou surpresa). Atualmente é currently / nowadays / at the moment."
    tag: br.actually
  - id: said-pronoun
    pattern: "\\b(say|says|said|saying) (me|him|her|us|them)\\b"
    wrong: "She said me to check the logs"
    right: "She told me to check the logs / She said to me…"
    why: "say não leva objeto indireto sem 'to'; o natural é tell + pessoa."
    tag: br.said-me
  - id: ask-to-pronoun
    pattern: "\\bask to (him|her|them|us|me|you)\\b"
    wrong: "Ask to him about the freeze"
    right: "Ask him about the freeze"
    why: 'Calque de "pergunte para ele": ask + pessoa, sem "to".'
    tag: br.ask-to
  # O (?!') protege "next week's meeting", que é correta.
  - id: prep-next
    pattern: "\\b(on|in|at) next (week|month|year|quarter|sprint|release|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b(?!')"
    wrong: "The deploy is on next week"
    right: "The deploy is next week"
    why: "next + período dispensa preposição (next week, next Monday)."
    tag: br.on-next
  - id: verb-to-pronoun-object
    pattern: "\\b(send|sent|sends|sending|forward|forwards|forwarded|forwarding|reply|replied|replies|replying) to (me|him|her|us|them) (the|a|an|this|that|my|your|our)\\b"
    wrong: "Can you send to me the runbook?"
    right: "Send me the runbook / Send the runbook to me"
    why: 'Calque de "me manda o arquivo": send + pessoa + objeto, ou send + objeto + to + pessoa.'
    tag: br.send-to-me
  - id: for-to
    pattern: "\\bfor to \\w+"
    wrong: "I read the doc for to find the flag"
    right: "I read the doc to find the flag"
    why: 'Calque de "para": o infinitivo de finalidade é só "to".'
    tag: br.for-to
  # Cada forma listada é sempre errada no inglês padrão; formas reais como
  # "sawed" (serrar), "flied" (beisebol) e "costed" (orçar) ficam de fora.
  - id: irregular-past
    pattern: "\\b(readed|finded|knowed|teached|thinked|catched|bringed|buyed|paied|sayed|selled|telled|builded|meeted|runned|winned|losed|losted|heared|speaked|wroted|goed|comed|gived|maked|taked|doed|haved|getted|feeled|keeped|sleeped|eated|drinked|drived|throwed|growed|swimmed|beginned|stealed|breaked|choosed|forgotted|weared|standed|cutted|hitted|shutted|splitted|hurted|letted|falled)\\b"
    wrong: "I readed the error message"
    right: "I read the error message"
    why: "Verbo irregular não leva -ed; a forma correta é a forma de passado própria."
    tag: br.irregular-past
  - id: more-er
    pattern: "\\bmore (easy|fast|big|cheap|short|long|quick|hard|slow|clean)\\b"
    wrong: "This doc is more easy to read"
    right: "This doc is easier to read"
    why: "Adjetivo curto faz comparativo com -er (easier, faster), não com more."
    tag: br.more-er
  # O lookahead protege usos atributivos como "in the internet age".
  - id: in-the-internet
    pattern: "\\bin the internet\\b(?! (age|era|world|industry))"
    wrong: "I found the workaround in the internet"
    right: "I found the workaround on the internet"
    why: 'Em inglês se diz "on the internet".'
    tag: br.in-the-internet
  # "listen in on" é phrasal verb correta ("escutar junto") — o alvo errado é só
  # port/interface/address/socket.
  - id: listen-in
    pattern: "\\blisten(s|ing|ed)? in (the |a |an )?(port|interface|address|socket)\\b"
    wrong: "The service listens in port 8080"
    right: "The service listens on port 8080"
    why: "Serviço escuta ON a porta/interface (listen on port 8080)."
    tag: br.listen-in
  - id: uncountable-plural
    pattern: "\\b(datas|informations|feedbacks|advices|equipments|softwares|knowledges)\\b"
    wrong: "The response returns the datas"
    right: "The response returns the data"
    why: "data, information, feedback, advice, equipment, software e knowledge são incontáveis — sem plural."
    tag: br.uncountable
  # Sujeitos de infra conhecidos + verbo sem -s; plurais ("the requests go") ficam fora da lista.
  - id: third-person-bare
    pattern: "\\b(the|this|that|it|he|she) (request|service|server|pod|cluster|gateway|proxy|database|cache|queue|worker|app|api|endpoint|container|instance|function|job|pipeline|load balancer|loadbalancer|ingress) (go|talk|hit|return|sit|listen|run|fail|pass|come|handle|call|point|expose|route|need|look|seem)\\b"
    wrong: "The request go through the gateway"
    right: "The request goes through the gateway"
    why: "Terceira pessoa do singular leva -s no present simple (the request goes)."
    tag: br.third-person-s
  # "arrive on/in" + alvo de infra é calque; "arrive on time" e "arrive in <cidade>" ficam fora.
  - id: arrive-on
    pattern: "\\b(arrive|arrives|arrived|arriving) (on|in) (the |a |an |my |your |our |this |that )?(server|service|host|endpoint|cluster|pod|node|machine|instance|api)\\b"
    wrong: "The request arrives on the server"
    right: "The request arrives at the server / reaches the server"
    why: 'Chegar a um ponto técnico é "arrive at" (ou reaches/hits); on/in é para lugar geográfico ou "on time".'
    tag: br.arrive-on
  # "steps for reproduce" é calque de "passos para reproduzir"; "steps for <outra coisa>" é correto.
  - id: steps-for-reproduce
    pattern: "\\bsteps? for reproduc(t|e|ing|ion)\\b"
    wrong: "Add steps for reproduce the bug"
    right: "Add steps to reproduce the bug"
    why: '"Passos para reproduzir" é "steps to reproduce" — infinitivo de finalidade.'
    tag: br.steps-for
  # "verify if" é calque de "verifique se"; o inglês pede "check whether/if" ou "verify" transitivo.
  - id: verify-if
    pattern: "\\bverif(y|ies|ied|ying) if\\b"
    wrong: "Please verify if the fix works"
    right: "Please check whether the fix works / verify the fix"
    why: '"Verify" não leva "if" — é "check whether/if" ou "verify" + objeto direto.'
    tag: br.verify-if
  # "merge in <branch>" é calque; restrito a nomes de branch para não pegar "merge in the changes".
  - id: merge-in
    pattern: "\\bmerge[sd]?( \\w+){0,3} in (the )?(main|master|develop|development|trunk|staging|prod|production|feature|release)\\b"
    wrong: "Merge the PR in main"
    right: "Merge the PR into main"
    why: "Merge de branch/PR é \"into\": merge into main."
    tag: br.merge-in
  - id: revert-back
    pattern: "\\brevert(s|ed|ing)? back\\b"
    wrong: "We should revert back the deploy"
    right: "We should revert the deploy / roll back the deploy"
    why: '"revert" já contém "back" — "revert back" é redundante.'
    tag: br.revert-back
  # "estimative" não existe em inglês — o substantivo é "estimate" (estimativa).
  - id: estimative
    pattern: "\\bestimatives?\\b"
    wrong: "My estimative is 3 story points"
    right: "My estimate is 3 story points"
    why: '"Estimativa" em inglês é "estimate" (ou "estimation" para o processo) — "estimative" não existe.'
    tag: br.estimative
  # "compromise" = concessão/acordo; "compromisso" (compromisso assumido, agenda) é "commitment".
  # Só a forma "have/has/had a compromise" é calque; o substantivo/verbo solto é inglês correto.
  - id: have-a-compromise
    pattern: "\\b(have|has|had) a compromise\\b"
    wrong: "I have a compromise at 3pm"
    right: "I have a commitment at 3pm / I have an appointment at 3pm"
    why: '"Compromise" é ceder dos dois lados; compromisso assumido é "commitment" (ou "appointment" para horário).'
    tag: br.compromise
  # "if + will" em condicional é calque de "se nós vamos"; exige fronteira de frase para
  # não pegar "if" = "se" (whether) em "I don't know if it will work".
  - id: if-will
    pattern: "(?:^|[.!?—;,]\\s*)if\\s+(we|i|you|they|it|he|she|the \\w+) will\\b"
    wrong: "If we will need more nodes, the cost goes up"
    right: "If we need more nodes, the cost goes up"
    why: 'Condicional real: "if" + presente, o "will" vai na oração principal.'
    tag: br.if-will
  # 3ª pessoa sem -s fora dos sujeitos de infra: "it/this/that make sense".
  # A fronteira de frase (ou verbo de opinião) protege "Does it make sense?".
  - id: it-makes-sense
    pattern: "(?:^|[.!?—;,]\\s*|\\b(?:think|say|guess|believe|hope|know|mean)\\s+)(it|this|that) make sense\\b"
    wrong: "It make sense to split the epic"
    right: "It makes sense to split the epic"
    why: 'Terceira pessoa leva -s: "it makes sense".'
    tag: br.it-makes-sense
  # "moral" (ética) ≠ "morale" (moral do time). Só dispara com sujeito de grupo;
  # "the moral of the story" e "moral support" ficam fora.
  - id: moral-vs-morale
    pattern: "\\b(team|group|company|crew|squad|engineering|dev) moral\\b(?!s)"
    wrong: "The team moral is low after the incident"
    right: "The team morale is low after the incident"
    why: '"Morale" (com e) = moral/ânimo do time; "moral" é ética ou a lição da história.'
    tag: br.morale
  # "do a mistake" é calque de "fazer um erro" — em inglês se "make a mistake".
  - id: do-a-mistake
    pattern: "\\b(do|did|done|doing) a mistake\\b"
    wrong: "We did a mistake in the last deploy"
    right: "We made a mistake in the last deploy"
    why: '"Make a mistake", nunca "do a mistake".'
    tag: br.do-mistake
  # -ing no lugar de -ed na 1ª pessoa: "I'm boring" quase sempre quer dizer "I'm bored".
  # Restrito a "I'm/I am" + lista fechada de emoções; "they're annoying" é inglês correto.
  - id: i-am-boring
    pattern: "\\b(i'm|i am)\\s+(boring|confusing|frustrating|annoying|embarrassing|disappointing|worrying|surprising)\\b"
    wrong: "I'm boring in these long meetings"
    right: "I'm bored in these long meetings"
    why: 'Quem sente leva -ed ("I''m bored"); o que causa a sensação leva -ing ("the meeting is boring").'
    tag: br.ed-ing
  # "a feedback" com artigo: feedback é incontável. Lookahead protege "a feedback loop/signal".
  - id: article-feedback
    pattern: "\\b(a|an|one|another|this|that) feedback\\b(?!\\s+(loop|loops|cycle|cycles|mechanism|signal|signals|control|system))"
    wrong: "She gave me a feedback about my presentation"
    right: "She gave me some feedback about my presentation / a piece of feedback"
    why: "Feedback é incontável — some feedback, a piece of feedback. ('A feedback loop' é outra coisa.)"
    tag: br.uncountable
  # "did a comment" é calque de "fiz um comentário" — em inglês se "leave a comment".
  # "made a comment" é inglês válido; o calque é só com do/did/does/doing.
  - id: did-a-comment
    pattern: "\\b(do|did|done|doing|does) a comment\\b"
    wrong: "I did a comment on your PR"
    right: "I left a comment on your PR"
    why: '"Leave a comment" — "do a comment" é calque. ("Made a comment" é válido.)'
    tag: br.did-comment
  # "seems me" é calque de "me parece" — o pronome vai depois de "to".
  - id: seems-me
    pattern: "\\bseems?\\s+(me|us|him|her|them)\\b"
    wrong: "The code seems me fine"
    right: "The code seems fine to me"
    why: '"Seems to me" — o pronome não cola no verbo. ("He seems tired" é outra estrutura.)'
    tag: br.seems-me
  # "according to me" é calque de "segundo eu" — opinião própria é "in my view" / "I think".
  - id: according-to-me
    pattern: "\\baccording to me\\b"
    wrong: "According to me, we should revert"
    right: "In my view, we should revert"
    why: '"According to" leva fonte externa (the docs, the logs); opinião própria é "in my view".'
    tag: br.according-to-me
  # "worth" não é verbo: "it worths" vira "it's worth" / "worth doing".
  - id: it-worths
    pattern: "\\bworths\\b"
    wrong: "It worths the refactor"
    right: "It's worth the refactor"
    why: '"Worth" não é verbo — "it''s worth it" ou "worth doing".'
    tag: br.worths
  # "it not works" — o auxiliar sumiu. A forma com -s depois de "not" é sempre
  # errada ("does not work" leva a base), então a lista de verbos basta.
  - id: it-not-works
    pattern: "\\bnot\\s+(works|fails|returns|fixes|helps|seems|starts|runs|responds|deploys|succeeds|crashes|loads|merges|builds|passes|breaks)\\b"
    wrong: "It not works on staging"
    right: "It doesn't work on staging"
    why: '"Not" precisa de auxiliar: doesn''t + forma base (não leva -s).'
    tag: br.it-not-works
  # "after/before/without to X" — depois de preposição vem gerúndio, não infinitivo.
  - id: after-to
    pattern: "\\b(after|before|without)\\s+to\\s+\\w+"
    wrong: "After to reproduce the bug, I checked the logs"
    right: "After reproducing the bug, I checked the logs"
    why: 'Depois de after/before/without, gerúndio: "after reproducing".'
    tag: br.after-to
  # "the same problem of yesterday" é calque de "o mesmo de" — inglês usa "same as".
  # Lista fechada: "same kind of error" (correto) fica fora.
  - id: same-of
    pattern: "\\bsame\\s+(problem|issue|error|bug|thing|version|behavior|result|question|one|message|failure|symptom|fix|cause)\\s+of\\b"
    wrong: "It's the same problem of yesterday"
    right: "It's the same problem as yesterday"
    why: '"The same X as" — "same X of" é calque. ("Same kind of" é outra estrutura.)'
    tag: br.same-of
  # "works in my machine" é calque de "na minha máquina" — inglês usa "on".
  - id: in-my-machine
    pattern: "\\b(works?|runs?|fails?|passes?|breaks?|crashes?|deploys?|builds?|fine|broken|green|red)\\s+in my machine\\b(?!\\s*learning)"
    wrong: "It works in my machine"
    right: "It works on my machine"
    why: '"On my machine" — "in my machine" é calque. ("In my machine learning" é outra coisa.)'
    tag: br.in-my-machine
  # "depends in" é calque de "depende em/de" — inglês é "depends on".
  # "depends in part (on)" é inglês correto e fica fora.
  - id: depends-in
    pattern: "\\bdepend(s|ed|ing)?\\s+in\\b(?!\\s*part\\b)"
    wrong: "The rollout depends in the flag"
    right: "The rollout depends on the flag"
    why: '"Depend on" — "depends in" é calque. ("Depends in part" é outra estrutura.)'
    tag: br.depends-in
  # "suggested me to X" é calque de "sugeriu para eu" — suggest não leva objeto indireto direto.
  - id: suggested-me
    pattern: "\\bsuggest(ed|s)?\\s+(me|him|her|us|them)\\s+to\\s+\\w+"
    wrong: "Ana suggested me to add a gate"
    right: "Ana suggested that I add a gate / suggested adding a gate"
    why: 'Suggest + that + sujeito, ou suggest + gerúndio — nunca "suggested me to".'
    tag: br.suggested-me
  # "apply the terraform" trata a ferramenta como o que se aplica — você aplica mudanças/config.
  # "terraform apply" (ordem do comando) fica fora porque "apply" precede "terraform" aqui.
  - id: apply-terraform
    pattern: "\\bappl(y|ied|ying|ies)\\s+(the\\s+)?terraform\\b"
    wrong: "I applied the terraform this morning"
    right: "I ran terraform apply this morning / applied the changes"
    why: 'Terraform não se "aplica" — "terraform apply" ou "apply the changes/config".'
    tag: br.apply-terraform
  # "the deploy was succeeded" — succeed/happen/occur são intransitivos, sem voz passiva.
  # "was succeeded by" (sucessão de pessoas) é legítimo e fica fora.
  - id: was-succeeded
    pattern: "\\b(was|were|is|are|been)\\s+(succeeded|happened|occurred)\\b(?!\\s+by\\b)"
    wrong: "The deploy was succeeded after the fix"
    right: "The deploy succeeded after the fix"
    why: 'Succeed/happen/occur não têm passiva — "it succeeded". ("Was succeeded by" é outra estrutura.)'
    tag: br.was-succeeded
  # "the pod is pending since 9am" — o calque com sujeito nominal: "is/are/was/were + -ing + since"
  # vira "has/have been -ing since". since-present-continuous só cobre pronomes; aqui a lista é
  # fechada de substantivos de infra. "has been running since" fica fora por construção.
  - id: is-ing-since
    pattern: "\\b(pods?|jobs?|deployments?|services?|nodes?|containers?|pods')\\s+(is|are|was|were)\\s+\\w+ing\\s+since\\b"
    wrong: "The pod is pending since 9am"
    right: "The pod has been pending since 9am"
    why: 'Com "since", o inglês pede present perfect continuous — "has been pending since".'
    tag: br.is-ing-since
  # "the pod is died" — died é verbo no passado; com is/are/was/were o certo é "dead" (adjetivo)
  # ou o passado simples "died". "is/are/was/were + dead" fica fora.
  - id: is-died
    pattern: "\\b(pods?|containers?|nodes?|jobs?|process(es)?|runners?|services?|servers?)\\s+(is|are|was|were)\\s+died\\b"
    wrong: "The pod is died — check the logs"
    right: "The pod is dead / the pod died"
    why: '"Died" já é passado — "the pod died"; com "is/was", o adjetivo é "dead".'
    tag: br.is-died
  # "I need see the logs" — need pede to + infinitivo. Lista fechada de verbos de troubleshooting;
  # "need the logs" (objeto nominal) e "need to see" ficam fora.
  - id: need-see
    pattern: "\\bneeds?\\s+(see|check|look|restart|describe|tail|watch|verify|inspect|get)\\b"
    wrong: "I need see the pod logs"
    right: "I need to see the pod logs"
    why: 'Need + to + infinitivo — "need to see/check/restart".'
    tag: br.need-see
  # "scheduled in the node" — pods rodam ON the node. "in the node pool/group/list" é aceitável
  # e fica fora via lookahead.
  - id: in-the-node
    pattern: "\\b(scheduled|running|runs|ran|placed|lands?|sits?|deployed|lives?)\\s+in\\s+the\\s+node\\b(?!\\s+(group|pool|list)\\b)"
    wrong: "The pod is scheduled in the node"
    right: "The pod is scheduled on the node"
    why: 'Pods rodam ON a node — "on the node", "scheduled on node-3".'
    tag: br.in-the-node
  # "please find in attachment" / "the logs are in attachment" — o calque de "em anexo":
  # inglês diz "attached" ou "in the attachment". Só dispara sem artigo — "in the attachment" fica fora.
  - id: in-attachment
    pattern: "\\bin attachment\\b"
    wrong: "Please find the report in attachment"
    right: "Please find the report attached / the report is attached"
    why: '"Em anexo" é "attached" — "see attached", "attached is the report".'
    tag: br.in-attachment
  # "best regrets" — a assinatura trocada: regards (cumprimentos) ≠ regrets (arrependimentos).
  - id: best-regrets
    pattern: "\\bbest regrets\\b"
    wrong: "Best regrets, Yuri"
    right: "Best regards, Yuri"
    why: '"Regrets" é arrependimento — o fecho é "best/kind regards".'
    tag: br.best-regrets
  # "I wait your reply" — wait pede for; "I await your reply" (formal) e "I'll wait for" ficam fora.
  - id: i-wait-reply
    pattern: "\\bi\\s+wait\\s+(your|the|a)\\s+(reply|response|feedback|answer|return|confirmation|approval)\\b"
    wrong: "I wait your reply to proceed"
    right: "I look forward to your reply / I await your reply"
    why: '"Aguardo retorno" vira "I look forward to your reply" ou "I await" — wait sozinho pede "for".'
    tag: br.i-wait-reply
  # "sorry for late" — late é adjetivo; ou "sorry for the delay" ou "sorry I'm late".
  # "sorry for the late reply" fica fora (tem "the" entre for e late).
  - id: sorry-for-late
    pattern: "\\bsorry\\s+(for|about)\\s+late\\b"
    wrong: "Sorry for late — the deploy took longer"
    right: "Sorry for the delay / sorry I'm late"
    why: '"Desculpa o atraso" é "sorry for the delay" ou "sorry I''m late" — "late" sozinho é adjetivo.'
    tag: br.sorry-for-late
  # "runs on the cloud" — o calque de "na nuvem": inglês diz "in the cloud".
  # "on the cloud platform/provider" fica fora — aí "on" pertence à plataforma.
  - id: on-the-cloud
    pattern: "\\bon the cloud\\b(?!\\s+(platform|provider))"
    wrong: "The service runs on the cloud"
    right: "The service runs in the cloud"
    why: '"Na nuvem" é "in the cloud" — "on the cloud" só cola com platform/provider.'
    tag: br.on-the-cloud
  # "provisionate" — provisionar → provision; o sufixo -ate não existe aqui.
  - id: provisionate
    pattern: "\\bprovisionat(e|ed|es|ing)\\b"
    wrong: "Terraform will provisionate the VM"
    right: "Terraform will provision the VM"
    why: '"Provisionar" é "provision" — provisioning, provisioned; "provisionate" não existe.'
    tag: br.provisionate
  # "migrate for AWS" — migrar PARA um provedor é "to"; for = motivo ("for better pricing").
  - id: migrate-for
    pattern: "\\bmigrat(e|ed|es|ing|ion|ions)\\s+for\\s+(aws|azure|gcp|google cloud|the cloud|another provider|a new provider)\\b"
    wrong: "We want to migrate for AWS next quarter"
    right: "We want to migrate to AWS next quarter"
    why: '"Migrar para" é "migrate to" — "for" marca o motivo: "we migrate for cost".'
    tag: br.migrate-for
  # "recommend to use" — recommend pede gerúndio: "recommend using".
  # Lista fechada de verbos — "recommend to the team" e "recommended X to us" ficam fora.
  - id: recommend-to
    pattern: "\\brecommend(s|ed|ing)?\\s+to\\s+(use|run|choose|pick|adopt|deploy|buy|migrate|host)\\b"
    wrong: "I recommend to use spot instances"
    right: "I recommend using spot instances"
    why: '"Recomendo usar" é "recommend using" — "recommend to" só com pessoa: "recommend to the team".'
    tag: br.recommend-to
  # "in this moment" — calque de "neste momento" em status update; inglês: "right now" / "at this moment".
  - id: in-this-moment
    pattern: "\\bin this moment\\b"
    wrong: "In this moment we are investigating the cause"
    right: "Right now we are investigating the cause"
    why: '"Neste momento" vira "right now" ou "at this moment" — "in this moment" é calque.'
    tag: br.in-this-moment
  # "thanks for the patience" — "obrigado pela paciência" pede "your patience" ou "bearing with us".
  - id: thanks-patience
    pattern: "\\bthanks?(\\s+you)?\\s+for\\s+the\\s+patience\\b"
    wrong: "Thanks for the patience — more news at 4pm"
    right: "Thanks for your patience — more news at 4pm"
    why: '"Pela paciência" é "for your patience" — ou "thanks for bearing with us".'
    tag: br.thanks-patience
  # "as soon possible" — falta o segundo "as" de "as soon as possible".
  - id: asap-missing-as
    pattern: "\\bas soon possible\\b"
    wrong: "We'll update you as soon possible"
    right: "We'll update you as soon as possible"
    why: 'Falta o segundo "as": "as soon as possible" (ou "as soon as we can").'
    tag: br.asap-missing-as
  # "the service normalized" — "normalizou" é calque; inglês de status update diz "recovered".
  - id: normalized
    pattern: "\\b(service|api|site|system|app|traffic|latency|error rate)s?\\s+(has\\s+|have\\s+)?normalized\\b"
    wrong: "The service normalized after the rollback"
    right: "The service recovered after the rollback"
    why: '"Normalizou" em update é "recovered" ou "is back to normal" — normalized é calque.'
    tag: br.normalized
  # "confirm me / say me" — "me confirma/me diz": confirm não leva pessoa como objeto direto.
  - id: confirm-me
    pattern: "\\b(confirm|say|reply|answer)\\s+me\\b"
    wrong: "Can you confirm me the deploy is live?"
    right: "Can you confirm the deploy is live? / tell me"
    why: '"Me confirma" é "confirm it" ou "tell me" — confirm não leva "me" antes.'
    tag: br.confirm-me
  # "listen you" — "te escuto": escutar alguém é "hear you" ou "listen TO you".
  - id: listen-you
    pattern: "\\blisten\\s+(you|him|her|them|us)\\b"
    wrong: "I can't listen you — speak up"
    right: "I can't hear you / listen to you"
    why: '"Escutar alguém" é "hear you"; "listen" pede "to" — "listen to you".'
    tag: br.listen-you
  # "the call fell" — "a ligação caiu" é "dropped"; sujeitos restritos a call/connection/line.
  - id: call-fell
    pattern: "\\b(call|calls|connection|meeting|line)s?\\s+(fell|fall|falls)\\b"
    wrong: "The call fell twice already"
    right: "The call dropped twice already"
    why: '"A ligação caiu" é "the call dropped" — fell é calque de "caiu".'
    tag: br.call-fell
  # "stay in the line" — "fica na linha" é "on the line"; verbos restritos a stay/hold/wait.
  - id: in-the-line
    pattern: "\\b(stay|stays|hold|holds|wait|waits|stand|stands)\\s+in the line\\b"
    wrong: "Stay in the line while I check"
    right: "Stay on the line while I check"
    why: '"Na linha" (telefone) é "on the line" — "in line" é fila.'
    tag: br.in-the-line
  # "in Friday" — "na sexta" é "on Friday"; o (?!') protege "in Friday's post-mortem".
  - id: in-weekday
    pattern: "\\bin (monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b(?!')"
    wrong: "The post-mortem is in Friday"
    right: "The post-mortem is on Friday"
    why: 'Dia da semana pede "on" — "on Friday".'
    tag: br.in-weekday
  # "was wrote" — passiva com passado em vez de particípio; lista fechada de irregulares.
  - id: was-past
    pattern: "\\b(was|were|been)\\s+(wrote|ran|forgot|chose|spoke|broke|took|ate|drove|gave|fell|began|knew|grew|flew|threw|wore|saw|stole|swam|went|drank)\\b"
    wrong: "The rollback was ran at 17:52"
    right: "The rollback was run at 17:52"
    why: 'Depois de was/were/been vem o particípio — "was run", "was written".'
    tag: br.was-past
  # "contributed for" — "contribuiu para" é "contributed to"; só formas verbais,
  # "a contribution for the victims" fica fora.
  - id: contributed-for
    pattern: "\\bcontribut(e|ed|es|ing)\\s+for\\b"
    wrong: "The missing test contributed for the outage"
    right: "The missing test contributed to the outage"
    why: '"Contribuir para" é "contribute to".'
    tag: br.contributed-for
  # "the incident of Friday" — "o incidente de sexta" é "Friday's incident" ou "on Friday";
  # substantivos e dias em listas fechadas.
  - id: of-weekday
    pattern: "\\b(incident|post-?mortem|deploy|rollback|outage|alert|meeting|call|release)\\s+of\\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b"
    wrong: "The incident of Friday hit the checkout"
    right: "Friday's incident hit the checkout / the incident on Friday"
    why: '"O incidente de sexta" é "Friday''s incident" ou "the incident on Friday".'
    tag: br.of-weekday
  # "the latency raised" — raise é transitivo; sujeitos restritos a substantivos de métrica.
  - id: metric-raised
    pattern: "\\b(latency|traffic|errors?|error rate|load|usage|cpu|memory|disk|requests?|spikes?|throughput|p95|p99|the rate|the load|the cost)\\s+(raise|raises|raised)\\b"
    wrong: "The latency raised to 800ms"
    right: "The latency rose to 800ms / went up"
    why: '"A latência subiu" é "rose/went up" — "raise" pede objeto ("we raised the limit").'
    tag: br.metric-raised
  # "the CPU is in 80%" — "em 80%" é calque; métricas ficam "at" o valor.
  - id: in-percent
    pattern: "\\b(is|are|was|were|stays?|remains?|sitting|sits)\\s+(at\\s+)?in\\s+\\d+(\\.\\d+)?\\s*%"
    wrong: "The CPU is in 80% already"
    right: "The CPU is at 80%"
    why: '"Está em 80%" é "at 80%" — "in" não marca percentual.'
    tag: br.in-percent
  # "we have a latency of 200ms" — "temos uma latência de" é calque; "the latency is".
  - id: have-a-latency
    pattern: "\\b(have|has|had)\\s+an?\\s+(latency|error rate|throughput|availability|uptime|utilization)\\s+of\\b"
    wrong: "We have a latency of 200ms on p99"
    right: "The p99 latency is 200ms"
    why: '"Temos uma latência de X" vira "the latency is X".'
    tag: br.have-a-latency
  # "overpassed" — "ultrapassou" é "exceeded"; sujeitos restritos a métricas.
  - id: overpassed
    pattern: "\\b(pool|traffic|latency|cost|usage|demand|load|cpu|memory|disk|budget|requests?|quota|capacity)\\s+overpass(ed|es|ing)?\\b"
    wrong: "The pool overpassed the limit"
    right: "The pool exceeded the limit"
    why: '"Ultrapassou" é "exceeded" — "overpassed" não existe como verbo aqui.'
    tag: br.overpassed
  # "explored the vulnerability" — "explorou" é exploited; explored = explorou opções.
  - id: explored-vuln
    pattern: "\\bexplor(ed|ing)\\s+(the\\s+|a\\s+|an\\s+|this\\s+)?(vuln|vulnerability|vulnerabilities|flaw|weakness|cve|bug)\\b"
    wrong: "The attacker explored the vulnerability"
    right: "The attacker exploited the vulnerability"
    why: '"Explorar a falha" é "exploited" — "explored" é "explorou opções".'
    tag: br.explored-vuln
  # "the finding is critic" — "crítico" é critical; "critic" é a pessoa que critica.
  - id: is-critic
    pattern: "\\b(is|it's|its|seems|looks|remains|stays|became|becomes)\\s+critic\\b"
    wrong: "The finding is critic — patch today"
    right: "The finding is critical — patch today"
    why: '"Crítico" é "critical" — "critic" é quem critica ("a film critic").'
    tag: br.is-critic
  # "in compliance to" — "em conformidade com" é "in compliance with".
  - id: in-compliance-to
    pattern: "\\bin compliance (to|of)\\b"
    wrong: "We're in compliance to the policy"
    right: "We're in compliance with the policy"
    why: '"Em conformidade com" é "in compliance with".'
    tag: br.in-compliance-to
  # "must to fix" — modal nunca leva "to" depois ("want/have/used to" ficam fora;
  # "can" fica fora de propósito: "a can to open" é legítimo).
  - id: modal-to
    pattern: "\\b(must|should|could|would|may|might|shall)\\s+to\\s+\\w+"
    wrong: "We must to fix this today"
    right: "We must fix this today"
    why: 'Modal + verbo direto — "must fix", nunca "must to fix".'
    tag: br.modal-to
  # "the price is expensive" — preço é high/low; expensive descreve o item.
  - id: price-expensive
    pattern: "\\b(the |this |that )?(price|prices|cost|costs|rate|rates|fee|fees|bill|bills)\\s+(is|are|was|were|looks?|seems?|feels?|got|gets?|getting)\\s+(so |very |really |too |quite |pretty )?(expensive|cheap)\\b"
    wrong: "The price is expensive for that tier"
    right: "The price is high for that tier"
    why: 'Preço/custo é "high" ou "low" — "expensive"/"cheap" descrevem o item ("the instance is cheap").'
    tag: br.price-expensive
  # "an economy of $40k" — "uma economia de X" é "a saving of X";
  # exige valor ($/dígito) — "the economy of Brazil", "economies of scale" ficam fora.
  - id: an-economy-of
    pattern: "\\ban? economy of\\s+(about |around |roughly |nearly |up to |~)?(\\$|€|£|\\d)"
    wrong: "Right-sizing brings an economy of $40k a year"
    right: "Right-sizing brings a saving of $40k a year"
    why: '"Uma economia de X" é "a saving of X" — economy é a economia do país.'
    tag: br.an-economy
  # "spend money with" — "gastar com" é "spend on"; "spend time with" fica fora.
  - id: spend-with
    pattern: "\\bspend(s|ing|t)?\\s+((money|the budget|most of the budget|too much|a lot|much|more|less)\\s+with\\b|\\$[\\d.,kmb]+\\b[^.]{0,25}?\\bwith\\b|\\d+(\\.\\d+)?\\s?(k|m|b|dollars)\\b[^.]{0,25}?\\bwith\\b)"
    wrong: "We spend too much with the vendor"
    right: "We spend too much on the vendor"
    why: '"Gastar dinheiro com" é "spend money on" — "with" é para pessoas ("spend time with").'
    tag: br.spend-with
  # "the half of the bill" — "a metade de" é "half the" ou "half of the";
  # "the" antes de half só em "the first/second half" (fora: exige "the" depois de of).
  - id: the-half-of
    pattern: "\\bthe half of the\\b"
    wrong: "Compute is the half of the bill"
    right: "Compute is half the bill"
    why: '"A metade de X" é "half of X" ou "half the X" — sem "the" antes de half.'
    tag: br.the-half
  # "I am agree" — "eu concordo" é "I agree"; agree é verbo, não adjetivo.
  - id: am-agree
    pattern: "\\b(i|we|they|he|she|you)\\s*(am|is|are|'m|'re|'s)\\s+agree\\b"
    wrong: "I am agree with the decision"
    right: "I agree with the decision"
    why: '"Agree" é verbo — "I agree", nunca "I am agree".'
    tag: br.i-am-agree
  # "chose X instead Y" — falta o "of": "instead of Y".
  # Exige determinante ou maiúscula depois — "instead, we…" e "stayed instead" ficam fora.
  - id: instead-of-missing
    pattern: "\\binstead\\s+(?!of\\b|we\\b|i\\b|they\\b|he\\b|she\\b|you\\b|it\\b)\\w+\\b"
    wrong: "We chose Kafka instead RabbitMQ"
    right: "We chose Kafka instead of RabbitMQ"
    why: '"Em vez de" é "instead of" — nunca "instead" direto.'
    tag: br.instead-of
  # "the same X than" — "o mesmo que" é "the same as", nunca "than".
  - id: same-than
    pattern: "\\bthe same\\s+\\w+\\s+than\\b"
    wrong: "We get the same result than before"
    right: "We get the same result as before"
    why: '"The same" pede "as" — "than" é só de comparativo.'
    tag: br.same-than
  # "we are in risk" — "em risco" é "at risk".
  # O lookahead protege "works in risk management/assessment".
  - id: in-risk
    pattern: "\\b(am|is|are|was|were|'m|'re|'s)\\s+in\\s+risk\\b(?!\\s+management|\\s+assessment)"
    wrong: "We are in risk of losing data"
    right: "We are at risk of losing data"
    why: '"Em risco" é "at risk" — "in risk" não existe.'
    tag: br.in-risk
  # "risk to fail" — "risco de falhar" é "risk of failing".
  # Substantivos e verbos restritos: "chance to win" e "risk to reward" ficam fora.
  - id: risk-to
    pattern: "\\b(risk|possibility|probability|likelihood)\\s+to\\s+(fail|happen|occur|lose|leak|break|go wrong)\\b"
    wrong: "There's a risk to fail the migration"
    right: "There's a risk of failing the migration"
    why: '"Risco de" é "risk of" + -ing — nunca "risk to".'
    tag: br.risk-to
  # "compensates the risk" — "compensar o risco" é "offset the risk".
  # Objetos restritos: "compensate the victims" fica fora.
  - id: compensate-risk
    pattern: "\\bcompensate(s|d)?\\s+(the|that|this)\\s+(risk|loss|exposure|downside)\\b"
    wrong: "The discount compensates the risk"
    right: "The discount offsets the risk"
    why: '"Compensar" risco é "offset" — "compensate" é para pessoas/prejuízos.'
    tag: br.compensate-risk
  # "the change is danger" — "é perigoso" é "dangerous".
  # "The danger is real" e "a danger zone" ficam fora.
  - id: is-danger
    pattern: "\\b(is|'s|seems|looks|sounds)\\s+danger\\b(?!\\s+(zone|of|to|that|when))"
    wrong: "The change is danger for the data"
    right: "The change is dangerous for the data"
    why: '"Perigoso" é "dangerous" — "danger" é o substantivo.'
    tag: br.is-danger
  # "this is polemic" — "polêmico" é "controversial" (falso amigo).
  # "He wrote a polemic against X" (substantivo) fica fora.
  - id: polemic-adjective
    pattern: "\\b(is|'s|seems|sounds|looks|too|very|quite|so|really|pretty|more|most|less|least|highly|still|gets?|got|became|remains?|remained)\\s+polemic(al)?\\b|\\bpolemic(al)?\\s+(topic|issue|question|decision|change|subject|point|debate|design|choice|move|one)\\b"
    wrong: "This design is polemic in the team"
    right: "This design is controversial in the team"
    why: '"Polemico" e "controversial" — "polemic" e um substantivo raro (invectiva).'
    tag: br.polemic
  # "you agree, no?" — o "ne?" vira tag question ("right?", "don't you?").
  - id: no-tag
    pattern: ",\\s*no\\s*\\?"
    wrong: "You agree, no?"
    right: "You agree, right? / don't you?"
    why: '"Ne?" em ingles e a tag question: "right?", "don''t you?".'
    tag: br.no-tag
  # "in my vision" — "na minha visao" (opiniao) e "in my view".
  # "in my vision of the future" (imagem mental) fica fora.
  - id: in-my-vision
    pattern: "\\bin my vision\\b(?!\\s+of\\b)"
    wrong: "In my vision, the monolith wins"
    right: "In my view, the monolith wins"
    why: '"Na minha visao" (opiniao) e "in my view" / "the way I see it".'
    tag: br.in-my-vision
  # "I didn't see nothing" — dupla negacao: "didn't see anything".
  # "he saw nothing" (sem auxiliar negativo) fica fora.
  - id: double-negative
    pattern: "\\b(don't|doesn't|didn't|can't|cannot|won't|wouldn't|couldn't|shouldn't|isn't|aren't|wasn't|weren't|haven't|hasn't|hadn't|ain't)\\s+(\\w+\\s+){0,2}(nothing|nobody|nowhere|no one)\\b"
    wrong: "I didn't see nothing wrong with the plan"
    right: "I didn't see anything wrong with the plan"
    why: 'Ingles nao dobra a negacao: "didn''t ... anything".'
    tag: br.double-negative
  # "make a question" — "fazer uma pergunta" é "ask a question".
  # "made the questions harder" (criar questões) fica fora — exige "a question".
  - id: make-question
    pattern: "\\b(make|makes|made|making)\\s+a\\s+question\\b"
    wrong: "Can I make a question about the demo?"
    right: "Can I ask a question about the demo?"
    why: '"Fazer uma pergunta" é "ask a question" — "make" cria, não pergunta.'
    tag: br.make-question
  # "in the screen" — "na tela" (conteúdo exibido) é "on the screen".
  # Exige verbo/contexto visual antes — "pixels in the screen" (hardware) fica fora.
  - id: in-the-screen
    pattern: "\\b(see|shown|shows?|appears?|displayed|right there|here|as you can see)\\s+[^.]{0,40}in (the|my|this|your) screen\\b"
    wrong: "As you can see in the screen, latency spiked"
    right: "As you can see on the screen, latency spiked"
    why: '"Na tela" é "on the screen" — "in" é para dentro do hardware.'
    tag: br.in-the-screen
  # "the graphic shows" — "gráfico" é "graph/chart", não "graphic".
  # "graphic design" e "graphic novel" ficam fora.
  - id: the-graphic
    pattern: "\\bthe graphic (shows?|above|below|here|tells|says|depicts)\\b|\\bin the graphic\\b"
    wrong: "The graphic shows the latency spike"
    right: "The graph shows the latency spike"
    why: '"Gráfico" é "graph" ou "chart" — "graphic" é design/imagem.'
    tag: br.the-graphic
  # "I want that you see" — "quero que você veja" é "I want you to see".
  # Pessoas restritas — "I want that feature" fica fora.
  - id: want-that
    pattern: "\\b(want|need|'d like|would like)\\s+that\\s+(you|they|he|she|we|the team|everyone|everybody|people)\\b"
    wrong: "I want that you see the error rate"
    right: "I want you to see the error rate"
    why: '"Quero que você" é "want you to" — "want that" só leva coisa.'
    tag: br.want-that

  # "commented in the PR" — comentar EM inglês é "comment on".
  # Exige sujeito + verbo antes — "the comments in the code" (substantivo) fica fora.
  - id: comment-in
    pattern: "\\b(i|we|you|he|she|they)\\s+comment(ed|s|ing)?\\s+in\\s+(the|this|that|a|his|her|your|my)\\b"
    wrong: "I commented in the PR yesterday"
    right: "I commented on the PR yesterday"
    why: '"Comentar em" é "comment on". ("The comments in the code" é substantivo — válido.)'
    tag: br.comment-in
  # "do a suggestion" — "fazer uma sugestão" é "make a suggestion".
  # "do a survey" é legítimo; só "suggestion" dispara.
  - id: do-suggestion
    pattern: "\\b(do|did|done|doing|does)\\s+a\\s+suggestion\\b"
    wrong: "Can I do a suggestion here?"
    right: "Can I make a suggestion here?"
    why: '"Fazer uma sugestão" é "make a suggestion" — "do" não combina.'
    tag: br.do-suggestion
  # "suggest to change" — "sugiro mudar" é "suggest changing" ou "suggest that we change".
  # Exige "to" + verbo conhecido — "suggested to him that" (pessoa) fica fora.
  - id: suggest-to
    pattern: "\\bsuggest(s|ed|ing)?\\s+to\\s+(be|do|make|change|use|add|move|split|keep|merge|roll|try|fix|go|wait|have|take|get|start|stop)\\b"
    wrong: "I suggest to change the default"
    right: "I suggest changing the default / I suggest that we change it"
    why: '"Suggest" não leva infinitivo — gerúndio ("suggest changing") ou "that". ("Suggested to him that…" é válido.)'
    tag: br.suggest-to
  # "in the other hand" — "por outro lado" é "on the other hand".
  # "in my other hand" (físico) fica fora — só "in (the) other hand".
  - id: in-other-hand
    pattern: "\\bin\\s+(the\\s+)?other\\s+hand\\b"
    wrong: "In the other hand, the rewrite is risky"
    right: "On the other hand, the rewrite is risky"
    why: '"Por outro lado" é "on the other hand" — "in" é para mão física ("in my other hand").'
    tag: br.in-other-hand
