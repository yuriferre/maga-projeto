# Avaliação do módulo M01: 15 itens cobrindo as cinco aulas + escrita + fala.
id: M01
title: "Avaliação do módulo M01: daily standups"
intro: |
  Quinze itens objetivos, uma escrita e uma gravação. Sem consulta. Você não vê o resultado item a item até terminar.

  **Aprovação:** itens ≥ 75 %, escrita com autoavaliação ≥ 3, fala ≥ 3/5. Pode refazer; vale a última.
items:
  - { id: M01-A01, type: fill_blank, prompt: "I ___ (work) on the alerting rules since Tuesday.", accepted: ["have been working", "'ve been working", "have worked", "'ve worked"], explanation: "since marca o início de um período que chega até agora. Have been working destaca a atividade em andamento; have worked também é válido aqui. Am working since não expressa esse período corretamente.", tags: [gram.since-for, br.since-present] }
  - { id: M01-A02, type: multiple_choice, prompt: "Which sentence sets a deadline?", options: ["I'll be on this until Friday.", "I'll have it done by Friday.", "I worked on it for Friday.", "I'm working on it since Friday."], answer: 1, explanation: "by = prazo final. until = duração; for/since marcam tempo decorrido.", tags: [gram.by-until, br.until-by] }
  - { id: M01-A03, type: error_correction, prompt: "Reescreva com present perfect para destacar o estado atual, sem mudar o restante: I didn't merge the PR yet.", accepted: ["I haven't merged the PR yet."], explanation: "Haven't merged + yet destaca que o PR continua sem merge. Didn't merge ... yet também ocorre no inglês americano; aqui a tarefa pede praticar present perfect.", tags: [gram.still-yet-already, gram.present-perfect, vocab.tickets-prs] }
  - { id: M01-A04, type: multiple_choice, prompt: "Which update is the clearest?", options: ["It's almost done, almost.", "Everything is broken, I don't know.", "The tests are taking longer than expected; I'll need another day.", "Sorry, sorry, I'm so slow."], answer: 2, explanation: "Diz o problema, o impacto e o novo prazo. As outras não dão informação.", tags: [topic.daily, vocab.standup] }
  - { id: M01-A05, type: error_correction, prompt: "Corrija apenas as duas preposições, sem mudar o restante: The canary rollout depends of Ana's approval, so I'm waiting her reply.", accepted: ["The canary rollout depends on Ana's approval, so I'm waiting on her reply.", "The canary rollout depends on Ana's approval, so I'm waiting for her reply."], explanation: "Uma dependência usa depends on; esperar uma resposta usa waiting for ou waiting on. É preciso corrigir depends of e acrescentar a preposição depois de waiting.", tags: [br.depend-of, br.waiting-no-prep] }
  - { id: M01-A06, type: error_correction, prompt: "Você quer fazer uma pergunta sobre o rollout, sem expressar desconfiança. Troque apenas o substantivo inadequado: I have a doubt about the rollout.", accepted: ["I have a question about the rollout."], explanation: "Question expressa uma pergunta. Doubt pode expressar incerteza ou desconfiança, mas não é a escolha para anunciar uma pergunta neste contexto.", tags: [br.doubt] }
  - { id: M01-A07, type: translate, prompt: "O job está dando erro de permissão.", accepted: ["The job is failing with a permission error.", "The job is failing with a permission error", "The job is throwing a permission error.", "The job is throwing a permission error", "The job fails with a permission error.", "The job fails with a permission error"], explanation: "Giving error é calque. Para este erro de permissão, use fail with a permission error ou throw a permission error.", tags: [br.giving-error, vocab.errors] }
  - { id: M01-A08, type: translate, prompt: "Traduza usando out of e runs: O pipeline passou em sete de dez execuções.", accepted: ["The pipeline passed seven out of ten runs.", "The pipeline passed 7 out of 10 runs.", "The pipeline passed seven out of 10 runs.", "The pipeline passed 7 out of ten runs.", "The pipeline passed in seven out of ten runs.", "The pipeline passed in 7 out of 10 runs.", "The pipeline passed in seven out of 10 runs.", "The pipeline passed in 7 out of ten runs."], explanation: "Seven out of ten runs = sete de dez execuções, ou 70%. Passed indica sucesso nas execuções do pipeline de CI; o in depois de passed é opcional.", tags: [gram.numbers-percentages, vocab.standup, vocab.ci] }
  - { id: M01-A09, type: multiple_choice, prompt: "A detailed discussion of the failed canary starts during standup. Priya says 'Let's take that offline.' Which Slack follow-up keeps the discussion focused and actionable?", options: ["@channel Everyone join a call now; I'll explain the canary from scratch.", "The canary failed. Someone should look at it sometime.", "@Ana Following up on the canary: here's the run link. Can you check the readiness probe in this thread by noon?", "Let's debug every failed probe in tomorrow's standup."], answer: 2, explanation: "Take that offline aqui significa continuar o detalhe fora do standup. O follow-up marca a pessoa, dá contexto e link, mantém as respostas na thread e faz um pedido com prazo.", tags: [topic.async, vocab.slack, vocab.standup] }
  - { id: M01-A10, type: error_correction, prompt: "Corrija os trechos entre colchetes sem mudar o restante: I [pretend to] [discuss about] the rollout with Ana before requesting [access for] staging. Pretendo: use plan, intend ou be going to.", accepted: ["I plan to discuss the rollout with Ana before requesting access to staging.", "I intend to discuss the rollout with Ana before requesting access to staging.", "I'm planning to discuss the rollout with Ana before requesting access to staging.", "I'm intending to discuss the rollout with Ana before requesting access to staging.", "I'm going to discuss the rollout with Ana before requesting access to staging."], explanation: "Pretend significa fingir. Para intenção, cabem plan/intend to, suas formas com -ing ou be going to. Discuss recebe o assunto sem about; acesso a um ambiente é access to staging. A preposição depende da expressão: não há uma regra única de on/in para toda infraestrutura.", tags: [br.pretend, br.discuss-about, gram.prepositions-infra] }
  - { id: M01-A11, type: multiple_choice, prompt: "Today I ___ shadow Marcos on the deploy.", options: ["going to", "am going to", "will going", "go to"], answer: 1, explanation: "Plano decidido: be going to (com o verbo be).", tags: [gram.future-plans] }
  - { id: M01-A12, type: error_correction, prompt: "Troque actually por currently, right now ou at the moment, ajustando só sua posição: Actually I'm working on the platform team's migration. (= atualmente)", accepted: ["Currently I'm working on the platform team's migration.", "I'm currently working on the platform team's migration.", "Right now I'm working on the platform team's migration.", "At the moment I'm working on the platform team's migration.", "I'm working on the platform team's migration currently.", "I'm working on the platform team's migration right now.", "I'm working on the platform team's migration at the moment.", "Currently, I'm working on the platform team's migration.", "Right now, I'm working on the platform team's migration.", "At the moment, I'm working on the platform team's migration."], explanation: "Actually significa na verdade, corrigindo ou contrastando informação. Atualmente é currently, right now ou at the moment. Working on se refere ao projeto: the platform team's migration.", tags: [br.actually] }
  - { id: M01-A13, type: multiple_choice, prompt: "Once security approves the IAM policy, I can restore the backup ___ thirty minutes of that approval.", options: ["until", "by", "for", "within"], answer: 3, explanation: "Within thirty minutes of that approval estabelece uma janela de até trinta minutos contada a partir da aprovação. By precisa de um ponto final, como by noon; until marca até quando uma situação continua; for indica duração.", tags: [gram.time-expressions, gram.by-until] }
  - { id: M01-A14, type: error_correction, prompt: "Para um update conciso, substitua stayed until late por stayed late ou worked late e corrija lost the deadline: I stayed until late and we lost the deadline anyway.", accepted: ["I stayed late and we missed the deadline anyway.", "I worked late and we missed the deadline anyway."], explanation: "Stayed late e worked late são formas naturais e concisas de dizer que ficou trabalhando até tarde neste standup. Until late existe, por exemplo em The maintenance window runs until late tonight; não é proibido em geral. Não cumprir o prazo é miss the deadline.", tags: [br.until-late, br.lose-the-deadline] }
  - { id: M01-A15, type: multiple_choice, prompt: "Ana owns the certificate rotation. Choose a complete, grammatically correct polite request for an explanation of the renewal process.", options: ["Could you explain the renewal process to me?", "Could you explain me the renewal process?", "Do you could explain the renewal process to me?", "Could you explaining the renewal process to me?"], answer: 0, explanation: "Pedido educado: Could + sujeito + verbo na forma base. Não se acrescenta do antes do modal. Explain recebe a coisa explicada e depois to + pessoa: explain the renewal process to me.", tags: [br.explain-me, gram.modals-polite, gram.question-forms] }
writing:
  prompt: |
    **Cenário:** ontem você rotacionou as credenciais do banco de staging e atualizou os segredos no cluster. O deploy de `orders-api` falhou uma vez por causa de um segredo antigo em cache e você refez o rollout. Hoje pretende repetir o procedimento em produção, mas depende de uma janela aprovada pelo time de mudanças, pedida na segunda.

    **Tarefa:** escreva seu update de standup (60–90 palavras) para ser lido em voz alta.
  constraints:
    - { label: "1 present perfect", pattern: "\\b(I've|I have|it's been|it has been|has been|hasn't been|haven't|hasn't|we've|we have)\\b" }
    - { label: '"it turned out" ou "I''ve tried"', pattern: "\\b(it turned out|I've tried|I have tried)\\b" }
    - { label: '"waiting on/for" ou "blocked on"', pattern: "\\b(waiting (on|for)|blocked on)\\b" }
    - { label: '1 previsão com "by"', pattern: "\\bby (tomorrow|today|eod|end of|noon|lunch|friday|monday|tuesday|wednesday|thursday|the end|\\d)" }
  rubric:
    - Estrutura yesterday / today / blockers
    - Tempos verbais
    - Preposições e conectores
    - Naturalidade e registro
    - Concisão
  model: >-
    Yesterday I rotated the staging database credentials and updated the secrets in the cluster. The first
    orders-api deploy failed; it turned out an old secret was still cached, so I redid the rollout and it's been
    green since then. Today I'm going to repeat the procedure in production, but I'm still waiting on the change
    window I requested on Monday. If it gets approved this morning, I should have production done by EOD.
  minWords: 60
  maxWords: 90
  tags: [comp.writing, topic.daily, gram.present-perfect]
speaking:
  prompt: "Grave seu update de standup real de hoje em até 45 segundos: o que fez, o que vai fazer, bloqueios. Use as expressões do módulo."
  maxSeconds: 45
  targetPhrases:
    - I've been working on
    - I finished
    - I got it done
    - I'm still on
    - I'm blocked on
    - I'm waiting on
    - I'm waiting for
    - it turned out
    - I've tried
    - taking longer than expected
    - I should have it done by
    - might slip
    - heads up
    - no blockers
    - nothing blocking me
    - quick one
  checklist:
    - Usei past simple para ontem e present perfect para o estado atual?
    - Dei previsão com "by"?
    - Disse o que já tentei ou onde estou travado?
    - Fechei com "no blockers" ou um pedido claro?
