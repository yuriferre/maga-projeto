id: M01-04
module: M01
order: 4
title: "Bloqueios e dependências: blocked on, waiting on, depends on"
objective: >-
  Ao final, você consegue nomear um bloqueio em uma frase (o que trava, desde quando, o que já fez), separar
  "estou travado" de "estou esperando", pedir ajuda em uma linha sem soar despreparado nem rude, e desbloquear
  os outros quando o bloqueio é você.
durationMin: 40
competencies: [SPK, VOC, LIS, CNF]
tags: [topic.daily, topic.help, vocab.standup, br.waiting-no-prep, br.depend-of, br.explain-me, br.doubt, gram.modals-polite, gram.prepositions-infra, comp.speaking]
prerequisites: [M01-02]

context:
  scenario: |
    Terça-feira, daily das 10h BRT. Você está migrando o `checkout-worker` para o novo cluster e travou em três pontos diferentes, de três naturezas diferentes:

    - O pipeline falha porque a *service account* do novo cluster não tem permissão de ler o bucket de artefatos. Você abriu um ticket para o time de segurança ontem de manhã e ninguém respondeu.
    - O Marcos prometeu o Helm chart base na sexta e ainda não entregou; sem ele você não consegue testar o rollout.
    - Você não entendeu como o *secret* do banco é injetado no cluster novo; leu o runbook duas vezes e continua sem entender.

    O primeiro é um **bloqueio** por terceiros, o segundo é uma **dependência** de um colega, o terceiro é uma **dúvida** sua. Cada um pede uma frase diferente. E a Ana está esperando **você** revisar o PR dela desde ontem.
  roles: [Priya (scrum master), Ana (SRE), Marcos (platform engineer)]

vocabulary:
  - term: I'm blocked on X
    meaning: X me impede de avançar (o problema, não a pessoa)
    example: I'm blocked on the service account permissions for the artifacts bucket.
    translation: Estou travado nas permissões da service account para o bucket de artefatos.
    note: '"blocked on" + o problema. "blocked by Ana" soa acusatório; prefira "blocked on the review".'
  - term: I'm waiting on X (from Y)
    meaning: dependo de algo que alguém ainda não entregou
    example: I'm waiting on the base Helm chart from Marcos.
    translation: Estou esperando o chart base do Marcos.
    note: '"waiting on/for". Sem preposição é erro. Nomeia a coisa, depois a pessoa.'
  - term: X depends on Y
    meaning: X só acontece depois de Y
    example: The rollout test depends on the base chart.
    translation: O teste de rollout depende do chart base.
    note: '"depend on", nunca "depend of".'
  - term: I need X from Y
    meaning: pedido direto e específico
    example: I need read access to the artifacts bucket from the security team.
    translation: Preciso de acesso de leitura ao bucket de artefatos, do time de segurança.
    note: Diga o quê e de quem; evita "I need help".
  - term: "I've asked in #channel / I opened a ticket"
    meaning: mostrar que já agiu
    example: I opened a ticket with security yesterday morning; no reply yet.
    translation: Abri um ticket com segurança ontem de manhã; sem resposta ainda.
    note: Bloqueio sem ação tomada parece desculpa.
  - term: Who owns X?
    meaning: quem é responsável por X
    example: Who owns the artifacts bucket policy?
    translation: Quem cuida da policy do bucket de artefatos?
    note: '"own" = ser dono/responsável. Pergunta que destrava rápido.'
  - term: Could you point me to…?
    meaning: pode me indicar onde…
    example: Could you point me to where the DB secret gets injected?
    translation: Pode me indicar onde o secret do banco é injetado?
    note: Pedido educado por informação, não por trabalho.
  - term: Could someone walk me through X?
    meaning: alguém pode me explicar X passo a passo
    example: Could someone walk me through the secret injection after the call?
    translation: Alguém pode me explicar a injeção de secrets depois da call?
    note: Substitui "explain me". "after the call" protege o daily.
  - term: I'm not sure I follow how X works
    meaning: admitir que não entendeu, sem drama
    example: I'm not sure I follow how the secret gets into the pod.
    translation: Não entendi bem como o secret chega no pod.
    note: Registro neutro; melhor que "I don't understand anything".
  - term: I have a question about X
    meaning: tenho uma dúvida (pergunta) sobre X
    example: I have a question about the secret injection.
    translation: Tenho uma dúvida sobre a injeção de secrets.
    note: Nunca "doubt" nesse sentido.
  - term: Can you unblock me on X?
    meaning: pode me destravar em X
    example: Ana, can you unblock me on the bucket policy? You have admin there.
    translation: Ana, pode me destravar na policy do bucket? Você tem admin lá.
    note: Direto e específico; para colegas próximos.
  - term: It's on me
    meaning: a responsabilidade (ou o atraso) é minha
    example: The review is on me; I'll do it right after this.
    translation: A revisão está comigo; faço logo depois disso.
    note: Assume o bloqueio que você causa nos outros.
  - term: I'll get to it right after this
    meaning: faço isso logo depois (da call)
    example: I'll get to your PR right after this.
    translation: Vou pegar seu PR logo depois disso.
    note: '"get to" = chegar em (uma tarefa da fila).'
  - term: X is blocking Y
    meaning: nomear o impacto do bloqueio
    example: The bucket policy is blocking the checkout release, so it's urgent.
    translation: A policy do bucket está bloqueando o release do checkout, então é urgente.
    note: Impacto + palavra "urgent" só quando é.
  - term: If I don't hear back by X, I'll…
    meaning: prazo para a espera + plano B
    example: If I don't hear back from security by noon, I'll ask Priya to escalate.
    translation: Se segurança não responder até o meio-dia, peço para a Priya escalar.
    note: Espera com data e plano B; nunca "estou esperando" sem fim.

grammar:
  title: "Preposições de dependência e o pedido em uma frase"
  explanation: |
    **Três situações, três frases:**

    | Situação | Frase | Preposição |
    |---|---|---|
    | Algo me impede | I'm **blocked on** the bucket permissions. | on |
    | Alguém ainda não entregou | I'm **waiting on/for** the chart **from** Marcos. | on / for + from |
    | Uma coisa só acontece depois de outra | The test **depends on** the chart. | on |

    *Blocked* é o problema; *waiting* é a entrega; *depends* é a ordem. As três usam **on**. "Depend of" e "waiting the" são calques.

    **O pedido em uma frase:** contexto curto → o que já tentei → pedido específico.

    *Exemplo:* I'm blocked on the bucket permissions; I opened a ticket yesterday with no reply. **Could someone from security take a look after the call?**

    **Modais de polidez, do mais leve ao mais direto:** *Could you point me to…?* · *Would you mind…?* · *Can you unblock me on…?* · *I need X from Y by Z.* Quanto mais urgente, mais direto; quanto mais direto, mais específico.

    **Dúvida ≠ bloqueio:** "I'm not sure I follow how X works" pede explicação; "I'm blocked on X" pede ação. Misturar os dois confunde quem pode ajudar.
  examples:
    - { en: "I'm blocked on the bucket permissions.", pt: "Estou travado nas permissões do bucket." }
    - { en: "I'm waiting on the chart from Marcos.", pt: "Estou esperando o chart do Marcos." }
    - { en: "The rollout test depends on the base chart.", pt: "O teste de rollout depende do chart base." }
    - { en: "Could someone walk me through the secret injection?", pt: "Alguém pode me explicar a injeção de secrets?" }
    - { en: "I need read access from the security team by noon.", pt: "Preciso de acesso de leitura do time de segurança até o meio-dia." }

examples:
  - en: I'm blocked on the service account permissions for the artifacts bucket. I opened a ticket with security yesterday morning; no reply yet.
    pt: Estou travado nas permissões da service account para o bucket de artefatos. Abri um ticket com segurança ontem de manhã; sem resposta ainda.
    context: Bloqueio nomeado com o que já foi feito.
  - en: I'm waiting on the base Helm chart from Marcos; the rollout test depends on it.
    pt: Estou esperando o chart base do Marcos; o teste de rollout depende dele.
    context: Dependência de colega, sem acusar, com o impacto.
  - en: I'm not sure I follow how the DB secret gets injected in the new cluster. Could someone walk me through it after the call?
    pt: Não entendi bem como o secret do banco é injetado no cluster novo. Alguém pode me explicar depois da call?
    context: Dúvida admitida + pedido educado fora do daily.
  - en: Who owns the bucket policy? If it's security, I'd like to escalate.
    pt: Quem cuida da policy do bucket? Se for segurança, quero escalar.
    context: Descobrir o dono é o caminho mais curto para destravar.
  - en: If I don't hear back by noon, I'll ask Priya to escalate.
    pt: Se não responderem até o meio-dia, peço para a Priya escalar.
    context: Espera com prazo e plano B.
  - en: Ana, your PR is on me. I'll get to it right after this.
    pt: Ana, seu PR está comigo. Pego logo depois disso.
    context: Você é o bloqueio de alguém; assume e dá prazo.
  - en: Marcos, any ETA on the base chart? Not pushing, just planning around it.
    pt: Marcos, tem previsão do chart base? Não estou cobrando, só planejando em cima disso.
    context: Cobrar um colega sem soar rude.

variations:
  - idea: '"pedir ajuda com o secret"'
    items:
      - { register: Neutro (daily), text: "Could someone walk me through the secret injection after the call?", adequate: true }
      - { register: Direto (colega próximo), text: "Marcos, can you show me the secret injection real quick after this?", adequate: true }
      - { register: Formal (canal amplo), text: "Would anyone with context on secret injection in the new cluster be able to spare 15 minutes today?", adequate: true }
      - { register: Inadequada, text: "Can you explain me the secret?", adequate: false, note: '"explain me" é calque; e "the secret" é vago.' }
      - { register: Inadequada, text: "I don't understand anything about secrets, sorry.", adequate: false, note: Sem foco; ninguém sabe por onde começar a ajudar. }
  - idea: '"estou esperando o chart do Marcos"'
    items:
      - { register: Neutro, text: "I'm waiting on the base chart from Marcos.", adequate: true }
      - { register: Com impacto, text: "The rollout test is waiting on Marcos's chart, so it slips a day.", adequate: true }
      - { register: Inadequada, text: "Marcos didn't deliver the chart, so I can't work.", adequate: false, note: Acusa a pessoa em público e não diz o que você pode fazer enquanto isso. }
      - { register: Inadequada, text: "I'm waiting the chart.", adequate: false, note: Sem preposição. }

brErrors:
  - { wrong: "I'm waiting the chart from Marcos.", right: "I'm waiting on the chart from Marcos.", why: "wait exige preposição", tag: br.waiting-no-prep }
  - { wrong: "The test depends of the chart.", right: "The test depends on the chart.", why: "depend on", tag: br.depend-of }
  - { wrong: "Can you explain me the secret injection?", right: "Can you walk me through the secret injection?", why: "explain não aceita objeto indireto direto", tag: br.explain-me }
  - { wrong: "I have a doubt about the secret.", right: "I have a question about the secret.", why: "doubt = desconfiança", tag: br.doubt }
  - { wrong: "I'm blocked by Marcos.", right: "I'm blocked on the base chart (from Marcos).", why: "blocked on + o problema; nomear a pessoa como bloqueio soa acusatório", tag: vocab.standup }
  - { wrong: "I need help.", right: "I need read access to the bucket from security.", why: "pedido sem objeto não destrava nada", tag: topic.help }
  - { wrong: "You can give me access?", right: "Could you give me access?", why: "pergunta pede inversão + modal de polidez", tag: gram.modals-polite }
  - { wrong: "I'm in the new cluster now.", right: "I'm on the new cluster now.", why: "trabalhar em um cluster/servidor/ambiente: on; injetar ou deployar algo é in the cluster", tag: gram.prepositions-infra }
  - { wrong: "Sorry to bother, but maybe if it's possible could you perhaps…", right: "Could you take a look at the bucket policy after the call?", why: "excesso de suavizadores soa inseguro; um modal basta", tag: gram.modals-polite }

dialogue:
  title: "Daily de terça, 10:00 BRT. Três travas e um PR esperando você."
  lines:
    - { speaker: Priya, text: "Yuri, how's the checkout-worker migration?" }
    - { speaker: Yuri, text: "Slower than I'd like. I'm blocked on the service account permissions for the artifacts bucket; I opened a ticket with security yesterday morning and haven't heard back. Separately, I'm waiting on the base Helm chart from Marcos, because the rollout test depends on it. And I have a question about how the DB secret gets injected, but that can wait until after the call.", note: "Bloqueio / dependência / dúvida, cada um com a frase certa." }
    - { speaker: Priya, text: "Who owns the bucket policy?" }
    - { speaker: Ana, text: "Security, but I have admin on that bucket. I can add the read permission right after this. Yuri, can you unblock me on my PR? It's been sitting since yesterday." }
    - { speaker: Yuri, text: "Yes, that's on me. I'll get to it right after this, before the bucket stuff." }
    - { speaker: Marcos, text: "Chart's almost done. I'll have it in the repo by EOD; the values file is what's left." }
    - { speaker: Yuri, text: "Great. If I get the permissions today, I can test the rollout tomorrow morning. Marcos, could you walk me through the secret injection when you push the chart?" }
    - { speaker: Marcos, text: "Sure, I'll ping you." }
    - { speaker: Priya, text: "Good. Ana unblocks the bucket, Yuri reviews Ana's PR, Marcos pushes the chart by EOD. Next." }
  notes:
    - '"Slower than I''d like" abre com honestidade sem drama.'
    - '"It''s been sitting since yesterday" = está parado desde ontem (cobrança leve).'
    - 'Priya fecha com quem faz o quê: é assim que um bloqueio vira ação.'

listening:
  lines:
    - { speaker: Ana, text: "I'm blocked on the firewall rule for the new load balancer. I asked in the network channel on Friday and again yesterday. If I don't hear back by noon, I'll escalate to their lead." }
    - { speaker: Marcos, text: "The node group upgrade depends on the new AMI from the platform team; they said Thursday. Not blocked yet, just planning around it. I'm waiting for their confirmation." }
    - { speaker: Priya, text: "Yuri, the release notes are waiting on you; I need the checkout section by tomorrow. Also, who owns the Grafana folder for the old dashboards? We should archive it." }
  questions:
    - { id: M01-04-l1, type: multiple_choice, prompt: "What is Ana blocked on?", options: ["A firewall rule", "The new AMI", "The release notes", "The Grafana folder"], answer: 0, explanation: '"I''m blocked on the firewall rule for the new load balancer."', tags: [comp.listening] }
    - { id: M01-04-l2, type: multiple_choice, prompt: "What will Ana do if nobody replies by noon?", options: ["Open a ticket", "Wait until Friday", "Ask Marcos", "Escalate to the network lead"], answer: 3, explanation: '"If I don''t hear back by noon, I''ll escalate to their lead."', tags: [comp.listening, topic.help] }
    - { id: M01-04-l3, type: fill_blank, prompt: "The node group upgrade depends ___ the new AMI.", accepted: ["on"], explanation: "depend on.", tags: [br.depend-of, comp.listening] }
    - { id: M01-04-l4, type: multiple_choice, prompt: "Is Marcos blocked?", options: ["Yes, since Friday", "Yes, on the AMI", "Not yet; he is planning around it", "He does not say"], answer: 2, explanation: '"Not blocked yet, just planning around it."', tags: [comp.listening, vocab.standup] }
    - { id: M01-04-l5, type: multiple_choice, prompt: "What is waiting on Yuri?", options: ["The firewall rule", "The release notes", "The AMI", "The node group"], answer: 1, explanation: '"the release notes are waiting on you"', tags: [comp.listening, br.waiting-no-prep] }
    - { id: M01-04-l6, type: multiple_choice, prompt: '"Who owns the Grafana folder?" — Priya wants to know…', options: ["who created it", "who uses it most", "who deleted it", "who is responsible for it"], answer: 3, explanation: "own = ser responsável por.", tags: [vocab.standup] }

writing:
  prompt: |
    **Cenário:** você está migrando um cron de faturamento para o novo cluster. Travou porque a imagem não sobe: falta um segredo que só o time de pagamentos pode criar. Você mandou mensagem no canal deles ontem à tarde, sem resposta. Além disso, o teste depende de um dump do banco que a Ana ficou de gerar. Você não entendeu como o *CronJob* recebe o fuso horário no cluster novo.

    **Tarefa:** escreva seu update de standup (60–90 palavras) separando bloqueio, dependência e dúvida, com o que você já fez e um pedido específico em uma frase.
  constraints:
    - { label: '"blocked on"', pattern: "\\bblocked on\\b" }
    - { label: '"waiting on/for" ou "depends on"', pattern: "\\b(waiting (on|for)|depends on)\\b" }
    - { label: 'Um pedido com could / can / would', pattern: "\\b(could|can|would) (you|someone|anyone)\\b" }
    - { label: "O que você já fez (asked / opened / pinged)", pattern: "\\b(asked|opened|pinged|messaged|posted)\\b" }
  rubric:
    - Bloqueio, dependência e dúvida separados
    - Preposições (blocked on, waiting on, depends on)
    - Pedido específico em uma frase
    - Concisão e registro
  model: >-
    I'm blocked on the billing cron: the image won't start because it needs a secret that only the payments
    team can create. I messaged their channel yesterday afternoon and haven't heard back. The end-to-end test
    also depends on the database dump Ana is generating, so I'm waiting on that. And I have a question about
    how the CronJob gets its time zone in the new cluster. Could someone from payments create the secret today?
  minWords: 60
  maxWords: 90
  tags: [comp.writing, topic.daily, topic.help]

speaking:
  modeA:
    prompt: Grave um update de 45 segundos sobre um bloqueio seu (real ou o do cenário). Nomeie o que trava, o que já fez e faça um pedido específico em uma frase.
    maxSeconds: 45
    targetPhrases:
      - I'm blocked on
      - I'm waiting on
      - I'm waiting for
      - depends on
      - I need
      - I opened a ticket
      - I've asked
      - who owns
      - could you point me to
      - walk me through
      - I'm not sure I follow
      - I have a question about
      - unblock me
      - it's on me
      - right after this
      - if I don't hear back by
    checklist:
      - Separei bloqueio, dependência e dúvida?
      - Disse o que já fiz antes de pedir?
      - O pedido tem objeto e destinatário?
      - Usei on (blocked on, waiting on, depends on)?

quiz:
  - { id: M01-04-q1, type: fill_blank, prompt: "I'm waiting ___ the chart from Marcos.", accepted: ["on", "for"], explanation: "wait on / wait for. Sem preposição é erro.", tags: [br.waiting-no-prep] }
  - { id: M01-04-q2, type: error_correction, prompt: "The rollout test depends of the base chart.", accepted: ["The rollout test depends on the base chart.", "The rollout test depends on the base chart"], explanation: "depend on.", tags: [br.depend-of] }
  - { id: M01-04-q3, type: multiple_choice, prompt: "Which sentence names the problem, not the person?", options: ["I'm blocked by Ana.", "Ana is blocking me.", "I'm blocked on the bucket policy.", "Ana didn't do her part."], answer: 2, explanation: "blocked on + o problema. Nomear a pessoa como bloqueio soa acusatório em público.", tags: [vocab.standup, topic.daily] }
  - { id: M01-04-q4, type: error_correction, prompt: "Can you explain me the secret injection?", accepted: ["Can you walk me through the secret injection?", "Can you walk me through the secret injection", "Can you explain the secret injection to me?", "Can you explain the secret injection to me", "Could you walk me through the secret injection?", "Could you explain the secret injection to me?"], explanation: "explain + coisa + to me, ou walk me through.", tags: [br.explain-me, gram.modals-polite] }
  - { id: M01-04-q5, type: multiple_choice, prompt: "Which request is the most useful?", options: ["I need help.", "Can someone help me with stuff?", "I need read access to the artifacts bucket from security.", "Sorry, maybe someone could maybe help?"], answer: 2, explanation: "Objeto + destinatário. As outras não dizem o que nem de quem.", tags: [topic.help, gram.modals-polite] }
  - { id: M01-04-q6, type: translate, prompt: "Não entendi bem como o secret chega no pod.", accepted: ["I'm not sure I follow how the secret gets into the pod.", "I'm not sure I follow how the secret gets into the pod", "I'm not sure how the secret gets into the pod.", "I'm not sure how the secret gets into the pod", "I don't quite follow how the secret gets into the pod.", "I'm not sure I understand how the secret gets into the pod."], explanation: '"I''m not sure I follow" = não entendi bem, sem drama.', tags: [topic.help, vocab.standup] }
  - { id: M01-04-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["back", "noon", "by", "hear", "don't", "if", "I"], answer: "if I don't hear back by noon", explanation: "Espera com prazo: if I don't hear back by + hora, I'll + plano B.", tags: [vocab.standup, gram.by-until] }
  - { id: M01-04-q8, type: match, prompt: "Associe a situação à frase.", pairs: [{ left: "algo me impede", right: "I'm blocked on the permissions." }, { left: "alguém ainda não entregou", right: "I'm waiting on the chart from Marcos." }, { left: "uma coisa só acontece depois da outra", right: "The test depends on the chart." }, { left: "não entendi", right: "I'm not sure I follow how it works." }], explanation: "Quatro situações, quatro frases. As três primeiras usam on.", tags: [vocab.standup, topic.help] }

