  - { front: "rapidinho: (abertura de pergunta curta)", back: "quick one: …", tag: vocab.slack }
  - { front: "contexto: (rótulo antes do pedido)", back: "context: …", tag: vocab.slack }
  - { front: "vamos levar isso para uma thread", back: "let's take this to a thread", tag: vocab.slack }
  - { front: "ninguém precisa fazer nada", back: "no action needed", tag: vocab.slack }
  - { front: "para ciência do canal", back: "for visibility", tag: vocab.slack }
  - { front: "ressuscitando a mensagem (sem resposta)", back: "gentle bump", tag: vocab.slack }
  - { front: "me chama quando subir", back: "ping me when it's up", tag: vocab.slack }
  - { front: "olhando / feito / concordo (reações)", back: "👀 looking · ✅ done · ➕ agree", tag: vocab.slack }
  - { front: "ela me disse para postar no canal", back: "She told me to post in the channel.", tag: br.said-me }
  - { front: "esperando sua resposta", back: "waiting on your reply", tag: br.waiting-no-prep }
  - { front: "tenho uma dúvida sobre a janela", back: "I have a question about the window.", tag: br.doubt }

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
