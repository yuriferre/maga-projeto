  - { front: "fala com / chama", back: "talks to", tag: vocab.architecture }
  - { front: "é precedido por (recebe o tráfego depois)", back: "is fronted by", tag: vocab.architecture }
  - { front: "sustentado por (a fundação)", back: "backed by", tag: vocab.architecture }
  - { front: "a montante / a jusante", back: "upstream / downstream", tag: vocab.architecture }
  - { front: "ele lida com (responsabilidade)", back: "it handles", tag: vocab.architecture }
