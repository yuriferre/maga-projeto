  - { id: M05-05-q2, type: error_correction, prompt: "The API runs in EKS and listens in port 8080.", accepted: ["The API runs on EKS and listens on port 8080.", "The API runs on EKS and listens on port 8080", "The API runs on EKS and listens on 8080."], explanation: "Dois calques de \"em\": runs ON EKS, listens ON port.", tags: [gram.prepositions-infra, br.listen-in] }
  - { id: M05-05-q3, type: multiple_choice, prompt: "'Who talks to the database?' — the answer:", options: ["everyone does", "only the services — nothing reaches it directly", "the gateway", "the CDN"], answer: 1, explanation: "Proteção: só os serviços falam com o banco.", tags: [vocab.architecture] }
  - { id: M05-05-q4, type: fill_blank, prompt: "If the service is down, the request ___ back as a 502.", accepted: ["bounces"], explanation: '"bounces back" — retorna com erro.', tags: [vocab.architecture] }
  - { id: M05-05-q5, type: error_correction, prompt: "The request arrives on the server and the response returns the datas.", accepted: ["The request arrives at the server and the response returns the data.", "The request arrives at the server and the response returns the data", "The request reaches the server and the response returns the data."], explanation: "Dois erros: arrives AT + data sem plural.", tags: [br.arrive-on, br.uncountable] }
  - { id: M05-05-q6, type: translate, prompt: "Quando quebra, você começa nos logs do gateway.", accepted: ["When it breaks, you start at the gateway logs.", "When it breaks, you start at the gateway logs", "When something breaks, you start at the gateway logs."], explanation: '"when it breaks" + "start at the logs".', tags: [vocab.architecture] }
  - { id: M05-05-q7, type: multiple_choice, prompt: "How do you close the walkthrough?", options: ["\"Finished. Questions?\"", "\"Do you have doubts?\"", "\"Okay bye.\"", "\"That's about it — any questions so far?\""], answer: 3, explanation: "O fecho resume e convida — não corta.", tags: [vocab.architecture, comp.speaking] }
  - { id: M05-05-q8, type: match, prompt: "Associe a pergunta do colega novo à resposta.", pairs: [{ left: "Who talks to the DB?", right: "only the services" }, { left: "What happens when it fails?", right: "bounces back / times out" }, { left: "Where do I look when it breaks?", right: "the gateway logs" }, { left: "Where does it run?", right: "hosted on AWS, runs on EKS" }], explanation: "As quatro perguntas clássicas do primeiro dia.", tags: [vocab.architecture] }

