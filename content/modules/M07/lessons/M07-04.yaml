  - { front: "it makes sense", back: "afirmação: terceira pessoa com s — nunca 'it make sense'", tag: br.it-makes-sense }
  - { front: "in scope / out of scope", back: "dentro/fora do escopo — a pergunta que delimita", tag: vocab.agile }
  - { front: "what are we assuming", back: "expõe a premissa escondida na estimativa", tag: vocab.agile }
  - { front: "a blocker", back: "o que impede a story de andar — mais forte que dependency", tag: vocab.agile }
  - { front: "to flag a risk", back: "levantar a bandeira cedo — 'I want to flag a risk:…'", tag: vocab.agile }
  - { front: "the happy path", back: "o caminho sem falhas — critério que só cobre isso está incompleto", tag: vocab.agile }
  - { front: "an edge case", back: "o cenário raro que quebra — mora nos acceptance criteria", tag: vocab.agile }
  - { front: "an open question", back: "pergunta sem resposta — story com open question não está pronta", tag: vocab.agile }
  - { front: "a concern", back: '"isso me preocupa" com tom profissional', tag: vocab.agile }
  - { front: "worth a spike", back: "a open question que vira ação", tag: vocab.agile }
  - { front: "to push for clarity", back: "insistir pela resposta — sem soar bloqueiro", tag: vocab.agile }

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
