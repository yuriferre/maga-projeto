  - { front: "it would help if", back: "o pedido em forma de consequência — sugere, não ordena", tag: vocab.feedback }
  - { front: "the impact was", back: "o efeito real do comportamento — concreto, não 'was bad'", tag: vocab.feedback }
  - { front: "could you try", back: "o pedido leve + a razão — aceita 'não'", tag: vocab.feedback }
  - { front: "next time", back: "aponta para frente — do erro para o ajuste", tag: vocab.feedback }
  - { front: "happy to pair on it", back: "a oferta que transforma feedback em suporte", tag: vocab.feedback }
  - { front: "it's not about you", back: "despersonaliza antes do ponto difícil", tag: vocab.feedback }
  - { front: "to sugarcoat", back: "embrulhar demais — 'not to sugarcoat it' prepara a franqueza", tag: vocab.feedback }
  - { front: "a feedback → some feedback", back: "feedback é incontável — some / a piece of", hint: '"a feedback loop" é exceção', tag: br.uncountable }
