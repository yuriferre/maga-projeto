review:
  preferTags: [vocab.troubleshoot, br.more-er, br.same-of]
  notes: "Revisão prioriza o léxico de proposta e os padrões BR do módulo."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
