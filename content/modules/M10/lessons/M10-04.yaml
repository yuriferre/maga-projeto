  - { front: "the proper fix", back: "A correção de verdade — resolve a causa.", tag: vocab.troubleshoot }
  - { front: "workaround", back: "O remendo honesto — contorna sem resolver.", tag: vocab.troubleshoot }
  - { front: "trade-off", back: "O ganho e o custo na mesma frase.", tag: vocab.troubleshoot }
