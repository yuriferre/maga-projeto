  - { front: "for now", back: "O selo temporal do remendo — sem ele, vira arquitetura.", tag: vocab.troubleshoot }
  - { front: "long-term", back: "O horizonte da correção real.", tag: vocab.troubleshoot }
  - { front: "band-aid", back: "Remendo que não engana ninguém — assume a fragilidade.", tag: vocab.troubleshoot }
  - { front: "I'd lean towards", back: "Recomendação com hedge — mais suave que 'my recommendation'.", tag: vocab.troubleshoot }
