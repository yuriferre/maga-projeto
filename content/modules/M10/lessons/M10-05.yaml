review:
  preferTags: [vocab.troubleshoot, br.it-not-works, br.after-to]
  notes: "Revisão prioriza o fechamento de incidente e os padrões BR do módulo."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
