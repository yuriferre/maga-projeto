  - { front: "impact", back: "Quem sentiu o quê — separado do sintoma.", tag: vocab.troubleshoot }
  - { front: "resolved", back: "O estado final — + monitoramento honesto.", tag: vocab.troubleshoot }
  - { front: "keep posted", back: "A promessa de cadência de updates.", tag: vocab.troubleshoot }
