  - { front: "apply", back: "Executar o plan — 'terraform apply', nunca 'apply the terraform'.", tag: vocab.iac }
  - { front: "state", back: "O que o Terraform acha que existe — o arquivo-memória.", tag: vocab.iac }
  - { front: "drift", back: "A realidade divergiu do state — clique no console.", tag: vocab.iac }
  - { front: "it wants to recreate", back: "Destroy + create disfarçado — red flag para stateful.", tag: vocab.iac }
  - { front: "state lock", back: "A trava contra applies concorrentes — espere, não force.", tag: vocab.iac }
