review:
  preferTags: [vocab.iac, br.apply-terraform, br.depends-in]
  notes: "Revisão prioriza o vocabulário de plan/drift e os padrões BR do módulo."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
