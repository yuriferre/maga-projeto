  - { front: "pod", back: "A menor unidade — efêmera, o deployment recria.", tag: vocab.k8s }
  - { front: "node", back: "A máquina — pods rodam ON o node.", tag: vocab.k8s }
  - { front: "deployment", back: "Declara o estado desejado — owns the pods.", tag: vocab.k8s }
  - { front: "service", back: "IP/DNS estável na frente dos pods — fronts.", tag: vocab.k8s }
  - { front: "ingress", back: "Roteia tráfego externo para services — TLS + paths.", tag: vocab.k8s }
  - { front: "namespace", back: "A pasta lógica — RBAC e quotas por namespace.", tag: vocab.k8s }
  - { front: "probe", back: "Health check — liveness reinicia, readiness controla tráfego.", tag: vocab.k8s }
  - { front: "sidecar", back: "Container auxiliar no mesmo pod — logs, proxy, auth.", tag: vocab.k8s }
