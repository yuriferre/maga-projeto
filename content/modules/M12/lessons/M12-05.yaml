  - { id: M12-05-q2, type: error_correction, prompt: "The pod is died — check the events.", accepted: ["The pod died — check the events.", "The pod is dead — check the events.", "The pod died — check the events"], explanation: "died ou is dead.", tags: [br.is-died] }
  - { id: M12-05-q3, type: multiple_choice, prompt: "The HPA scaling to 8 doesn't help because…", options: ["8 is too many", "the max is 3", "new pods OOM during cold start — scaling a broken spec makes more broken pods", "the HPA is off"], answer: 2, explanation: "Réplica que morre no boot não serve.", tags: [vocab.k8s] }
  - { id: M12-05-q4, type: fill_blank, prompt: "One pod OOMs, traffic shifts to the survivors, they OOM too — ___ effect.", accepted: ["domino"], explanation: "Domino effect.", tags: [vocab.k8s] }
  - { id: M12-05-q5, type: error_correction, prompt: "I need see the events first.", accepted: ["I need to see the events first.", "I need to see the events first"], explanation: "need to see.", tags: [br.need-see] }
  - { id: M12-05-q6, type: translate, prompt: "Mitigue agora: suba o limite para 1Gi. Previna depois: dimensione o request e dê folga ao HPA.", accepted: ["Mitigate now: raise the limit to 1Gi. Prevent later: right-size the request and give the HPA headroom.", "Mitigate now — raise the limit to 1Gi; prevent later — right-size the request and give the HPA headroom."], explanation: "Mitigate × prevent — os dois fechos.", tags: [vocab.k8s] }
  - { id: M12-05-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["pods", "more", "makes", "spec", "scaling", "broken", "a", "broken"], answer: "scaling a broken spec makes more broken pods", explanation: "Por que escalar não salva.", tags: [vocab.k8s] }
  - { id: M12-05-q8, type: multiple_choice, prompt: "The incident ends when…", options: ["the mitigation lands AND the prevention is scheduled", "the error rate drops", "the peak passes", "the pods restart"], answer: 0, explanation: "Fix + prevenção agendada.", tags: [vocab.k8s] }

