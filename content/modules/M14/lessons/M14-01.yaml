  - { front: "IAM / Entra ID", back: "Quem pode o quê — papéis não mapeiam 1:1.", tag: vocab.cloud }
  - { front: "feature parity", back: "Equivalente cobre o papel; features divergem.", tag: vocab.cloud }
  - { front: "block storage", back: "EBS × Persistent Disk × Managed Disks.", tag: vocab.cloud }
  - { front: "managed service", back: "O provedor opera — RDS, Cloud SQL.", tag: vocab.cloud }

review:
  preferTags: [vocab.cloud, br.on-the-cloud, br.migrate-for]
  notes: "Revisão prioriza o mapa de serviços e os calques de cloud."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
