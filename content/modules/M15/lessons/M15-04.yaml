review:
  preferTags: [vocab.incident, br.thanks-patience, br.in-this-moment]
  notes: "Revisão prioriza a tradução para não-técnico e os calques de cortesia."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
