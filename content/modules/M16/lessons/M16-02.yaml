review:
  preferTags: [vocab.bridge, br.confirm-me, br.listen-you]
  notes: "Revisão prioriza fato com fonte, pergunta binária e os calques de áudio."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
