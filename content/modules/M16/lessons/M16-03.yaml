  - { front: "I'd rather", back: "Preferência marcada — 'X than Y'.", tag: vocab.bridge }
  - { front: "hold off on", back: "Pausa deliberada + gerúndio.", tag: vocab.bridge }
  - { front: "go ahead", back: "A autorização de duas palavras.", tag: vocab.bridge }
  - { front: "on my call", back: "A decisão assumida pelo IC.", tag: vocab.bridge }
