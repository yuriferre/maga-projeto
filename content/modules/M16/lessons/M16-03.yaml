review:
  preferTags: [vocab.bridge, br.said-me, br.do-modal]
  notes: "Revisão prioriza os quatro verbos da decisão e os calques de proposta."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
