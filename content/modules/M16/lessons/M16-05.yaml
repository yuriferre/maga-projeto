  - { id: M16-05-q2, type: error_correction, prompt: "Stay in the line — the all-clear is coming.", accepted: ["Stay on the line — the all-clear is coming.", "Stay on the line — the all-clear is coming"], explanation: "on the line.", tags: [br.in-the-line] }
  - { id: M16-05-q3, type: multiple_choice, prompt: "'Recap' on a bridge exists for…", options: ["the post-mortem only", "the recording", "small talk", "latecomers — what happened, what's now, in 15 seconds"], answer: 3, explanation: "Entrada tardia merece 15 segundos de recap.", tags: [vocab.bridge] }
  - { id: M16-05-q4, type: fill_blank, prompt: "All-___ confirmed — dropping the bridge.", accepted: ["clear"], explanation: '"all-clear" — o sinal que encerra.', tags: [vocab.bridge] }
  - { id: M16-05-q5, type: error_correction, prompt: "Confirm me the pool is healthy.", accepted: ["Confirm the pool is healthy.", "Confirm the pool is healthy"], explanation: "confirm, sem me.", tags: [br.confirm-me] }
  - { id: M16-05-q6, type: translate, prompt: "Olhos na taxa de erro — avise no segundo em que cair.", accepted: ["Eyes on the error rate — call it the second it drops.", "Eyes on the error rate — call it when it drops."], explanation: '"eyes on X" — vigilância com dono.', tags: [vocab.bridge] }
  - { id: M16-05-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["the", "dropping", "bridge", "all", "thanks"], answer: "dropping the bridge thanks all", explanation: '"dropping the bridge" — o fim declarado.', tags: [vocab.bridge] }
  - { id: M16-05-q8, type: multiple_choice, prompt: "A bridge closes with…", options: ["'bye everyone'", "the call just ends", "all-clear + recap + actions with owners", "the next meeting"], answer: 2, explanation: "Fechamento = sinal + resumo + ações.", tags: [vocab.bridge] }

