review:
  preferTags: [vocab.postmortem, br.was-past, br.in-weekday]
  notes: "Revisão prioriza a passiva blameless, 'went unnoticed' e os calques de dia/particípio."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
