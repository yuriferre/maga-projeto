  - { front: "underlying cause", back: "A raiz sob o sintoma.", tag: vocab.postmortem }
  - { front: "the trigger", back: "O evento que puxou — distinto da causa.", tag: vocab.postmortem }
  - { front: "contributing factor", back: "Agravou sem causar — lista separada.", tag: vocab.postmortem }
  - { front: "exacerbated by", back: "Agravado por — o registro escrito.", tag: vocab.postmortem }
  - { front: "went unnoticed because", back: "A falha de detecção explicada.", tag: vocab.postmortem }
  - { front: "slipped through", back: "O mecanismo da fuga pelas barreiras.", tag: vocab.postmortem }
  - { front: "a chain of", back: "Os elos — remova um e não há incidente.", tag: vocab.postmortem }
  - { front: "masked by", back: "Escondido por outro sinal.", tag: vocab.postmortem }
  - { front: "pre-existing", back: "A condição latente que o gatilho achou.", tag: vocab.postmortem }
  - { front: "precisely because", back: "A causa contraintuitiva destacada.", tag: vocab.postmortem }

review:
  preferTags: [vocab.postmortem, br.contributed-for, br.of-weekday]
  notes: "Revisão prioriza trigger×causa×fator, a cadeia e os calques de contribuição e dia."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
