review:
  preferTags: [vocab.postmortem, br.until-by, br.contributed-for]
  notes: "Revisão prioriza o formato do item executável e os calques de prazo/contribuição."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
