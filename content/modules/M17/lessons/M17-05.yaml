review:
  preferTags: [vocab.postmortem, br.of-weekday, br.was-past]
  notes: "Revisão prioriza a estrutura do documento e os calques de dia e particípio."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
