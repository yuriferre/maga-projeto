review:
  preferTags: [vocab.slo, br.in-percent, vocab.observability]
  notes: "Revisão prioriza SLI × SLO × SLA, 'within SLO', 'burn rate' e os calques de preposição."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
