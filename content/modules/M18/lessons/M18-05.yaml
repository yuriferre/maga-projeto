review:
  preferTags: [gram.describing-trends, vocab.slo, br.metric-raised]
  notes: "Revisão prioriza as quatro batidas, 'went from X to Y', o gargalo nomeado e o fecho 'what changes'."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
