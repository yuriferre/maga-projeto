  - { front: "accept the risk", back: "Conviver documentado — motivo + sign-off.", tag: vocab.security }
  - { front: "defer", back: "Adiar com justificativa e data nova.", tag: vocab.security }
  - { front: "we'll track it under", back: "O finding vira ticket — número + dono + prazo.", tag: vocab.security }
  - { front: "severity", back: "Quão grave — guia o SLA (critical = 7d).", tag: vocab.security }
  - { front: "false positive", back: "O finding errado — disputa com prova.", tag: vocab.security }
  - { front: "mitigate", back: "Reduzir até a correção — 'a WAF rule holds it'.", tag: vocab.security }
  - { front: "due date", back: "O prazo do finding — 'due in 30 days'.", tag: vocab.security }
  - { front: "owner", back: "Quem responde — sem dono, sem remediação.", tag: vocab.security }
  - { front: "wontfix", back: "Recusa documentada — 'deprecated in Q4'.", tag: vocab.security }
  - { front: "SLA for findings", back: "O prazo por severidade — critical 7d, medium 30d.", tag: vocab.security }

review:
  preferTags: [vocab.security, br.modal-to, br.until-by]
  notes: "Revisão prioriza as três decisões, 'track it under', mitigate × remediate e os calques de modal/prazo."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
