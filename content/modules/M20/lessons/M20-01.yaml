  - { front: "waste", back: "Gasto que não entrega nada — dev ligado à noite.", tag: vocab.finops }

review:
  preferTags: [vocab.finops, br.price-expensive, br.spend-with]
  notes: "Revisão prioriza o vocabulário de custo (driver, right-sizing, reserved, spot, egress, idle, showback) e os calques de preço e gasto."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
