review:
  preferTags: [vocab.finops, br.an-economy, br.worths]
  notes: "Revisão prioriza a estrutura ask → return → payback → âncora e os calques (an economy of, it worths, spend with)."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
