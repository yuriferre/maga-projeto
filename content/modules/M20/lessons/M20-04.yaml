review:
  preferTags: [vocab.finops, br.worths, br.an-economy]
  notes: "Revisão prioriza a estrutura economia+porém, 'not worth the effort', false economy e os calques (an economy of, doesn't worth, spend with)."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
