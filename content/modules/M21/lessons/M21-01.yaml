  - { front: "option", back: "Alternativa na mesa — 'we considered three options'.", tag: vocab.decisions }
  - { front: "rationale", back: "O porquê que liga escolha à constraint — 'the rationale is decoupling'.", tag: vocab.decisions }
  - { front: "constraint", back: "Restrição real — 'the constraint is the Q3 deadline'.", tag: vocab.decisions }
  - { front: "to go with", back: "Escolher — 'we're going with a queue'.", tag: vocab.decisions }
  - { front: "decoupling", back: "Separar o que andava junto — 'the queue buys decoupling'.", tag: vocab.decisions }
  - { front: "a rewrite", back: "Refazer do zero — 'six months, no features'.", tag: vocab.decisions }
  - { front: "off the table", back: "Fora de cogitação — 'the rewrite is off the table'.", tag: vocab.decisions }
  - { front: "weigh", back: "Pesar/comparar — 'we weighed X against the deadline'.", tag: vocab.decisions }
  - { front: "downside", back: "O lado ruim — 'the downside is ops complexity'.", tag: vocab.decisions }
  - { front: "reversible", back: "Desfazível barato — 'roll back within a day'.", tag: vocab.decisions }
  - { front: "walk through", back: "Guiar pelo raciocínio — 'walk me through the decision'.", tag: vocab.decisions }

review:
  preferTags: [vocab.decisions, gram.argument-connectors, br.i-am-agree]
  notes: "Revisão prioriza a estrutura em cinco batidas, os conectores de cada batida e os três calques de argumentação."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
