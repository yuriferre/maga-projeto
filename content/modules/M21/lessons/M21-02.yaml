review:
  preferTags: [vocab.decisions, gram.argument-connectors, br.instead-of]
  notes: "Revisão prioriza a fórmula 'we chose X over Y because…', o ciclo de status do ADR e os calques de argumentação na escrita."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
