review:
  preferTags: [vocab.risk, gram.probability-modals, br.compensate-risk]
  notes: "Revisão prioriza a troca nomeada, o downside dimensionado, o veredito com 'on balance' e os calques (offsets, at risk, the same as)."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
