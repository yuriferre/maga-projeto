review:
  preferTags: [vocab.disagreement, gram.hedging, br.in-my-vision]
  notes: "Revisão prioriza a escala de cinco degraus, os hedges (I'd, I'm not sure) e os quatro calques do debate (in my view, controversial, right?, anything)."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
