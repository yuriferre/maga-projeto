  - { front: "that's true as far as it goes", back: "Concede com limite — '…but it ignores the audit trail'.", tag: vocab.disagreement }
  - { front: "what would change your mind?", back: "Testa convicção — sem resposta = debate de fé.", tag: vocab.disagreement }
  - { front: "what am I missing?", back: "Humildade que exige evidência do outro lado.", tag: vocab.disagreement }
  - { front: "strong opinions, loosely held", back: "Defende firme, solta rápido — a postura do debatedor.", tag: vocab.disagreement }
  - { front: "I'm with you on X", back: "Isola o acordo antes da divergência.", tag: vocab.disagreement }
  - { front: "steelman", back: "A versão mais forte do argumento alheio — antes de refutar.", tag: vocab.disagreement }
  - { front: "help me understand", back: "Pergunta que expõe a lacuna sem confrontar.", tag: vocab.disagreement }
  - { front: "I'll concede that", back: "Entrega o ponto real — fortalece o resto.", tag: vocab.disagreement }
  - { front: "let's not talk past each other", back: "Realinha — 'are we debating scope or timeline?'.", tag: vocab.disagreement }
  - { front: "didn't see anything", back: "Sem dupla negação — 'didn't … anything'.", tag: br.double-negative }
  - { front: "happy to be wrong", back: "O convite à correção — 'show me the schema is fine'.", tag: vocab.disagreement }

review:
  preferTags: [vocab.disagreement, gram.hedging, br.no-tag]
  notes: "Revisão prioriza as quatro peças (validar → discordar → razão → pergunta), 'where we differ', steelman e os calques (right?, same as, instead of, in my view)."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
