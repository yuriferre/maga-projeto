  - en: "We're going in circles — let's park the rewrite and agree on the schema."
    pt: "Estamos girando em círculos — vamos estacionar a reescrita e concordar no schema."
    context: "Nomear o loop para sair dele."
  - en: "I'll own the spike — schema fix timed, numbers by Thursday."
    pt: "Eu assumo o spike — conserto do schema cronometrado, números até quinta."
