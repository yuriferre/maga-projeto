review:
  preferTags: [vocab.disagreement, gram.hedging, br.double-negative]
  notes: "Revisão prioriza o debate completo: escala sob pressão, as quatro peças, steelman + burden of proof, o fecho testável e disagree and commit."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
