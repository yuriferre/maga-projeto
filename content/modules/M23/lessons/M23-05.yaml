    pt: "Temos certeza de que precisamos de microsserviços — ou de que precisamos dos bugs do billing fora?"
    context: "A pergunta que reenquadra."
  - en: "Let me finish — then the floor is yours."
    pt: "Deixe-me terminar — depois a palavra é sua."
