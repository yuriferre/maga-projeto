id: M23-05
module: M23
order: 5
title: "[SIM] O debate: monólito × microsserviços com colega insistente"
objective: >-
  Ao final, você sustenta um debate técnico completo contra
  um colega insistente — calibrando a escala, usando as
  quatro peças, lendo o registro e fechando em consenso.
durationMin: 50
competencies: [SPK, CNF, LIS]
tags: [vocab.disagreement, gram.hedging, comp.speaking, comp.listening, comp.confidence]
prerequisites: [M23-04]

context:
  scenario: |
    A simulação final do módulo. A Beth insiste: o billing
    vira microsserviço, ponto. Você defende: conserta o
    schema no monólito primeiro. Quatro rodadas, e cada uma
    pede uma ferramenta diferente do módulo:

    - **Rodada 1 — ela abre forte**: "*microservices, no
      debate needed*". Você responde no degrau certo —
      pergunta, não espelhamento da força.
    - **Rodada 2 — ela insiste e erra um fato**: validar →
      corrigir → nomear a divergência exata.
    - **Rodada 3 — ela não cede**: steelman + "what would
      it take" — a oposição vira condição.
    - **Rodada 4 — o fechamento**: estacionar o que trava,
      inventariar o acordo, "disagree and commit".

    O objetivo não é vencer — é o debate terminar com uma
    decisão testável e os dois ainda conversando.
  roles: [Yuri (platform engineer), Beth (staff engineer), Carlos (SRE lead)]

vocabulary:
  - term: "no debate needed"
    meaning: 'sem debate necessário — a tentativa de fechar antes de abrir'
    example: "Beth opened with 'microservices, no debate needed' — a closed door."
    translation: "A Beth abriu com 'microsserviços, sem debate necessário' — porta fechada."
    note: "Responda com pergunta — não espelhe a força."
  - term: "let's keep this about the facts"
    meaning: 'mantenhamos isso nos fatos — realinha quando esquenta'
    example: "Let's keep this about the facts — what does the bug data show?"
    translation: "Vamos manter isso nos fatos — o que os dados de bugs mostram?"
    note: "Tira o debate do plano pessoal e devolve aos dados."
  - term: "you keep saying X — show me"
    meaning: 'você continua dizendo X — me mostre; pede prova da repetição'
    example: "You keep saying 'scale' — show me where the monolith hit its limit."
    translation: "Você continua dizendo 'escala' — me mostre onde o monólito bateu no limite."
    note: "Repetição não é evidência — peça o dado por trás."
  - term: "we're going in circles"
    meaning: 'estamos girando em círculos — nomeia o loop do debate'
    example: "We're going in circles — let's park the rewrite and agree on the schema."
    translation: "Estamos girando em círculos — vamos estacionar a reescrita e concordar no schema."
    note: "Nomear o círculo é o primeiro passo para sair dele."
  - term: "the burden of proof"
    meaning: 'o ônus da prova — quem propõe a mudança prova'
    example: "The burden of proof is on the rewrite — the monolith is the status quo."
    translation: "O ônus da prova é da reescrita — o monólito é o status quo."
    note: "Quem quer mudar é quem demonstra — não o contrário."
  - term: "let me finish"
    meaning: 'deixe-me terminar — retoma a palavra sem escalar'
    example: "Let me finish — then the floor is yours."
    translation: "Deixe-me terminar — depois a palavra é sua."
    note: "Curto e neutro — devolve a palavra em seguida."
  - term: "point taken"
    meaning: 'ponto anotado — reconhece o argumento do outro'
    example: "Point taken on the deploy coupling — that part is real."
    translation: "Ponto anotado sobre o acoplamento do deploy — essa parte é real."
    note: "Reconhecer o ponto real não enfraquece a sua posição."
  - term: "that's a separate issue"
    meaning: 'isso é outra questão — separa o que se misturou'
    example: "The audit trail is a separate issue — it breaks under either design."
    translation: "A trilha de auditoria é outra questão — quebra nas duas arquiteturas."
    note: "Debates travam quando duas questões fingem ser uma."
  - term: "I'll own the spike"
    meaning: 'eu assumo o spike — pega a tarefa que destrava o debate'
    example: "I'll own the spike — numbers by Thursday."
    translation: "Eu assumo o spike — números até quinta."
    note: "Quem propõe o teste e o executa move o debate de verdade."
  - term: "let's not make it personal"
    meaning: 'não vamos tornar pessoal — protege a relação'
    example: "Let's not make it personal — we both want billing fixed."
    translation: "Não vamos tornar pessoal — nós dois queremos o billing consertado."
    note: "A frase que devolve o debate ao problema."
  - term: "steel yourself for…"
    meaning: 'se prepare para… — a frase não; o steelman, sim'
    example: "I steelmanned her case: microservices do isolate the blast radius."
    translation: "Fiz o steelman do caso dela: microsserviços de fato isolam o blast radius."
    note: "O steelman honesto é o que dói de fazer — e o que convence."
  - term: "the deciding factor"
    meaning: 'o fator decisivo — o que pesa na escolha'
    example: "The deciding factor isn't scale — it's the audit trail."
    translation: "O fator decisivo não é escala — é a trilha de auditoria."
    note: "Nomeie o que decide — debates vagos nunca fecham."

grammar:
  title: "o debate inteiro em uma gramática"
  explanation: |
    A sim junta as três aulas em uma gramática só:

    - **O degrau certo sob pressão**: quando ela abre no
      topo ("*no debate needed*"), você desce para a
      pergunta — "*are we sure we need it?*" — e deixa a
      escala trabalhar.
    - **As quatro peças embaralhadas**: validar
      ("*point taken*"), discordar ("*where we differ
      is*"), razão ("*because the bug data says*"),
      devolver ("*what would it take*").
    - **O condicional do teste**: "*if the spike lands in
      a week, the rewrite makes sense*" — a proposta
      testável é o único fim honesto do debate.
    - **O fecho sem vencedor**: "*we're going in circles —
      let's park it*", "*aligned?*"

    E os calques sob pressão — quando sobe a adrenalina,
    volta o português:

    - "**in my vision**" → "**in my view**"
    - "**this is polemic**" → "**controversial**"
    - "**you disagree, no?**" → "**, right?**"
    - "**I didn't hear nothing**" → "**didn't hear
      anything**"
  examples:
    - { en: "Are we sure we need microservices — or do we need the bugs gone?", pt: "Temos certeza de que precisamos de microsserviços — ou de que precisamos dos bugs fora?" }
    - { en: "Point taken on the deploy coupling — where we differ is the fix.", pt: "Ponto anotado sobre o acoplamento do deploy — onde divergimos é a solução." }
    - { en: "Let's keep this about the facts — what does the bug data show?", pt: "Vamos manter isso nos fatos — o que os dados de bugs mostram?" }
    - { en: "You keep saying 'scale' — show me where the monolith hit its limit.", pt: "Você continua dizendo 'escala' — me mostre onde o monólito bateu no limite." }
    - { en: "If the spike lands in a week, the rewrite makes sense — fair?", pt: "Se o spike cair numa semana, a reescrita faz sentido — justo?" }
    - { en: "We're going in circles — park the rewrite, agree on the schema.", pt: "Estamos girando em círculos — estacione a reescrita, concorde no schema." }

examples:
