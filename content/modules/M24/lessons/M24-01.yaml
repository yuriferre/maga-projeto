review:
  preferTags: [vocab.presentation, gram.signposting, br.want-that]
  notes: "Revisão prioriza a espinha (abertura → transições → recap → wrap up → takeaway), os três tempos do signposting e os quatro calques de palco."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
