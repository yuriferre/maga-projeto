review:
  preferTags: [vocab.presentation, gram.signposting, br.in-the-screen, br.make-question]
  notes: "Revisão prioriza o mapa dos cinco minutos, a rubrica de quatro peças, o fechamento no tempo e os calques de palco sob pressão."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
