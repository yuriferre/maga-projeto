review:
  preferTags: [vocab.rfc, br.in-other-hand, br.do-suggestion]
  notes: "Revisão prioriza o resumo de três frases, a alternativa honesta, a falsificabilidade e os calques da escrita."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
