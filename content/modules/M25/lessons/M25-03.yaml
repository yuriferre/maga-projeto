review:
  preferTags: [vocab.rfc, br.comment-in, br.suggest-to, gram.indirect-questions]
  notes: "Revisão prioriza os três registros do comentário, o peso declarado, o nit separado e os calques do review escrito."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
