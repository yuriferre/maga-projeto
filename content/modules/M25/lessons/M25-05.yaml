review:
  preferTags: [vocab.rfc, br.comment-in, br.do-suggestion, gram.hedging]
  notes: "Revisão prioriza o ciclo completo — reconhecer, lacuna, sugestão, aval condicional — e a RFC auto-contida."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
