review:
  preferTags: [vocab.interview, br.work-since, br.formed-in]
  notes: "Revisão prioriza a espinha de três peças, os três tamanhos e os tempos disciplinados."

completion:
  quizMin: 0.75
  writingMin: 3
  speakingRequired: true
