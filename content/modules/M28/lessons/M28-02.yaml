id: M28-02
module: M28
order: 2
title: "Expectativas: salário, remoto, disponibilidade, visto e notice"
objective: >-
  Ao final, você sabe responder às perguntas delicadas
  do screening — salário, remoto, disponibilidade,
  visto e notice period — com frases que mantêm sua
  posição de negociação.
durationMin: 30
competencies: [SPK, LIS]
tags: [vocab.interview, comp.speaking, comp.listening]
prerequisites: [M28-01]

context:
  scenario: |
    A parte mais desconfortável do screening: números
    e logística. O recrutador pergunta direto — e a
    forma como você responde afeta a oferta depois.

    As regras do jogo:

    - **Salário**: nunca dê um número único primeiro.
      Dê uma **faixa** ("I'm targeting the $140–160k
      range") ou devolva a pergunta ("what's the
      budgeted range?"). "Pretensão salarial" não
      existe em inglês — é **expectations**.
    - **Remoto/híbrido**: seja direto sobre sua
      preferência, mas mostre flexibilidade:
      "remote is my strong preference".
    - **Disponibilidade**: notice period é o tempo
      até começar — "my notice is two weeks".
      Brasileiro diz "aviso prévio" → **notice**,
      nunca "advice".
    - **Visto/sponsorship**: resposta direta.
      "I'd need sponsorship" ou "I'm authorized
      to work in…". Esconder só adia o problema.

    O erro do brasileiro: traduzir "pretensão
    salarial" literalmente, dizer "I have interest"
    (quer dizer participação acionária!), e travar
    quando perguntam de visto.
  roles: [Yuri (platform engineer), Rachel (recruiter)]

vocabulary:
  - term: "I'm targeting the $X–$Y range"
    meaning: 'estou mirando a faixa $X–$Y — resposta de salário com faixa'
    example: "I'm targeting the $140–160k range, depending on the full package."
    translation: "Estou mirando a faixa de $140–160 mil, dependendo do pacote completo."
    note: "Faixa, não número único — mantém espaço para negociar depois."
  - term: "what's the budgeted range?"
    meaning: 'qual a faixa orçada? — devolve a pergunta'
    example: "Before I give a number — what's the budgeted range for this role?"
    translation: "Antes de eu dar um número — qual a faixa orçada para essa vaga?"
    note: "Devolve a pergunta — quem fala o número primeiro perde."
  - term: "depending on the full package"
    meaning: 'dependendo do pacote completo — hedge legítimo'
    example: "I'm targeting $150k, depending on the full package — equity, bonus, benefits."
    translation: "Miro $150k, dependendo do pacote completo — equity, bônus, benefícios."
    note: "Justifica a faixa: base não é tudo."
  - term: "remote is my strong preference"
    meaning: 'remoto é minha forte preferência — preferência clara mas flexível'
    example: "Remote is my strong preference, but I'd consider hybrid for the right team."
    translation: "Remoto é minha forte preferência, mas consideraria híbrido pelo time certo."
    note: "Claro sem fechar portas."
  - term: "I'm authorized to work in…"
    meaning: 'sou autorizado a trabalhar em… — resposta de visto positiva'
    example: "I'm authorized to work in Brazil — I'd need sponsorship for the US."
    translation: "Sou autorizado a trabalhar no Brasil — precisaria de patrocínio para os EUA."
    note: "Afirme o que você PODE antes do que não pode."
  - term: "I'd need visa sponsorship"
    meaning: 'eu precisaria de patrocínio de visto — resposta direta'
    example: "For US-based roles, I'd need visa sponsorship."
    translation: "Para vagas nos EUA, eu precisaria de patrocínio de visto."
    note: "Direto — esconder só adia o problema."
  - term: "my notice period is…"
    meaning: 'meu aviso prévio é… — tempo até começar'
    example: "My notice period is two weeks — I could start by mid-March."
    translation: "Meu aviso prévio é de duas semanas — poderia começar em meados de março."
    note: "Sempre 'notice', nunca 'advice'."
  - term: "I can start in…"
    meaning: 'posso começar em… — converte notice em data'
    example: "I can start in early April — two weeks' notice plus a week to wrap up."
    translation: "Posso começar no início de abril — duas semanas de aviso mais uma para finalizar."
    note: "Transforme o notice numa data concreta."
  - term: "immediately available"
    meaning: 'disponível imediatamente — sem notice'
    example: "I'm immediately available — I left my last role in December."
    translation: "Estou disponível imediatamente — saí do último emprego em dezembro."
    note: "Se não está empregado, isso é um ponto forte — diga."
  - term: "does the role support remote work?"
    meaning: 'a vaga aceita remoto? — devolve a pergunta de logística'
    example: "Does the role support fully remote work, or is hybrid expected?"
    translation: "A vaga aceita totalmente remoto, ou híbrido é esperado?"
    note: "Você também pode perguntar a logística deles."
  - term: "within the band"
    meaning: 'dentro da faixa — confirmação de compatibilidade salarial'
    example: "That's within the band I had in mind — happy to continue."
    translation: "Isso está dentro da faixa que eu tinha em mente — podemos continuar."
    note: "'Band' é o termo deles — use o vocabulário deles."
  - term: "I'd rather discuss comp later"
    meaning: 'prefiro discutir comp depois — adiar o número'
    example: "I'd rather discuss compensation once I understand the scope better."
    translation: "Prefiro discutir compensação quando entender melhor o escopo."
    note: "Adiar é legítimo — mas dê uma razão."

grammar:
  title: "a gramática das expectativas"
  explanation: |
    Respostas de expectativa usam estruturas
    específicas:

    - "**I'm targeting** + range" — a forma padrão de
      dar faixa salarial.
    - "**Would you need / Are you open to**" →
      responda com o mesmo modal: "*I'd need…*",
      "*I'm open to…*".
    - "**Depending on** the full package" — o hedge
      que mantém a faixa flexível.
    - "**I could start** in March" — could + data
      concreta para disponibilidade.

    Os calques da conversa:

    - "**My pretension**" → "**my expectations** /
      **I'm targeting**".
    - "**I have interest**" → "**I'm interested**".
    - "**two weeks advice**" → "**two weeks'
      notice**".
    - "**I made an interview**" → "**I had an
      interview**".
  examples:
    - { en: "I'm targeting the $140–160k range, depending on the full package.", pt: "Miro a faixa de $140–160k, dependendo do pacote." }
    - { en: "Before I give a number — what's the budgeted range for the role?", pt: "Antes de dar um número — qual a faixa orçada para a vaga?" }
    - { en: "Yes, I'd need sponsorship for the US — remote from Brazil needs none.", pt: "Sim, precisaria de patrocínio para os EUA — remoto do Brasil não precisa." }
    - { en: "My notice is two weeks — I could start in early March.", pt: "Meu aviso é de duas semanas — poderia começar no início de março." }
    - { en: "Remote is my strong preference, but I'd consider hybrid.", pt: "Remoto é minha forte preferência, mas consideraria híbrido." }
    - { en: "I'd rather discuss comp once I understand the scope better.", pt: "Prefiro discutir comp quando entender melhor o escopo." }

examples:
