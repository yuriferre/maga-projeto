  - { id: M28-04-q2, type: error_correction, prompt: "I made an interview with Rachel yesterday.", accepted: ["I had an interview with Rachel yesterday.", "I had an interview with Rachel yesterday", "I did an interview with Rachel yesterday."], explanation: "'Had an interview'.", tags: [br.make-interview] }
  - { id: M28-04-q3, type: multiple_choice, prompt: "'That's helpful context' do recrutador é…", options: ["sarcasmo", "um pedido de silêncio", "sinal positivo — sua resposta virou material repassável", "uma objeção"], answer: 2, explanation: "Ele anota para o hiring manager.", tags: [vocab.interview] }
  - { id: M28-04-q4, type: fill_blank, prompt: "We're at ___ — any final questions?", accepted: ["time"], explanation: "'We're at time' — o fecho formal.", tags: [vocab.interview] }
  - { id: M28-04-q5, type: multiple_choice, prompt: "A autoavaliação da simulação usa…", options: ["a intuição", "a memória", "a opinião de amigos", "a gravação + a rubrica do recrutador por fase"], answer: 3, explanation: "O áudio não mente.", tags: [vocab.interview] }
  - { id: M28-04-q6, type: error_correction, prompt: "I work here since five years.", accepted: ["I've worked here for five years.", "I've worked here for five years", "I've been here for five years."], explanation: "'For five years' + present perfect.", tags: [br.work-since] }
  - { id: M28-04-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["should", "expect", "when", "i", "back", "to", "hear"], answer: "when should i expect to hear back", explanation: "A pergunta de timeline.", tags: [vocab.interview] }
  - { id: M28-04-q8, type: multiple_choice, prompt: "O fecho ideal do screening é…", options: ["'bye'", "'do I get the job?'", "silêncio", "'that covers everything — looking forward to the next steps'"], answer: 3, explanation: "Entusiasmado mas econômico.", tags: [vocab.interview] }

