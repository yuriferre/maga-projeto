id: M29-02
module: M29
order: 2
title: "Respostas estruturadas sem decorar: esqueleto + detalhes reais"
objective: >-
  Ao final, você sabe por que decorar respostas
  quebra na entrevista — e como preparar esqueletos
  com detalhes reais que sobrevivem a follow-ups.
durationMin: 30
competencies: [SPK, CNF]
tags: [vocab.interview, comp.speaking, comp.confidence]
prerequisites: [M29-01]

context:
  scenario: |
    O entrevistador experiente sente a resposta
    decorada: ela sai lisa demais, rápida demais —
    e morre no primeiro follow-up ("wait, what did
    the metric actually measure?").

    A alternativa não é improvisar — é **preparar
    o esqueleto, não o texto**:

    - **O esqueleto é STAR** — S curto, T seu, A
      no "I", R com número + lição. Você decora
      a ESTRUTURA, não as frases.
    - **Os detalhes são reais** — você fala do que
      aconteceu, então o follow-up não assusta:
      a pergunta "o que a métrica media?" tem
      resposta porque você estava lá.
    - **As âncoras salvam** — 3–4 palavras-chave
      por história ("friday, 500ing, index") são
      o que você memoriza; o resto você reconstrói
      na hora.

    O teste do preparo bom: se alguém te acordar às
    3h e pedir a história do incidente, você conta
    — porque é sua. A resposta decorada não passa
    nesse teste.

    O erro do brasileiro: ensaiar a frase exata em
    inglês — que sai robótica e quebra quando a
    pergunta vem por outro ângulo.
  roles: [Yuri (platform engineer), Marcus (eng manager, interviewer)]

vocabulary:
  - term: "I don't memorize answers — I know my stories"
    meaning: 'não decoro respostas — conheço minhas histórias'
    example: "I don't memorize answers — I know my stories cold enough to tell them any way you ask."
    translation: "Não decoro respostas — conheço minhas histórias o suficiente para contá-las de qualquer jeito."
    note: "O preparo é no esqueleto e nos fatos — não no texto."
  - term: "the bones of the story"
    meaning: 'os ossos da história — o esqueleto STAR'
    example: "I know the bones of the story — the rest I rebuild in the moment."
    translation: "Conheço os ossos da história — o resto eu reconstruo na hora."
    note: "Esqueleto decorado, carne reconstruída."
  - term: "give me a second to think"
    meaning: 'me dê um segundo para pensar — a pausa legítima'
    example: "Good question — give me a second to think of the right example."
    translation: "Boa pergunta — me dê um segundo para pensar no exemplo certo."
    note: "A pausa natural lê como honestidade — a resposta instantânea lê como decoreba."
  - term: "let me think of the right example"
    meaning: 'deixe-me pensar no exemplo certo — escolhendo do banco'
    example: "Let me think of the right example — I have two that fit."
    translation: "Deixe-me pensar no exemplo certo — tenho dois que servem."
    note: "A pausa que mostra um banco, não um script."
  - term: "the details are real"
    meaning: 'os detalhes são reais — a prova contra a decoreba'
    example: "The details are real — I was there, so follow-ups don't scare me."
    translation: "Os detalhes são reais — eu estava lá, então follow-ups não assustam."
    note: "Quem viveu a história responde qualquer follow-up."
  - term: "anchor words"
    meaning: 'palavras-âncora — o que você memoriza de cada história'
    example: "My anchor words for the incident story: 'Friday, 500ing, missing index'."
    translation: "Minhas palavras-âncora para a história do incidente: 'sexta, 500, índice faltando'."
    note: "3–4 âncoras por história — o resto se reconstrói."
  - term: "off the top of my head"
    meaning: 'de cabeça — a resposta espontânea declarada'
    example: "Off the top of my head, the number was around twelve minutes."
    translation: "De cabeça, o número era em torno de doze minutos."
    note: "Marca o detalhe como aproximado mas real."
  - term: "it went something like this"
    meaning: 'foi mais ou menos assim — a história reconstruída'
    example: "It went something like this: Friday, 4pm, checkout starts 500ing…"
    translation: "Foi mais ou menos assim: sexta, 16h, o checkout começa a dar 500…"
    note: "O marcador de quem conta do vivido, não do decorado."
  - term: "I hadn't prepared that one"
    meaning: 'essa eu não tinha preparado — a honestidade desarmante'
    example: "Honestly, I hadn't prepared that one — let me think."
    translation: "Sinceramente, essa eu não tinha preparado — deixe-me pensar."
    note: "Admitir a surpresa lê melhor que improvisar um script."
  - term: "the short answer is…"
    meaning: 'a resposta curta é… — a síntese antes do detalhe'
    example: "The short answer is yes — let me give you the story behind it."
    translation: "A resposta curta é sim — deixe-me dar a história por trás."
    note: "Responde direto, depois expande."
  - term: "drill into it"
    meaning: 'cavar fundo — o follow-up técnico'
    example: "Happy to drill into it — which part should I expand?"
    translation: "Posso aprofundar — qual parte devo expandir?"
    note: "O convite ao follow-up depois da resposta curta."
  - term: "rehearsed vs prepared"
    meaning: 'decorado × preparado — a distinção central'
    example: "I came prepared, not rehearsed — I know my stories, not my lines."
    translation: "Vim preparado, não decorado — conheço minhas histórias, não minhas falas."
    note: "A diferença que o entrevistador sente."

grammar:
  title: "a gramática da resposta viva"
  explanation: |
    A resposta viva tem marcadores de espontaneidade
    legítima:

    - "**Give me a second** to think" — a pausa
      que não é fraqueza.
    - "**Let me think of** the right example" —
      escolhendo do banco.
    - "**Off the top of my head**" — o número
      aproximado declarado.
    - "**It went something like this**" — a
      história reconstruída.
    - "**The short answer is** X — let me give
      you the story" — síntese antes do detalhe.
    - "**I hadn't prepared that one**" — a
      honestidade que desarma.

    E o tempo verbal continua: fatos no **simple
    past**, reflexão no **looking back / what I
    learned**.
  examples:
    - { en: "Good question — give me a second to think of the right example.", pt: "Boa pergunta — me dê um segundo para pensar no exemplo certo." }
    - { en: "Off the top of my head, it was around twelve minutes.", pt: "De cabeça, era em torno de doze minutos." }
    - { en: "It went something like this: Friday, 4pm, checkout starts 500ing.", pt: "Foi mais ou menos assim: sexta, 16h, o checkout começa a dar 500." }
    - { en: "The short answer is yes — let me give you the story behind it.", pt: "A resposta curta é sim — deixe-me dar a história por trás." }
    - { en: "Honestly, I hadn't prepared that one — let me think.", pt: "Sinceramente, essa eu não tinha preparado — deixe-me pensar." }
    - { en: "Happy to drill into it — which part should I expand?", pt: "Posso aprofundar — qual parte devo expandir?" }

