id: M30-06
module: M30
order: 6
title: "Simulação: entrevista técnica de 45 min (design + troubleshooting)"
objective: >-
  Ao final, você atravessou uma entrevista técnica
  simulada inteira — pensar em voz alta,
  esclarecimento, design narrado e troubleshooting —
  e se avaliou pela rubrica do entrevistador.
durationMin: 50
competencies: [SPK, LIS, CNF]
tags: [vocab.sysdesign, vocab.troubleshoot, comp.speaking]
prerequisites: [M30-05]

context:
  scenario: |
    A entrevista técnica completa. A Dana te guia por
    ~45 minutos em quatro blocos — e você responde
    cada um de verdade, em voz alta.

    **Os quatro blocos:**

    - **Bloco 1 — Aquecimento** (5 min): factual
      rápido — "why IaC?", "walk me through your
      pipeline" → definição → porquê → exemplo.
    - **Bloco 2 — System design** (20 min):
      "design a rate limiter" → esclarecer (3–5
      perguntas) → recap → interface → caixas →
      fluxos → escala → trade-offs → "drill into".
    - **Bloco 3 — Troubleshooting** (15 min): "the
      site is slow — walk me through" → sintoma →
      candidatos → checagens → eliminação → causa.
    - **Bloco 4 — Fecho** (5 min): "what would you
      monitor?" + suas perguntas técnicas.

    **A rubrica (autoavaliação):**

    - Pensou em voz alta o tempo todo (silêncio
      ≤ 10 s)?
    - Esclareceu antes de desenhar (3–5 perguntas)?
    - Narrou na ordem: recap → interface → caixas →
      fluxos → escala → trade-off?
    - Investigou por eliminação, não por chute?
    - Nomeou trade-offs e o que monitoraria?

    Grave a simulação inteira. Ouça uma vez marcando
    cada sinal da rubrica — a meta é o processo
    visível do início ao fim.
  roles: [Yuri (platform engineer), Dana (staff engineer, interviewer)]

vocabulary:
  - term: "let's start with a quick factual round"
    meaning: 'vamos começar com uma rodada factual — a abertura'
    example: "Let's start with a quick factual round — then we go deeper."
    translation: "Vamos começar com uma rodada factual — depois aprofundamos."
    note: "O aquecimento antes do design."
  - term: "now the design portion"
    meaning: 'agora a parte de design — a transição para o bloco principal'
    example: "Good — now the design portion. Design a rate limiter for our API."
    translation: "Bom — agora a parte de design. Desenhe um rate limiter para nossa API."
    note: "A transição que abre o bloco de 20 minutos."
  - term: "switching gears"
    meaning: 'mudando de marcha — a transição entre blocos'
    example: "Switching gears — the site is slow. Walk me through your debugging."
    translation: "Mudando de marcha — o site está lento. Me guie pela sua depuração."
    note: "A transição design → troubleshooting."
  - term: "what would you monitor?"
    meaning: 'o que você monitoraria? — a pergunta de observabilidade'
    example: "Last one — what would you monitor on this rate limiter?"
    translation: "Última — o que você monitoraria nesse rate limiter?"
    note: "A pergunta que testa se você pensa em produção."
  - term: "what would you add with more time?"
    meaning: 'o que você adicionaria com mais tempo? — a pergunta de visão'
    example: "What would you add with more time — priorities for v2?"
    translation: "O que adicionaria com mais tempo — prioridades para a v2?"
    note: "Mostra que você vê além do esboço."
  - term: "you caught yourself — good"
    meaning: 'você se corrigiu — bom — o sinal que o entrevistador dá'
    example: "You caught yourself mid-thought — that's what I want to see."
    translation: "Você se corrigiu no meio do pensamento — é isso que quero ver."
    note: "A autocorreção sendo marcada positivamente."
  - term: "walk me through the trade-off again"
    meaning: 'me guie pelo trade-off de novo — o follow-up de design'
    example: "Walk me through the trade-off again — why stale counters are fine."
    translation: "Me guie pelo trade-off de novo — por que contadores velhos são ok."
    note: "O follow-up que testa se o trade-off foi decisão, não sorte."
  - term: "that's a senior answer"
    meaning: 'essa é uma resposta de senior — o reconhecimento do processo'
    example: "Clarifying first, narrating throughout — that's a senior answer."
    translation: "Esclarecer primeiro, narrando o tempo todo — resposta de senior."
    note: "O elogio ao processo, não à resposta."
  - term: "any red flags in this design?"
    meaning: 'alguma bandeira vermelha nesse design? — a autocrítica'
    example: "Before we wrap — any red flags in this design you'd fix?"
    translation: "Antes de fechar — alguma bandeira vermelha que você corrigiria?"
    note: "A autocrítica do próprio design — diga uma."
  - term: "the single point of failure"
    meaning: 'o ponto único de falha — o que você deve nomear'
    example: "The single point of failure is the counter store — I'd add a fallback."
    translation: "O ponto único de falha é o store de contadores — eu adicionaria um fallback."
    note: "Nomear o SPOF do próprio design é ouro."
  - term: "let me pressure-test that"
    meaning: 'deixe-me testar isso sob pressão — a autoverificação'
    example: "Let me pressure-test that: 10x traffic, Redis down — what breaks?"
    translation: "Deixe-me testar sob pressão: 10× o tráfego, Redis fora — o que quebra?"
    note: "Testar o próprio design antes de ser testado."
  - term: "time check — how are we doing?"
    meaning: 'checagem de tempo — como estamos? — gerenciar o relógio'
    example: "Time check — how are we doing? Should I go deeper on any piece?"
    translation: "Checagem de tempo — como estamos? Aprofundo em alguma peça?"
    note: "Gerenciar os 45 min é parte da prova."

grammar:
  title: "a gramática da entrevista inteira"
  explanation: |
    Os quatro blocos usam as molduras das aulas
    anteriores — a novidade são as transições e a
    autogestão:

    - **Transições**: "**switching gears**…" /
      "**now the design portion**".
    - **Follow-ups**: "**walk me through the
      trade-off again**" — testam se foi decisão.
    - **Autocrítica**: "**any red flags** /
      **the single point of failure is**…".
    - **Autoverificação**: "**let me
      pressure-test that**: 10x traffic, Redis
      down — what breaks?".
    - **O relógio**: "**time check — how are we
      doing?**".

    O entrevistador avalia o processo inteiro —
    os blocos são as aulas 01–05 em sequência.
  examples:
    - { en: "Switching gears — the site is slow. Walk me through your debugging.", pt: "Mudando de marcha — o site está lento. Me guie pela depuração." }
    - { en: "You caught yourself mid-thought — that's what I want to see.", pt: "Você se corrigiu no meio — é o que quero ver." }
    - { en: "Walk me through the trade-off again — why stale counters are fine.", pt: "Me guie pelo trade-off de novo — por que contadores velhos são ok." }
    - { en: "The single point of failure is the counter store — I'd add a fallback.", pt: "O SPOF é o store de contadores — adicionaria um fallback." }
    - { en: "Let me pressure-test that: 10x traffic, Redis down — what breaks?", pt: "Testando sob pressão: 10× tráfego, Redis fora — o que quebra?" }
    - { en: "Time check — how are we doing? Should I go deeper on any piece?", pt: "Checagem de tempo — aprofundo em alguma peça?" }

