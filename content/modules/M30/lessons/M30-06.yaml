  - en: "You caught yourself mid-thought — that's exactly what I want to see."
    pt: "Você se corrigiu no meio do pensamento — exatamente o que quero ver."
    context: "A autocorreção marcada."
  - en: "The single point of failure is the counter store — I'd add a fallback."
    pt: "O ponto único de falha é o store — adicionaria um fallback."
