  - { id: M31-02-q6, type: error_correction, prompt: "Can I negotiate more vacations?", accepted: ["Can I negotiate more vacation days?", "Can I negotiate more vacation days", "Can I negotiate more PTO?"], explanation: "'Vacation days/PTO'.", tags: [br.more-vacations] }
  - { id: M31-02-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["was", "i", "hoping", "for", "base", "the", "on", "$160k"], answer: "i was hoping for $160k on the base", explanation: "O pedido suave.", tags: [vocab.compensation] }
