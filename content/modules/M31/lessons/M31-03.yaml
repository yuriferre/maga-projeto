variations:
  - idea: '"o fecho"'
    items:
      - { register: "Forte", text: "I'm thrilled to accept — confirming the details: $160k base, start March 3rd.", adequate: true }
      - { register: "Forte", text: "I'll get back to you by Monday EOD — is that workable?", adequate: true }
      - { register: "Fraco", text: "Yes, whatever the terms were — count me in.", adequate: false, note: "Aceitar sem confirmar os números por escrito é risco." }
      - { register: "Fraco", text: "I'll think about it — maybe sometime next month.", adequate: false, note: "Tempo sem data parece dúvida, não consideração." }
  - idea: '"a recusa"'
    items:
      - { register: "Forte", text: "I've decided to accept another offer — a closer match for my goals. I hope we stay in touch.", adequate: true }
      - { register: "Forte", text: "This wasn't an easy decision — the team was a highlight.", adequate: true }
      - { register: "Fraco", text: "Your offer lost — the other one pays way more.", adequate: false, note: "Detalhar a outra oferta e humilhar queima a ponte." }
      - { register: "Fraco", text: "Just not interested — please stop emailing.", adequate: false, note: "Recusar sem gratidão fecha uma porta que você pode precisar." }

brErrors:
  - { wrong: "My actual salary offer is $160k.", right: "My current salary offer is $160k.", why: "current", tag: br.actual-current }
  - { wrong: "I'm refusing the job proposal.", right: "I'm declining the job offer.", why: "decline a job offer", tag: br.job-proposal }
  - { wrong: "They offer me more vacations.", right: "They offer me more vacation days.", why: "vacation days/PTO", tag: br.more-vacations }
  - { wrong: "The thirteenth salary is included.", right: "The 13th-month bonus is included.", why: "13th-month bonus", tag: br.thirteenth-salary }
  - { wrong: "My salary pretension was met.", right: "My salary expectations were met.", why: "expectations", tag: br.pretension }
  - { wrong: "I'll win a signing bonus.", right: "I'll get a signing bonus.", why: "get/receive", tag: br.win-money }
  - { wrong: "I have interest in accepting.", right: "I'm interested in accepting.", why: "I'm interested", tag: br.have-interest }
  - { wrong: "I'll give two weeks advice tomorrow.", right: "I'll give two weeks' notice tomorrow.", why: "notice", tag: br.advice-notice }
  - { wrong: "We discussed about the start date.", right: "We discussed the start date.", why: "discussed the", tag: br.discuss-about }
  - { wrong: "In my vision the offer is good.", right: "In my view the offer is good.", why: "in my view", tag: br.in-my-vision }

dialogue:
  title: "Os três fechos"
  lines:
    - { speaker: Rachel, text: "So — $160k base, 15% target, $90k RSUs, $25k sign-on, 25 days PTO. What do you say?" }
    - { speaker: Yuri, text: "That's a strong package. I'd like to review it with my family over the weekend — I'll get back to you by Monday EOD. Is that workable?" }
    - { speaker: Rachel, text: "Monday works. And for the other offer you're weighing — anything I should know?" }
    - { speaker: Yuri, text: "It's a good problem to have — two strong teams. This one has the scope I want; I want to give it proper thought, not a rushed yes." }
    - { speaker: Rachel, text: "Fair — talk Monday." }
    - { speaker: Yuri, text: "(Monday) Rachel — I'm thrilled to accept the offer for Senior Platform Engineer. Confirming the details: $160k base, 15% target bonus, $90k in RSUs vesting over four years, $25k sign-on, 25 days PTO, start date March 3rd. I'll sign the paperwork as soon as it arrives." }
    - { speaker: Rachel, text: "Welcome aboard — sending the paperwork today. And the other offer?" }
    - { speaker: Yuri, text: "I owe them a decline — I'll send it today: 'after a lot of thought, I've decided to accept another offer — a closer match for my goals. This wasn't easy — I've genuinely enjoyed the process. I hope we can stay in touch.'" }
    - { speaker: Rachel, text: "That's a graceful decline — the door stays open. See you March 3rd." }
  notes:
    - "o tempo com data ('Monday EOD — workable?') — nunca aberto."
    - "o aceite confirma cada número por escrito — incluindo o start date."
    - "a recusa do outro lado também é por escrito — gratidão, razão curta, porta aberta."

listening:
  lines:
    - { speaker: Rachel, text: "Three closes in writing. Accept with enthusiasm and every number confirmed — what isn't in writing doesn't exist. Buy time with a reason and a date — 'I'll get back to you by Monday EOD — is that workable?' Two or three days max." }
    - { speaker: Yuri, text: "And decline with gratitude, a one-line reason, and the door open — 'this wasn't easy, the team was a highlight, I hope we stay in touch.' Today's recruiter is your contact in three years." }
    - { speaker: Rachel, text: "The Brazilian mistake: declining over WhatsApp, or ghosting — or accepting without confirming the numbers. The close is always written, always dated, always gracious." }
  questions:
    - { id: M31-03-l1, type: multiple_choice, prompt: "Ao aceitar, o que precisa estar por escrito é…", options: ["só o salário", "só a data de início", "só o cargo", "cada número — base, bônus, equity, sign-on, PTO, start date"], answer: 3, explanation: "O que não está escrito não existe.", tags: [comp.listening, vocab.compensation] }
    - { id: M31-03-l2, type: fill_blank, prompt: "I'll get back to you by Monday ___ — is that workable?", accepted: ["eod", "EOD"], explanation: "A data marcada.", tags: [vocab.compensation] }
    - { id: M31-03-l3, type: error_correction, prompt: "I'm refusing the job proposal.", accepted: ["I'm declining the job offer.", "I'm declining the job offer", "I'm declining the offer."], explanation: "'Decline a job offer'.", tags: [br.job-proposal] }
    - { id: M31-03-l4, type: multiple_choice, prompt: "A recusa por escrito leva…", options: ["gratidão + razão em uma frase + porta aberta", "todos os detalhes da outra oferta", "só 'no thanks'", "uma lista de defeitos"], answer: 0, explanation: "O recrutador de hoje é seu contato em três anos.", tags: [comp.listening, vocab.compensation] }
    - { id: M31-03-l5, type: multiple_choice, prompt: "Pedir tempo se faz com…", options: ["um 'let me think' aberto", "uma razão leve + data concreta — 'by Monday EOD, workable?'", "duas semanas", "silêncio"], answer: 1, explanation: "2–3 dias com data marcada.", tags: [comp.listening, vocab.compensation] }
    - { id: M31-03-l6, type: multiple_choice, prompt: "O erro do brasileiro no fecho é…", options: ["confirmar demais", "recusar por WhatsApp, sumir — ou aceitar sem confirmar os números", "agradecer", "pedir tempo"], answer: 1, explanation: "O fecho é sempre escrito e datado.", tags: [comp.listening, vocab.compensation] }

writing:
  prompt: |
    **Cenário:** você decidiu — vai aceitar a
    oferta da Rachel e recusar a outra. O coach
    pediu os dois e-mails por escrito antes de
    enviar.

    **Tarefa:** escreva 100–130 palavras: o
    e-mail de aceite (entusiasmo + cada número
    confirmado + próximo passo) e o e-mail de
    recusa do outro lado (gratidão + razão em
    uma frase + porta aberta) — os dois com
    data e tom profissional.
  constraints:
    - { label: "O aceite com entusiasmo", pattern: "\\bthrilled|excited|accept|delighted|happy\\b" }
    - { label: "Os números confirmados", pattern: "\\bbase|bonus|rsu|sign.on|pto|start|confirming\\b" }
    - { label: "A recusa com porta aberta", pattern: "\\bdecided|another offer|closer match|stay in touch|keep me in mind|grateful\\b" }
    - { label: "A data/próximo passo", pattern: "\\bby (monday|tuesday|wednesday|thursday|friday)|eod|sign|paperwork|onboarding|march|april\\b" }
  rubric:
    - "Aceite confirma cada número por escrito"
    - "Recusa: gratidão + razão em uma frase + porta aberta"
    - "Os dois com data e próximo passo"
    - "Sem calques ('current salary', 'job offer', 'decline')"
  model: >-
    The accept email: "Rachel — I'm thrilled to
    accept the offer for Senior Platform Engineer.
    Confirming the details: $160k base, 15% target
    bonus, $90k in RSUs vesting over four years,
    $25k sign-on, 25 days PTO, start date March
    3rd. I'll sign the paperwork as soon as it
    arrives — excited for the onboarding." The
    decline to the other side: "After a lot of
    thought, I've decided to accept another offer
    — a closer match for my goals at this stage.
    This wasn't an easy decision; I've genuinely
    enjoyed the process and the team. I hope we
    can stay in touch — please keep me in mind for
    future roles." Both dated, both gracious, both
    written.
  minWords: 100
  maxWords: 130
  tags: [comp.writing, vocab.compensation]

