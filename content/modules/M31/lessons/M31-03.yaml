id: M31-03
module: M31
order: 3
title: "Aceitar, pedir tempo e recusar por escrito"
objective: >-
  Ao final, você sabe fechar a negociação por
  escrito em três direções — aceitar com
  entusiasmo e confirmação, pedir tempo com
  data marcada, e recusar deixando a porta
  aberta.
durationMin: 30
competencies: [WRI, SPK]
tags: [vocab.compensation, comp.writing, comp.speaking]
prerequisites: [M31-02]

context:
  scenario: |
    A negociação terminou — agora o fecho por
    escrito, em três direções:

    **Aceitar** — entusiasmo + confirmação do
    pacote por escrito (nada fica só na ligação):

    > "*I'm thrilled to accept the offer for
    > Senior Platform Engineer. Confirming the
    > details: $160k base, 15% target bonus,
    > $90k in RSUs vesting over four years,
    > $25k sign-on, 25 days PTO, start date
    > March 3rd. I'll sign the paperwork as
    > soon as it arrives.*"

    **Pedir tempo** — sempre com data marcada,
    nunca um "let me think" aberto:

    > "*Thank you — this is exciting. I'd like
    > to review it with my family over the
    > weekend. I'll get back to you by Monday
    > EOD — is that workable?*"

    **Recusar** — gratidão + razão curta +
    porta aberta. Nunca queime a ponte — o
    recrutador de hoje é o seu contato em
    três anos:

    > "*After a lot of thought, I've decided to
    > accept another offer that's a closer
    > match for my goals. This wasn't easy —
    > I've genuinely enjoyed the process and
    > the team. I hope we can stay in touch
    > for the future.*"

    As regras do fecho por escrito:

    - **Aceitar**: confirme cada número — o
      que não está por escrito não existe.
    - **Tempo**: 2–3 dias no máximo, com data
      concreta — mais que isso parece dúvida.
    - **Recusar**: a razão em uma frase, sem
      detalhar a outra oferta — e sempre
      "stay in touch".

    O erro do brasileiro: recusar por WhatsApp
    ou sumir — ou aceitar sem confirmar os
    números por escrito.
  roles: [Yuri (platform engineer), Rachel (recruiter)]

vocabulary:
  - term: "I'm thrilled to accept"
    meaning: 'estou animado em aceitar — o aceite com entusiasmo'
    example: "I'm thrilled to accept the offer for Senior Platform Engineer."
    translation: "Estou animado em aceitar a oferta para Senior Platform Engineer."
    note: "Entusiasmo + o título do cargo."
  - term: "confirming the details"
    meaning: 'confirmando os detalhes — o aceite põe tudo por escrito'
    example: "Confirming the details: $160k base, 15% bonus, $90k RSUs, start March 3rd."
    translation: "Confirmando os detalhes: $160k base, 15% bônus, $90k RSUs, início 3 de março."
    note: "Cada número por escrito — o que não está escrito não existe."
  - term: "I'd like to review it over the weekend"
    meaning: 'gostaria de revisar no fim de semana — pedir tempo com plano'
    example: "I'd like to review it with my family over the weekend."
    translation: "Gostaria de revisar com a família no fim de semana."
    note: "Tempo com um motivo leve e uma data."
  - term: "I'll get back to you by Monday EOD"
    meaning: 'te retorno até segunda no fim do dia — a data marcada'
    example: "I'll get back to you by Monday EOD — is that workable?"
    translation: "Te retorno até segunda no fim do dia — funciona?"
    note: "Data concreta + confirmação de que serve."
  - term: "is that workable?"
    meaning: 'isso funciona? — a checagem do prazo'
    example: "Is Friday workable for my final answer?"
    translation: "Sexta funciona para minha resposta final?"
    note: "Pergunta o prazo — não o impõe."
  - term: "I've decided to accept another offer"
    meaning: 'decidi aceitar outra oferta — a recusa direta'
    example: "After a lot of thought, I've decided to accept another offer."
    translation: "Depois de muito pensar, decidi aceitar outra oferta."
    note: "Direto — sem drama nem detalhe demais."
  - term: "a closer match for my goals"
    meaning: 'mais alinhada aos meus objetivos — a razão curta da recusa'
    example: "Another offer is a closer match for my goals at this stage."
    translation: "Outra oferta está mais alinhada aos meus objetivos neste momento."
    note: "A razão em uma frase — sem detalhar a outra."
  - term: "this wasn't an easy decision"
    meaning: 'não foi uma decisão fácil — o respeito na recusa'
    example: "This wasn't an easy decision — I've genuinely enjoyed the process."
    translation: "Não foi uma decisão fácil — gostei de verdade do processo."
    note: "O reconhecimento antes do motivo."
  - term: "I hope we can stay in touch"
    meaning: 'espero que a gente mantenha contato — a porta aberta'
    example: "I hope we can stay in touch — the team was a highlight."
    translation: "Espero que a gente mantenha contato — o time foi um destaque."
    note: "O recrutador de hoje é seu contato em três anos."
  - term: "please keep me in mind for future roles"
    meaning: 'mantenha-me em mente para vagas futuras — a rede ativa'
    example: "Please keep me in mind if a closer-fit role opens up."
    translation: "Mantenha-me em mente se surgir uma vaga mais alinhada."
    note: "Recusar hoje pode virar oferta amanhã."
  - term: "sign the paperwork"
    meaning: 'assinar a papelada — o fecho do aceite'
    example: "I'll sign the paperwork as soon as it arrives."
    translation: "Assino a papelada assim que chegar."
    note: "O próximo passo concreto do aceite."
  - term: "onboarding / start date"
    meaning: 'integração / data de início — o depois do aceite'
    example: "Excited for the onboarding — confirming the March 3rd start date."
    translation: "Animado para o onboarding — confirmando o início em 3 de março."
    note: "O aceite já olha para o dia um."

grammar:
  title: "a gramática do fecho por escrito"
  explanation: |
    Os três e-mails têm molduras próprias:

    - **Aceitar**: "**I'm thrilled to accept**
      the offer for [title]. **Confirming the
      details**: $X base, Y% bonus, $Z RSUs,
      [N] days PTO, start date [data].
      **I'll sign the paperwork** as soon as
      it arrives."
    - **Tempo**: "**I'd like to review it**
      over the weekend. **I'll get back to
      you by** Monday EOD — **is that
      workable?**"
    - **Recusar**: "**After a lot of thought,
      I've decided to** accept another offer
      — a closer match for my goals. **This
      wasn't an easy decision**. **I hope we
      can stay in touch.**"

    A regra transversal: tudo que foi falado
    se confirma por escrito — e todo fecho
    tem data.
  examples:
    - { en: "I'm thrilled to accept the offer for Senior Platform Engineer.", pt: "Estou animado em aceitar a oferta para Senior Platform Engineer." }
    - { en: "Confirming the details: $160k base, 15% bonus, $90k RSUs, start March 3rd.", pt: "Confirmando: $160k base, 15% bônus, $90k RSUs, início 3 de março." }
    - { en: "I'd like to review it over the weekend — I'll get back by Monday EOD.", pt: "Gostaria de revisar no fim de semana — retorno até segunda EOD." }
    - { en: "Is Friday workable for my final answer?", pt: "Sexta funciona para minha resposta final?" }
    - { en: "After a lot of thought, I've decided to accept another offer.", pt: "Depois de muito pensar, decidi aceitar outra oferta." }
    - { en: "I hope we can stay in touch for the future.", pt: "Espero que a gente mantenha contato para o futuro." }

examples:
