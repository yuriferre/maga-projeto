  - en: "Confirming the details: $160k base, 15% bonus, $90k RSUs, 25 days PTO, start March 3rd."
    pt: "Confirmando: $160k base, 15% bônus, $90k RSUs, 25 dias PTO, início 3 de março."
    context: "Tudo por escrito."
  - en: "I'd like to review it with my family over the weekend — I'll get back by Monday EOD."
    pt: "Gostaria de revisar com a família no fim de semana — retorno segunda EOD."
    context: "Tempo com motivo e data."
  - en: "Is Friday workable for my final answer?"
    pt: "Sexta funciona para minha resposta final?"
    context: "Perguntar o prazo, não impor."
  - en: "After a lot of thought, I've decided to accept another offer that's a closer match."
    pt: "Depois de muito pensar, decidi aceitar outra oferta mais alinhada."
    context: "A recusa direta."
  - en: "This wasn't an easy decision — I've genuinely enjoyed the process and the team."
