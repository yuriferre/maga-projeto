    maxSeconds: 120
    targetPhrases:
      - i'm excited about the role
      - let me make sure i read this right
      - i was hoping for
      - given the on-call scope
      - the top of the band
      - could we look at the sign-on instead
      - close the gap
      - flexibility on the equity
      - six-month review in writing
      - i want to be transparent
      - final rounds elsewhere
      - meet me in the middle
      - annualized
      - i'll take it
      - get back to you tomorrow
      - confirming the details
