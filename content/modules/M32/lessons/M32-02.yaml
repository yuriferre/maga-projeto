  - en: "Want to grab a virtual coffee this week? 15 min, no agenda — just getting to know people."
    pt: "Quer um café virtual? 15 min, sem pauta — só conhecendo o pessoal."
    context: "O convite desarmado."
  - en: "How long have you been here — and what surprised you at first?"
    pt: "Há quanto tempo está aqui — e o que te surpreendeu no começo?"
    context: "A abertura do coffee chat."
  - en: "What would you tell someone starting out on this team?"
    pt: "O que você diria a quem está começando no time?"
