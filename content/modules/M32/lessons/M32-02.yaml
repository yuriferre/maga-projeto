variations:
  - idea: '"o convite"'
    items:
      - { register: "Forte", text: "Want to grab a virtual coffee this week? 15 min, no agenda.", adequate: true }
      - { register: "Forte", text: "Could I grab 20 minutes of your time this week?", adequate: true }
      - { register: "Fraco", text: "We need to schedule a formal introductory meeting.", adequate: false, note: "Formal demais — o coffee chat é leve por design." }
      - { register: "Fraco", text: "Sorry to bother you, could we maybe possibly chat sometime?", adequate: false, note: "Pedido triplamente diminuído — 'no agenda' desarma melhor." }
  - idea: '"o 1:1 de conhecimento"'
    items:
      - { register: "Forte", text: "What should I know that isn't written down?", adequate: true }
      - { register: "Forte", text: "Who else should I meet while I'm still new?", adequate: true }
      - { register: "Fraco", text: "Let me tell you everything about my experience.", adequate: false, note: "O 1:1 de conhecimento é para ouvir — você coleta o mapa." }
      - { register: "Fraco", text: "No questions — I'll read the docs.", adequate: false, note: "O contexto que vale não está em doc nenhum." }

brErrors:
  - { wrong: "I'm new in the team.", right: "I'm new to the team.", why: "new to", tag: br.new-in-company }
  - { wrong: "In my first day I met Priya.", right: "On my first day I met Priya.", why: "on my first day", tag: br.in-first-day }
  - { wrong: "I need a help scheduling the 1:1s.", right: "I need help scheduling the 1:1s.", why: "help sem artigo", tag: br.a-help }
  - { wrong: "Who is the responsible for the wiki?", right: "Who owns the wiki?", why: "who owns", tag: br.the-responsible }
  - { wrong: "I have a doubt about the process.", right: "I have a question about the process.", why: "a question", tag: br.doubt }
  - { wrong: "I pretend to meet everyone this week.", right: "I plan to meet everyone this week.", why: "plan to", tag: br.pretend }
  - { wrong: "Can you explain me the on-call?", right: "Can you explain the on-call to me?", why: "explain to me", tag: br.explain-me }
  - { wrong: "Let me make a question about the team.", right: "Let me ask a question about the team.", why: "ask a question", tag: br.make-question }
  - { wrong: "Let's take a coffee together.", right: "Let's grab a coffee together.", why: "grab a coffee", tag: br.take-a-coffee }
  - { wrong: "I assist the team meetings.", right: "I attend the team meetings.", why: "attend", tag: br.assist }

dialogue:
  title: "A semana dos 1:1s e do coffee chat"
  lines:
    - { speaker: Yuri, text: "Hey Priya — I'm Yuri, new on the platform team. Want to grab a virtual coffee this week? 15 min, no agenda — just getting to know people." }
    - { speaker: Priya, text: "Sure — Thursday works. Bring questions if you have them." }
    - { speaker: Yuri, text: "(Thursday) So — how long have you been here, and what surprised you at first?" }
    - { speaker: Priya, text: "Three years. What surprised me: how much lives in people's heads — the docs cover maybe half." }
    - { speaker: Yuri, text: "Perfect segue — what should I know that isn't written down?" }
    - { speaker: Priya, text: "The deploy pipeline has a manual step nobody documented — the smoke test on the canary. And the unwritten rule: never merge during the on-call handoff." }
    - { speaker: Yuri, text: "Noted — manual smoke test, no merge during handoff. What would you tell someone starting out on this team?" }
    - { speaker: Priya, text: "Meet the SREs early — we hold the map. Speaking of: who else should you meet? I'd say Ana — she owns deploys — and Sam, our historian." }
    - { speaker: Yuri, text: "Ana owns deploys, Sam's the historian — I'm keeping notes. Same question to you: who owns the wiki?" }
    - { speaker: Priya, text: "Nominally everyone, actually me. Add pages when you find gaps — that's how you pay the coffee chats forward." }
    - { speaker: Yuri, text: "Deal. This was the most useful 15 minutes of my week — I'll set up the same with Ana." }
  notes:
    - "o convite desarmado: '15 min, no agenda — just getting to know people'."
    - "as duas perguntas de ouro: 'isn't written down' + 'unwritten rule'."
    - "'who else should I meet' — cada chat gera o próximo; o mapa fica escrito."

listening:
  lines:
    - { speaker: Dana, text: "The second layer of onboarding is the network — nobody meets you by accident in a remote company. Two instruments: getting-to-know-you 1:1s with a light agenda, and the coffee chat — fifteen minutes, no work agenda." }
    - { speaker: Yuri, text: "The two golden questions: 'what should I know that isn't written down?' and 'what's the unwritten rule here?' Plus 'who else should I meet?' — every chat generates the next one." }
    - { speaker: Priya, text: "One person a day, not zero, not twenty. The deliverable is the map of who owns what — and it stays written, not in memory. The Brazilian mistake: skipping the coffee chat as wasted time — the network IS the work in week one." }
  questions:
    - { id: M32-02-l1, type: multiple_choice, prompt: "O convite de coffee chat funciona porque…", options: ["'15 min, no agenda' — desarmado e com motivo declarado", "é formal", "é longo", "tem pauta"], answer: 0, explanation: "'No agenda' desarma o convite.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-02-l2, type: fill_blank, prompt: "What should I know that isn't written ___?", accepted: ["down"], explanation: "A pergunta de ouro do 1:1.", tags: [vocab.onboarding] }
    - { id: M32-02-l3, type: error_correction, prompt: "Let's take a coffee together.", accepted: ["Let's grab a coffee together.", "Let's grab a coffee together", "Let's have a coffee together."], explanation: "'Grab/have a coffee'.", tags: [br.take-a-coffee] }
    - { id: M32-02-l4, type: multiple_choice, prompt: "O entregável invisível dos 1:1s é…", options: ["status do projeto", "o mapa de quem é dono de quê — escrito, não na memória", "amizade", "relatório"], answer: 1, explanation: "Ana owns deploys, Priya owns access.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-02-l5, type: multiple_choice, prompt: "O ritmo da rede na primeira semana é…", options: ["zero — foco no trabalho", "todos de uma vez", "uma pessoa por dia — cinco chats", "ninguém"], answer: 2, explanation: "Um por dia — não zero, não vinte.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-02-l6, type: multiple_choice, prompt: "'Who else should I meet?' faz a rede…", options: ["encolher", "parar", "ficar formal", "se expandir — cada chat gera o próximo"], answer: 3, explanation: "A pergunta que multiplica a rede.", tags: [comp.listening, vocab.onboarding] }

writing:
  prompt: |
    **Cenário:** semana um. O coach pediu por
    escrito os dois convites e a lista de
    perguntas que você leva aos 1:1s.

    **Tarefa:** escreva 90–120 palavras: (1) o
    convite de coffee chat para a Priya — leve,
    com "no agenda"; (2) o convite do 1:1 de
    conhecimento para o tech lead; (3) as três
    perguntas que você leva ("isn't written
    down", "unwritten rule", "who else").
  constraints:
    - { label: "O convite leve", pattern: "\\bgrab a (virtual )?coffee|15 ?min|no agenda|getting to know|grab \\d+ minutes\\b" }
    - { label: "As perguntas de ouro", pattern: "\\bwritten down|unwritten rule|who else|starting out\\b" }
    - { label: "O contexto de novato", pattern: "\\bnew (here|to|on)|first week|ramping up\\b" }
    - { label: "O mapa", pattern: "\\bowns|meet|notes|map|1:1|one.on.one\\b" }
  rubric:
    - "Convite desarmado com motivo declarado"
    - "As três perguntas de ouro presentes"
    - "Tom leve — sem diminuir o pedido"
    - "Sem calques ('new to', 'on my first day', 'grab a coffee')"
  model: >-
    The coffee-chat invite to Priya: "Hey Priya —
    I'm Yuri, new on the platform team. Want to
    grab a virtual coffee this week? 15 min, no
    agenda — just getting to know people." The
    1:1 invite to the tech lead: "Could I grab 20
    minutes this week for a getting-to-know-you
    1:1? No project agenda." The three questions
    I'm carrying into every meeting: what should
    I know that isn't written down? What's the
    unwritten rule here? And who else should I
    meet while I'm still in the 'new' window?
    One person a day — and the map of who owns
    what goes in my notes, not my memory.
  minWords: 90
  maxWords: 120
  tags: [comp.writing, vocab.onboarding]

