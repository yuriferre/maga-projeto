    maxSeconds: 90
    targetPhrases:
      - grab a virtual coffee
      - no agenda
      - getting to know people
      - getting-to-know-you
      - what should i know that isn't written down
      - the unwritten rule
      - who else should i meet
      - how long have you been here
      - what would you tell someone starting out
      - owns deploys
