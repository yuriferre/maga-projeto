id: M32-02
module: M32
order: 2
title: "Construindo relação: 1:1s de conhecimento, coffee chat"
objective: >-
  Ao final, você sabe construir a rede interna
  das primeiras semanas — os 1:1s de
  conhecimento com agenda leve e o coffee chat
  que não é sobre trabalho.
durationMin: 30
competencies: [SPK, WRI, CNF]
tags: [vocab.onboarding, comp.speaking, comp.confidence]
prerequisites: [M32-01]

context:
  scenario: |
    A segunda camada do onboarding: a rede. Em
    empresa remota e internacional, ninguém te
    conhece por acaso — você constrói a rede
    com dois instrumentos:

    **Os 1:1s de conhecimento** — 20–30 min
    com cada pessoa-chave (o manager, o tech
    lead, o SRE do serviço vizinho, a PM).
    Agenda leve, duas perguntas:

    - "*what should I know that isn't written
      down?*" — o contexto que não está em
      doc nenhum.
    - "*what's the unwritten rule here?*" —
      a regra não escrita do time.

    **O coffee chat** — 15 min, remoto, sem
    agenda de trabalho. O convite:

    > "*hey — I'm Yuri, new on the platform
    > team. Want to grab a virtual coffee
    > sometime this week? 15 min, no agenda —
    > just getting to know people.*"

    O que o coffee chat cobre: de onde a
    pessoa é, há quanto tempo está, o que ela
    achou mais estranho no começo — e o que
    ela recomendaria a quem está chegando.

    As regras da rede:

    - **Uma pessoa por dia** — cinco coffee
      chats na primeira semana, não zero nem
      vinte.
    - **Pergunta + escuta** — a meta é a
      pessoa falar; você coleta mapa e contexto.
    - **Anote os nomes** — "Ana owns deploys,
      Priya owns access" vira o seu mapa
      interno.

    O erro do brasileiro: pular o coffee chat
    por parecer "perda de tempo" — a rede é o
    trabalho na primeira semana.
  roles: [Yuri (new Senior Platform Engineer), Priya (SRE lead)]

vocabulary:
  - term: "1:1 (one-on-one)"
    meaning: 'reunião individual — o instrumento de conhecimento'
    example: "I set up 1:1s with the tech lead and the PM this week."
    translation: "Marquei 1:1s com o tech lead e a PM esta semana."
    note: "20–30 min, agenda leve — conhecer, não reportar."
  - term: "getting-to-know-you 1:1"
    meaning: '1:1 de conhecimento — sem pauta de projeto'
    example: "This is a getting-to-know-you 1:1 — no project agenda."
    translation: "É um 1:1 de conhecimento — sem pauta de projeto."
    note: "Nomeie o formato para ninguém esperar status."
  - term: "what should I know that isn't written down?"
    meaning: 'o que eu deveria saber que não está escrito? — a pergunta de ouro'
    example: "What should I know that isn't written down anywhere?"
    translation: "O que eu deveria saber que não está escrito em lugar nenhum?"
    note: "O contexto que só existe na cabeça das pessoas."
  - term: "the unwritten rule"
    meaning: 'a regra não escrita — a norma do time que ninguém documenta'
    example: "What's the unwritten rule here — e.g., never deploy on Fridays?"
    translation: "Qual é a regra não escrita aqui — tipo, nunca deployar sexta?"
    note: "Todo time tem três; pergunte cedo."
  - term: "virtual coffee / coffee chat"
    meaning: 'café virtual — 15 min sem agenda'
    example: "Want to grab a virtual coffee this week? 15 min, no agenda."
    translation: "Quer um café virtual esta semana? 15 min, sem pauta."
    note: "'No agenda' desarma o convite."
  - term: "no agenda — just getting to know people"
    meaning: 'sem pauta — só conhecendo as pessoas — o convite desarmado'
    example: "No agenda — just getting to know people on my first week."
    translation: "Sem pauta — só conhecendo o pessoal na primeira semana."
    note: "O motivo declarado torna o convite leve."
  - term: "how long have you been here?"
    meaning: 'há quanto tempo você está aqui? — a abertura do coffee chat'
    example: "How long have you been here — and what surprised you at first?"
    translation: "Há quanto tempo você está aqui — e o que te surpreendeu no começo?"
    note: "A pergunta que abre a história da pessoa."
  - term: "what would you tell someone starting out?"
    meaning: 'o que você diria a quem está começando? — o conselho coletado'
    example: "What would you tell someone starting out on this team?"
    translation: "O que você diria para quem está começando neste time?"
    note: "Cada pessoa dá uma peça do mapa."
  - term: "who else should I meet?"
    meaning: 'quem mais eu deveria conhecer? — a rede que se expande'
    example: "Who else should I meet while I'm still in the 'new' window?"
    translation: "Quem mais eu deveria conhecer enquanto ainda estou na janela de novato?"
    note: "Cada coffee chat gera o próximo."
  - term: "map of who owns what"
    meaning: 'mapa de quem é dono de quê — o resultado da rede'
    example: "By week two I had a map of who owns what."
    translation: "Na semana dois eu já tinha o mapa de quem é dono de quê."
    note: "O entregável invisível do onboarding."
  - term: "keep notes on people"
    meaning: 'anotar sobre as pessoas — nome, papel, o que tocam'
    example: "I keep notes: Ana owns deploys, Priya owns access, Sam is the historian."
    translation: "Eu anoto: Ana cuida de deploys, Priya de acesso, Sam é o historiador."
    note: "O mapa não fica na memória — fica escrito."
  - term: "same page / get on the same page"
    meaning: 'na mesma página — o alinhamento que o 1:1 cria'
    example: "The 1:1 got us on the same page about what 'done' means here."
    translation: "O 1:1 nos alinhou sobre o que 'pronto' significa aqui."
    note: "O objetivo real dos primeiros 1:1s."

grammar:
  title: "a gramática do convite e do 1:1"
  explanation: |
    O convite de coffee chat tem moldura fixa:

    - "**want to grab a virtual coffee**
      sometime this week? 15 min, **no
      agenda** — just getting to know people."
    - Ou o pedido: "**could I grab 20 minutes**
      of your time this week?"

    As perguntas do 1:1 de conhecimento:

    - "**what should I know that isn't
      written down?**"
    - "**what's the unwritten rule** here?"
    - "**who else should I meet**?"
    - "**what would you tell someone**
      starting out?"

    E a anotação: "[name] **owns** [X]" — o
    verbo da posse interna.
  examples:
    - { en: "Want to grab a virtual coffee this week? 15 min, no agenda.", pt: "Quer um café virtual esta semana? 15 min, sem pauta." }
    - { en: "Could I grab 20 minutes of your time this week?", pt: "Poderia tomar 20 minutos do seu tempo esta semana?" }
    - { en: "What should I know that isn't written down?", pt: "O que eu deveria saber que não está escrito?" }
    - { en: "What's the unwritten rule here?", pt: "Qual é a regra não escrita aqui?" }
    - { en: "Who else should I meet while I'm still new?", pt: "Quem mais eu deveria conhecer enquanto sou novo?" }
    - { en: "Priya owns access; Ana owns deploys.", pt: "Priya cuida de acesso; Ana cuida de deploys." }

examples:
