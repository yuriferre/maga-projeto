id: M32-03
module: M32
order: 3
title: "Pedindo contexto e documentação: is there a doc for…; who owns…"
objective: >-
  Ao final, você sabe pedir contexto e
  documentação como sênior — achar o que
  existe, perguntar pelo dono, e contribuir
  para o doc que faltava.
durationMin: 30
competencies: [SPK, REA, WRI]
tags: [vocab.onboarding, comp.speaking, comp.reading]
prerequisites: [M32-02]

context:
  scenario: |
    O terceiro movimento do onboarding: pedir
    contexto sem parecer perdido. A diferença
    entre o novato que pergunta bem e o que
    pergunta mal é **a pesquisa antes da
    pergunta**.

    A ordem sênior:

    1. **Procure primeiro** — wiki, repo,
       canal. A pergunta que já tem resposta
       escrita queima crédito.
    2. **Pergunte com o que achou** — "*I
       found the 2022 runbook — is it still
       current?*" mostra trabalho, não
       preguiça.
    3. **Pergunte pelo dono, não pela
       resposta** — "*who owns the deploy
       docs?*" te dá a fonte permanente.

    As molduras:

    - **Achar o doc**: "*is there a doc for
      the release process?*"
    - **O dono**: "*who owns the runbooks —
      you or the SRE team?*"
    - **A checagem de validade**: "*is this
      still current?*" / "*when was this
      last updated?*"
    - **Contexto de decisão**: "*what's the
      story behind this design?*" — o porquê
      que nenhum doc escreve.
    - **A contribuição**: "*mind if I add
      that to the onboarding doc?*" —
      a lacuna que você achou vira página.

    E a regra do pedido por escrito: a
    pergunta no canal inclui o que você já
    tentou — "*I checked the wiki and the
    repo; the deploy doc seems stale — is
    there a newer one?*"

    O erro do brasileiro: perguntar sem
    pesquisar ("where is X?") — ou o oposto,
    ficar três horas procurando o que um
    colega responde em dois minutos.
  roles: [Yuri (new Senior Platform Engineer), Sam (senior engineer, the historian)]

vocabulary:
  - term: "is there a doc for…?"
    meaning: 'existe um doc para…? — achar a documentação'
    example: "Is there a doc for the release process, or is it tribal knowledge?"
    translation: "Existe um doc para o processo de release, ou é conhecimento tribal?"
    note: "Perguntar pelo doc, não pelo procedimento inteiro."
  - term: "tribal knowledge"
    meaning: 'conhecimento tribal — o que só existe na cabeça das pessoas'
    example: "Half the deploy process is tribal knowledge — nobody wrote it down."
    translation: "Metade do processo de deploy é conhecimento tribal — ninguém escreveu."
    note: "O nome para o que falta em doc."
  - term: "who owns…?"
    meaning: 'quem é dono de…? — achar a pessoa-fonte'
    example: "Who owns the runbooks — you or the SRE team?"
    translation: "Quem é dono dos runbooks — você ou o time de SRE?"
    note: "O dono é a fonte permanente, melhor que a resposta única."
  - term: "is this still current?"
    meaning: 'isso ainda está atual? — a checagem de validade do doc'
    example: "I found the 2022 runbook — is it still current?"
    translation: "Achei o runbook de 2022 — ainda está atual?"
    note: "Doc velho é pior que nenhum — cheque a validade."
  - term: "when was this last updated?"
    meaning: 'quando isso foi atualizado pela última vez?'
    example: "When was this page last updated — the screenshots look old."
    translation: "Quando essa página foi atualizada — os prints parecem velhos."
    note: "A data que decide se o doc se pode confiar."
  - term: "what's the story behind…?"
    meaning: 'qual é a história por trás de…? — o contexto da decisão'
    example: "What's the story behind this design — why a queue and not a stream?"
    translation: "Qual a história por trás desse design — por que fila e não stream?"
    note: "O porquê que nenhum doc escreve — pergunte ao historiador."
  - term: "I checked X and Y already"
    meaning: 'já chequei X e Y — a pesquisa que vem antes da pergunta'
    example: "I checked the wiki and the repo — the deploy doc seems stale."
    translation: "Já chequei a wiki e o repo — o doc de deploy parece desatualizado."
    note: "A pergunta com pesquisa vale dez vezes mais."
  - term: "seems stale / outdated"
    meaning: 'parece desatualizado — o doc que envelheceu'
    example: "This runbook seems stale — it references a tool we retired."
    translation: "Esse runbook parece desatualizado — cita uma ferramenta aposentada."
    note: "'Stale' = velho/vencido — o adjetivo do doc."
  - term: "mind if I add that to the doc?"
    meaning: 'se importa se eu adicionar isso ao doc? — a contribuição'
    example: "Mind if I add that step to the onboarding doc? It's missing."
    translation: "Se importa se eu adicionar esse passo ao doc de onboarding? Está faltando."
    note: "A lacuna que você acha vira contribuição sua."
  - term: "the gap in the docs"
    meaning: 'a lacuna nos docs — o que falta escrever'
    example: "The gap in the docs: nothing explains the canary step."
    translation: "A lacuna nos docs: nada explica o passo do canary."
    note: "Cada gap que você acha é uma contribuição fácil."
  - term: "point me to…"
    meaning: 'me aponta para… — o pedido de direção'
    example: "Can you point me to the architecture overview?"
    translation: "Você pode me apontar para a visão de arquitetura?"
    note: "Pedir direção, não a explicação inteira."
  - term: "I'll write it up"
    meaning: 'eu escrevo isso — a lacuna que você preenche'
    example: "Nobody documented this — I'll write it up and share it."
    translation: "Ninguém documentou isso — eu escrevo e compartilho."
    note: "O novato que documenta vira referência em semanas."

grammar:
  title: "a gramática do pedido com pesquisa"
  explanation: |
    O pedido sênior de contexto tem três partes:

    - **A pesquisa declarada**: "**I checked**
      the wiki **and** the repo — **the doc
      seems stale**."
    - **A pergunta de direção**: "**is there a
      doc for** the release process?" /
      "**can you point me to** the overview?"
    - **O dono**: "**who owns** the runbooks?"

    O contexto de decisão: "**what's the
    story behind** this design?" — o porquê
    que nenhum doc escreve.

    E a contribuição: "**mind if I add**
    that to the doc?" / "**I'll write it
    up**."
  examples:
    - { en: "Is there a doc for the release process, or is it tribal knowledge?", pt: "Existe doc para o release, ou é conhecimento tribal?" }
    - { en: "Who owns the runbooks — you or the SRE team?", pt: "Quem é dono dos runbooks — você ou o SRE?" }
    - { en: "I checked the wiki and the repo — this runbook seems stale.", pt: "Chequei a wiki e o repo — esse runbook parece velho." }
    - { en: "When was this page last updated?", pt: "Quando essa página foi atualizada?" }
    - { en: "What's the story behind this design?", pt: "Qual a história por trás desse design?" }
    - { en: "Mind if I add that step to the onboarding doc?", pt: "Se importa se eu adicionar esse passo ao doc?" }

examples:
  - en: "Is there a doc for the release process, or is it tribal knowledge?"
    pt: "Existe um doc para o processo de release, ou é conhecimento tribal?"
    context: "Achar o doc."
  - en: "Who owns the runbooks — you or the SRE team?"
    pt: "Quem é dono dos runbooks — você ou o time de SRE?"
    context: "O dono, não a resposta."
  - en: "I checked the wiki and the repo — the deploy doc seems stale."
    pt: "Chequei a wiki e o repo — o doc de deploy parece desatualizado."
    context: "A pesquisa antes da pergunta."
  - en: "I found the 2022 runbook — is it still current?"
    pt: "Achei o runbook de 2022 — ainda está atual?"
    context: "A checagem de validade."
  - en: "What's the story behind this design — why a queue and not a stream?"
    pt: "Qual a história do design — por que fila e não stream?"
    context: "O contexto da decisão."
  - en: "Mind if I add that step to the onboarding doc? It's missing."
    pt: "Se importa se eu adicionar ao doc de onboarding? Está faltando."
    context: "A lacuna que vira contribuição."
  - en: "Can you point me to the architecture overview?"
    pt: "Pode me apontar para a visão de arquitetura?"
    context: "Direção, não a explicação inteira."
  - en: "Nobody documented this — I'll write it up and share it."
    pt: "Ninguém documentou — eu escrevo e compartilho."
    context: "O novato que documenta."

variations:
  - idea: '"o pedido de contexto"'
    items:
      - { register: "Forte", text: "I checked the wiki and the repo — the deploy doc seems stale. Is there a newer one?", adequate: true }
      - { register: "Forte", text: "Who owns the runbooks — you or the SRE team?", adequate: true }
      - { register: "Fraco", text: "How do I deploy? (didn't check anything)", adequate: false, note: "A pergunta sem pesquisa queima crédito." }
      - { register: "Fraco", text: "I'll search for three more hours before asking.", adequate: false, note: "O oposto também erra — pesquise 15 min, depois pergunte." }
  - idea: '"a lacuna encontrada"'
    items:
      - { register: "Forte", text: "Mind if I add that step to the doc? It's missing.", adequate: true }
      - { register: "Forte", text: "Nobody documented this — I'll write it up.", adequate: true }
      - { register: "Fraco", text: "These docs are terrible — who wrote this?", adequate: false, note: "Criticar o doc sem oferecer a correção só atrita." }
      - { register: "Fraco", text: "Not my job — I'm new.", adequate: false, note: "Documentar a lacuna é o trabalho mais visível do novato." }

