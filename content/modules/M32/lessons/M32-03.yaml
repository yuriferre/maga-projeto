  - { id: M32-03-q6, type: error_correction, prompt: "Can you explain me the release process?", accepted: ["Can you explain the release process to me?", "Can you explain the release process to me"], explanation: "'Explain X to me'.", tags: [br.explain-me] }
  - { id: M32-03-q7, type: reorder, prompt: "Coloque na ordem certa.", tokens: ["if", "mind", "i", "add", "that", "to", "the", "doc"], answer: "mind if i add that to the doc", explanation: "A lacuna vira contribuição.", tags: [vocab.onboarding] }
