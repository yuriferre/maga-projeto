  - { wrong: "I assist the doc review.", right: "I attend the doc review.", why: "attend", tag: br.assist }

dialogue:
  title: "Pedindo o contexto do deploy"
  lines:
    - { speaker: Yuri, text: "Hey Sam — quick one. I checked the wiki and the repo, and the deploy runbook seems stale — it references a tool we retired. Is there a newer one?" }
    - { speaker: Sam, text: "Good catch — the runbook moved to the team drive last quarter. I'll send you the link." }
    - { speaker: Yuri, text: "Thanks. And who owns the runbooks now — you or the SRE team?" }
    - { speaker: Sam, text: "Priya's team owns them officially; I keep the historical ones." }
    - { speaker: Yuri, text: "Speaking of history — what's the story behind the manual canary step? Seems like it should be automated." }
    - { speaker: Sam, text: "There was an incident in 2023 — auto-canary pushed a bad deploy. The manual step is the scar tissue." }
    - { speaker: Yuri, text: "That context isn't in any doc, is it?" }
    - { speaker: Sam, text: "Nope — tribal knowledge. You're getting it because you asked the right way." }
    - { speaker: Yuri, text: "Then let me pay it forward — mind if I add the story to the runbook? A 'why this step exists' section." }
    - { speaker: Sam, text: "Please do. The gap in the docs is real — half of what I know lives in my head." }
    - { speaker: Yuri, text: "I'll write it up today and tag you for review." }
  notes:
    - "a pesquisa declarada antes da pergunta: 'I checked the wiki and the repo'."
    - "'who owns' acha a fonte permanente; 'the story behind' tira o porquê do historiador."
    - "a lacuna vira contribuição: 'mind if I add that to the doc?' + 'I'll write it up'."

listening:
  lines:
    - { speaker: Dana, text: "Asking for context like a senior means research before the question. The order: search first — wiki, repo, channel — then ask with what you found: 'I found the 2022 runbook — is it still current?'" }
    - { speaker: Yuri, text: "Ask for the doc, not the procedure — 'is there a doc for the release process?' Ask for the owner, not the answer — 'who owns the runbooks?' And ask the historian for the story — 'what's the story behind this design?'" }
    - { speaker: Sam, text: "When you find a gap, it becomes your contribution — 'mind if I add that to the doc?' The mistake is asking without searching, or searching for three hours when a colleague answers in two minutes. Fifteen minutes of search, then ask." }
  questions:
    - { id: M32-03-l1, type: multiple_choice, prompt: "A ordem sênior do pedido de contexto é…", options: ["perguntar → pesquisar", "pesquisar → perguntar com o que achou → perguntar pelo dono", "nunca perguntar", "perguntar a todos"], answer: 1, explanation: "Pesquisa primeiro — a pergunta com trabalho vale mais.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-03-l2, type: fill_blank, prompt: "Is there a ___ for the release process, or is it tribal knowledge?", accepted: ["doc"], explanation: "Perguntar pelo doc, não pelo procedimento.", tags: [vocab.onboarding] }
    - { id: M32-03-l3, type: error_correction, prompt: "Who is the responsible for the runbooks?", accepted: ["Who owns the runbooks?", "Who owns the runbooks", "Who is the owner of the runbooks?"], explanation: "'Who owns'.", tags: [br.the-responsible] }
    - { id: M32-03-l4, type: multiple_choice, prompt: "'Tribal knowledge' é…", options: ["o que está no wiki", "o que só existe na cabeça das pessoas — nenhum doc", "o treinamento formal", "o erro"], answer: 1, explanation: "O conhecimento não documentado.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-03-l5, type: multiple_choice, prompt: "A lacuna que você acha nos docs vira…", options: ["uma reclamação", "problema de outro", "uma contribuição — 'mind if I add that to the doc?'", "silêncio"], answer: 2, explanation: "Documentar a lacuna é o trabalho visível do novato.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-03-l6, type: multiple_choice, prompt: "O tempo de pesquisa antes de perguntar é…", options: ["zero — pergunta direto", "umas três horas", "~15 minutos — depois pergunte", "uma semana"], answer: 2, explanation: "15 min de busca, depois a pergunta.", tags: [comp.listening, vocab.onboarding] }

writing:
  prompt: |
    **Cenário:** você achou a lacuna — o passo
    manual do canary não está em doc nenhum, e a
    história por trás (o incidente de 2023) só
    existe na cabeça do Sam. O coach pediu por
    escrito a mensagem para o canal + a página
    que você vai escrever.

    **Tarefa:** escreva 100–130 palavras: (1) a
    mensagem no canal — pesquisa declarada +
    pergunta pelo doc/dono; (2) o esboço da
    página nova: o passo, o porquê ("the story
    behind"), e quem revisa.
  constraints:
    - { label: "A pesquisa declarada", pattern: "\\bi checked|i found|seems stale|already looked|searched\\b" }
    - { label: "Doc e dono", pattern: "\\bdoc|doc for|who owns|point me|current|updated\\b" }
    - { label: "A história", pattern: "\\bstory behind|why this step|incident|context|tribal knowledge\\b" }
    - { label: "A contribuição", pattern: "\\badd.*doc|write it up|mind if i|contribute|tag.*review\\b" }
  rubric:
    - "Pesquisa declarada antes da pergunta"
    - "Pergunta pelo dono, não só pela resposta"
    - "A lacuna vira página com 'the story behind'"
    - "Sem calques ('who owns', 'help' sem artigo, 'on my first day')"
  model: >-
    The channel message: "Hey team — new here,
    week one. I checked the wiki and the repo;
    the deploy runbook seems stale — references
    a retired tool. Is there a newer doc, and
    who owns the runbooks now?" The page I'll
    write up: "The manual canary step — why it
    exists." The step itself, then the story
    behind it: the 2023 incident where an
    auto-canary pushed a bad deploy — this is
    scar tissue, not bureaucracy. Then the
    checklist of what to verify by hand, and
    Sam tagged for review since he's the
    historian. A gap found in week one becomes
    the page the next newcomer reads.
  minWords: 100
  maxWords: 130
  tags: [comp.writing, vocab.onboarding]

speaking:
  modeA:
    prompt: "Grave 90 segundos: o pedido de contexto sênior — a pesquisa declarada ('I checked the wiki and the repo — seems stale'), a pergunta pelo doc e pelo dono ('is there a doc for…?', 'who owns…?'), a pergunta ao historiador ('what's the story behind…?'), e a contribuição ('mind if I add that to the doc? I'll write it up')."
    maxSeconds: 90
    targetPhrases:
      - is there a doc for
      - tribal knowledge
      - who owns
      - is this still current
      - when was this last updated
      - what's the story behind
      - i checked the wiki and the repo
      - seems stale
      - mind if i add that to the doc
      - the gap in the docs
      - point me to
      - i'll write it up
      - who should i talk to
      - the runbook
      - tag you for review
      - newer one
    checklist:
      - "a pesquisa antes da pergunta"
      - "pergunta pelo dono, não só pela resposta"
      - "'the story behind' para o contexto da decisão"
      - "a lacuna vira contribuição oferecida"
      - "sem calques ('who owns', 'help' sem artigo, 'a doc for')"

