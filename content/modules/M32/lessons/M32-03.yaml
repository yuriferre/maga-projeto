  - { wrong: "In my first day I found the gap.", right: "On my first day I found the gap.", why: "on my first day", tag: br.in-first-day }
  - { wrong: "I need a help finding the docs.", right: "I need help finding the docs.", why: "help sem artigo", tag: br.a-help }
  - { wrong: "Who is the responsible for the runbooks?", right: "Who owns the runbooks?", why: "who owns", tag: br.the-responsible }
  - { wrong: "I have a doubt about the runbook.", right: "I have a question about the runbook.", why: "a question", tag: br.doubt }
  - { wrong: "I pretend to write it up today.", right: "I plan to write it up today.", why: "plan to", tag: br.pretend }
