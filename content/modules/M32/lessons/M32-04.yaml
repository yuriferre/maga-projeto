variations:
  - idea: '"a semana"'
    items:
      - { register: "Forte", text: "Week one checklist: intro Monday, network midweek, contribution Friday.", adequate: true }
      - { register: "Forte", text: "I asked two questions, read the room, saved the rest for the 1:1.", adequate: true }
      - { register: "Fraco", text: "I'll stay quiet all week and prove myself with code later.", adequate: false, note: "A janela de novato fecha — e o código sozinho não constrói a rede." }
      - { register: "Fraco", text: "First week goal: refactor the whole deploy pipeline.", adequate: false, note: "Semana um pede quick win — não o projeto que muda tudo." }
  - idea: '"a contribuição de sexta"'
    items:
      - { register: "Forte", text: "The doc fix was my quick win — small, visible, done.", adequate: true }
      - { register: "Forte", text: "Nobody documented it — I'll write it up to pay it forward.", adequate: true }
      - { register: "Fraco", text: "I rewrote the entire wiki in week one.", adequate: false, note: "Quick win é pequeno — reescrever tudo sinaliza julgamento ruim." }
      - { register: "Fraco", text: "Nothing shipped this week — too busy meeting people.", adequate: false, note: "A rede É o trabalho — mas feche a semana com algo escrito." }

brErrors:
  - { wrong: "I'm new in this company.", right: "I'm new to this company.", why: "new to", tag: br.new-in-company }
  - { wrong: "In my first day I broke nothing.", right: "On my first day I broke nothing.", why: "on my first day", tag: br.in-first-day }
  - { wrong: "I need a help with the recap.", right: "I need help with the recap.", why: "help sem artigo", tag: br.a-help }
  - { wrong: "Who is the responsible for onboarding?", right: "Who owns onboarding?", why: "who owns", tag: br.the-responsible }
  - { wrong: "I have a doubt about the checklist.", right: "I have a question about the checklist.", why: "a question", tag: br.doubt }
  - { wrong: "I pretend to ship a quick win Friday.", right: "I plan to ship a quick win Friday.", why: "plan to", tag: br.pretend }
  - { wrong: "Can you explain me the canary step?", right: "Can you explain the canary step to me?", why: "explain to me", tag: br.explain-me }
  - { wrong: "Let me make a question first.", right: "Let me ask a question first.", why: "ask a question", tag: br.make-question }
  - { wrong: "I'll take a coffee with Priya Thursday.", right: "I'll grab a coffee with Priya Thursday.", why: "grab a coffee", tag: br.take-a-coffee }
  - { wrong: "I assist the Friday deploy.", right: "I attend the Friday deploy.", why: "attend", tag: br.assist }

dialogue:
  title: "A primeira semana inteira — três dias-chave"
  lines:
    - { speaker: Dana, text: "(Monday standup) New face on the call — Yuri, want to introduce yourself?" }
    - { speaker: Yuri, text: "Sure — I'm Yuri, joining as Senior Platform Engineer. I spent the last five years on Kubernetes and CI/CD at a fintech in Brazil. I'm new here, still ramping up — bear with me on the acronyms. Quick question while I have you: how do people usually test pipeline changes locally?" }
    - { speaker: Dana, text: "make test-pipeline — and perfect first question. Post your intro in the channel when you can." }
    - { speaker: Yuri, text: "(Wednesday, coffee chat) Priya — thanks for the 15 minutes. Three questions: what should I know that isn't written down? What's the unwritten rule? And who else should I meet?" }
    - { speaker: Priya, text: "Efficient. Unwritten rule: no merges during on-call handoff. Meet Ana — she owns deploys — and Sam, our historian." }
    - { speaker: Yuri, text: "Noted — I'm keeping a map of who owns what. Before I run a deploy myself, I'd like to shadow one with Ana." }
    - { speaker: Priya, text: "Smart — she'll like that you asked to shadow first." }
    - { speaker: Yuri, text: "(Friday) Sam — I checked the wiki and the repo for the canary step; seems stale. Who owns that doc?" }
    - { speaker: Sam, text: "Officially Priya's team, but nobody's touched it since 2023 — the incident year." }
    - { speaker: Yuri, text: "Then the gap is mine: mind if I add a 'why this step exists' section? I'll write it up today — my quick win for week one." }
    - { speaker: Sam, text: "That's a strong first week, Yuri — doc contribution on Friday." }
    - { speaker: Yuri, text: "(Friday EOD, to Dana) Quick recap: met twelve people, shipped one doc, learned the deploy story. Map of who owns what is written. Same time Monday?" }
    - { speaker: Dana, text: "Best first week I've seen — see you Monday." }
  notes:
    - "segunda: apresentação + intro + primeira pergunta, tudo no mesmo fôlego."
    - "quarta: as três perguntas de ouro + o mapa + 'shadow a deploy'."
    - "sexta: pesquisa → dono → lacuna vira contribuição → recap ao manager."

listening:
  lines:
    - { speaker: Dana, text: "The full first week in three scenarios. Monday: the thirty-second intro live plus the channel message plus one fearless question. Wednesday: the coffee chats and the three golden questions — the map of who owns what gets written down." }
    - { speaker: Yuri, text: "And Friday: the contribution. I checked first — 'seems stale, who owns it?' — then 'mind if I add that to the doc? I'll write it up today.' A doc fix is the perfect quick win." }
    - { speaker: Priya, text: "The posture underneath: 'new here, ramping up' — confident, never diminished. Two questions in the meeting, read the room, the rest goes to the 1:1. And the week closes with a recap to the manager: what I learned, who I met, what I shipped." }
  questions:
    - { id: M32-04-l1, type: multiple_choice, prompt: "A semana um se distribui como…", options: ["só código", "só reuniões", "intro segunda → rede no meio → contribuição sexta", "só leitura de docs"], answer: 2, explanation: "Os três movimentos, um por dia-chave.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-04-l2, type: fill_blank, prompt: "Before I run a deploy myself, I want to ___ one with Ana.", accepted: ["shadow"], explanation: "Assistir antes de fazer.", tags: [vocab.onboarding] }
    - { id: M32-04-l3, type: error_correction, prompt: "In my first day I broke nothing.", accepted: ["On my first day I broke nothing.", "On my first day I broke nothing"], explanation: "'On my first day'.", tags: [br.in-first-day] }
    - { id: M32-04-l4, type: multiple_choice, prompt: "O 'quick win' da primeira semana é…", options: ["o projeto grande", "algo pequeno, visível e feito — o doc consertado", "o refactor", "nada"], answer: 1, explanation: "Pequeno, visível, fechado.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-04-l5, type: multiple_choice, prompt: "'Read the room' na reunião significa…", options: ["falar mais", "sair da reunião", "anotar tudo", "duas perguntas — o resto vai para o 1:1"], answer: 3, explanation: "Duas perguntas na reunião, o resto no 1:1.", tags: [comp.listening, vocab.onboarding] }
    - { id: M32-04-l6, type: multiple_choice, prompt: "A semana fecha com…", options: ["silêncio", "férias", "o recap ao manager — o que aprendi, quem conheci, o que entreguei", "a reclamação"], answer: 2, explanation: "Um parágrafo de visibilidade leve.", tags: [comp.listening, vocab.onboarding] }

writing:
  prompt: |
    **Cenário:** sexta-feira, fim da primeira
    semana. A Dana pediu por escrito o recap da
    semana — e o coach quer ver a autoavaliação
    pela rubrica.

    **Tarefa:** escreva 100–130 palavras em duas
    partes: (1) o recap para a Dana — o que
    aprendeu, quem conheceu, o que entregou, o
    plano da semana dois; (2) três linhas de
    autoavaliação pela rubrica dos cenários —
    onde a postura de novato segurou e o que
    ajustar.
  constraints:
    - { label: "O recap", pattern: "\\blearned|met|shipped|wrote|added|recap|week one\\b" }
    - { label: "A rede construída", pattern: "\\bcoffee|1:1|one.on.one|owns|map|intro\\b" }
    - { label: "A contribuição", pattern: "\\bdoc|wrote it up|quick win|contribution|added\\b" }
    - { label: "A autoavaliação", pattern: "\\bnext week|went well|improve|hindsight|posture|adjust\\b" }
  rubric:
    - "Recap com aprendido + rede + entrega + plano"
    - "Autoavaliação nomeia a postura e um ajuste"
    - "A contribuição concreta (o doc)"
    - "Sem calques ('new to', 'on my first day', 'who owns')"
  model: >-
    The Friday recap to Dana: "Week one recap —
    what I learned, who I met, what I shipped.
    Met twelve people: the platform team plus
    Ana, Sam and Priya's SREs — the map of who
    owns what is written. Shipped the 'why this
    step exists' section in the deploy runbook —
    my quick win. Week two: shadow a deploy with
    Ana, then run one myself." The self-review:
    the new-person posture held — questions
    asked, none diminished. What to adjust — I
    asked three questions in one standup; two
    and read the room next time. The window is
    open; I'm using it.
  minWords: 100
  maxWords: 130
  tags: [comp.writing, vocab.onboarding]

