id: M32-04
module: M32
order: 4
title: "Primeira semana (3 cenários curtos)"
objective: >-
  Ao final, você atravessou a primeira semana
  inteira em três cenários curtos — o dia um
  (intro + canal), o meio da semana (a rede e
  o contexto) e a sexta (a primeira
  contribuição).
durationMin: 40
competencies: [SPK, WRI, REA, CNF]
tags: [vocab.onboarding, comp.speaking, comp.writing]
prerequisites: [M32-03]
simulation: true

context:
  scenario: |
    A simulação da primeira semana — três
    cenários curtos, um por dia-chave:

    **Cenário 1 — Segunda (o dia um):**
    a standup de apresentação + a mensagem de
    intro no canal + a primeira pergunta sem
    medo. Você abre com os 30 s — "I'm Yuri,
    joining as Senior Platform Engineer…" —
    posta a intro com "happy to grab a coffee
    chat", e faz a pergunta de novato: "quick
    question — how do people usually test
    this locally?"

    **Cenário 2 — Quarta (a rede):**
    o coffee chat com a Priya e o 1:1 com o
    tech lead. "What should I know that isn't
    written down?", "the unwritten rule",
    "who else should I meet?" — e o mapa de
    quem é dono de quê escrito no fim.

    **Cenário 3 — Sexta (a contribuição):**
    você achou a lacuna no runbook. O pedido
    de contexto com pesquisa — "I checked the
    wiki — seems stale, who owns it?" — e a
    oferta: "mind if I add that to the doc?
    I'll write it up today."

    **Rubrica da simulação** (autoavaliação):

    - Dia 1: apresentação de 30 s + intro
      postada + uma pergunta feita?
    - Dia 3: coffee chat pedido com "no
      agenda" + as três perguntas de ouro?
    - Dia 5: pesquisa declarada + dono
      achado + lacuna virou contribuição?
    - Em todas: tom confiante de novato —
      "new here, ramping up", nunca
      diminuído?
  roles: [Yuri (new Senior Platform Engineer), Dana (EM), Priya (SRE lead), Sam (historian)]

vocabulary:
  - term: "week one checklist"
    meaning: 'a checklist da semana um — os três movimentos por dia'
    example: "My week one checklist: intro Monday, coffee chats midweek, a doc contribution Friday."
    translation: "Minha checklist da semana um: intro segunda, coffee chats no meio, contribuição no doc sexta."
    note: "Os três movimentos distribuídos pela semana."
  - term: "day one intro"
    meaning: 'a intro do dia um — apresentação + post no canal'
    example: "The day one intro: thirty seconds live, then the message in the channel."
    translation: "A intro do dia um: 30 segundos ao vivo, depois a mensagem no canal."
    note: "Ao vivo + escrito — os dois no dia um."
  - term: "midweek network"
    meaning: 'a rede do meio da semana — coffee chats e 1:1s'
    example: "Midweek is for the network — three coffee chats, two 1:1s."
    translation: "O meio da semana é para a rede — três coffee chats, dois 1:1s."
    note: "Um por dia, nunca todos num dia só."
  - term: "the Friday contribution"
    meaning: 'a contribuição de sexta — a lacuna que vira página'
    example: "By Friday I want one contribution — even a doc fix counts."
    translation: "Até sexta quero uma contribuição — mesmo um conserto de doc conta."
    note: "Fechar a semana com algo escrito por você."
  - term: "first-week posture"
    meaning: 'a postura da primeira semana — curioso e confiante'
    example: "First-week posture: curious, confident, asking — not proving."
    translation: "Postura de primeira semana: curioso, confiante, perguntando — não provando."
    note: "Perguntar é a prova — não saber tudo."
  - term: "pay it forward"
    meaning: 'pagar adiante — devolver ao próximo novato o que te deram'
    example: "Sam gave me the story — I wrote it up to pay it forward."
    translation: "Sam me deu a história — eu escrevi para pagar adiante."
    note: "A lacuna que você preenche serve ao próximo."
  - term: "the new-person window"
    meaning: 'a janela de novato — as quatro semanas de perguntas grátis'
    example: "I'm using the new-person window — questions are free right now."
    translation: "Estou usando a janela de novato — perguntas são grátis agora."
    note: "A metáfora que organiza a semana."
  - term: "read the room"
    meaning: 'ler a sala — quando parar de perguntar na reunião'
    example: "I asked two questions and read the room — saved the rest for the 1:1."
    translation: "Fiz duas perguntas e li a sala — guardei o resto para o 1:1."
    note: "Duas perguntas na reunião, o resto no 1:1."
  - term: "end-of-week recap"
    meaning: 'a recapitulação de fim de semana — o que aprendi, a quem agradecer'
    example: "My end-of-week recap to Dana: what I learned, who I met, the doc I added."
    translation: "Minha recapitulação de sexta para a Dana: o que aprendi, quem conheci, o doc que escrevi."
    note: "Um parágrafo para o manager — visibilidade leve."
  - term: "quick win"
    meaning: 'a vitória rápida — a primeira entrega visível'
    example: "The doc fix was my quick win — small, visible, done."
    translation: "O conserto do doc foi minha vitória rápida — pequena, visível, feita."
    note: "Semana um pede um quick win, não um projeto."
  - term: "shadow a deploy"
    meaning: 'sombrar um deploy — assistir antes de fazer'
    example: "Before I run a deploy myself, I want to shadow one with Ana."
    translation: "Antes de rodar um deploy, quero sombrar um com a Ana."
    note: "Assistir primeiro — fazer depois."
  - term: "that's above my pay grade (yet)"
    meaning: 'isso está acima do meu nível (ainda) — a fronteira honesta do novato'
    example: "Whether to rebuild it is above my pay grade — I'll flag it to Dana."
    translation: "Se vale reconstruir está acima do meu nível — vou sinalizar para a Dana."
    note: "Saber a fronteira do que você decide na semana um."

grammar:
  title: "a gramática dos três cenários"
  explanation: |
    Cada dia-chave tem a moldura da aula que o
    gerou:

    - **Segunda**: "**I'm** Yuri, **joining
      as**…" + "**quick question — how do
      people usually**…?"
    - **Quarta**: "**want to grab a virtual
      coffee? no agenda**" + "**what should
      I know that isn't written down?**"
    - **Sexta**: "**I checked** the wiki —
      **seems stale**; **who owns** it? **mind
      if I add** that to the doc? **I'll write
      it up**."

    E o fecho da semana: o recap ao manager —
    "**what I learned, who I met, what I
    shipped**".
  examples:
    - { en: "Week one checklist: intro Monday, coffee chats midweek, a doc contribution Friday.", pt: "Checklist da semana um: intro segunda, coffee chats no meio, contribuição no doc sexta." }
    - { en: "I asked two questions and read the room — saved the rest for the 1:1.", pt: "Fiz duas perguntas e li a sala — o resto ficou para o 1:1." }
    - { en: "Sam gave me the story — I wrote it up to pay it forward.", pt: "Sam me deu a história — escrevi para pagar adiante." }
    - { en: "The doc fix was my quick win — small, visible, done.", pt: "O conserto do doc foi minha vitória rápida." }
    - { en: "Before I run a deploy myself, I want to shadow one with Ana.", pt: "Antes de rodar um deploy, quero sombrar um com a Ana." }
    - { en: "My recap to Dana: what I learned, who I met, what I shipped.", pt: "Meu recap para a Dana: o que aprendi, quem conheci, o que entreguei." }

