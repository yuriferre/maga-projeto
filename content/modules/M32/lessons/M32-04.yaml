    maxSeconds: 120
    targetPhrases:
      - joining as
      - new here
      - still ramping up
      - quick question
      - how do people usually
      - grab a virtual coffee
      - no agenda
      - what should i know that isn't written down
      - the unwritten rule
      - who else should i meet
      - owns deploys
      - i checked the wiki
      - seems stale
      - who owns
      - mind if i add that to the doc
      - i'll write it up
      - shadow a deploy
      - quick win
      - pay it forward
      - what i learned, who i met
    checklist:
      - "os três dias-chave na ordem"
      - "as três perguntas de ouro na quarta"
      - "a lacuna virando contribuição na sexta"
      - "o recap com aprendido + rede + entrega"
      - "sem calques ('new to', 'on my first day', 'a help', 'the responsible')"

